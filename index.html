/* ---------------- EVENTS ---------------- */
function bindCommitEditHandlers(){
  document.querySelectorAll('[data-edit-commit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!unlocked) return;
      editingCommitId = b.dataset.editCommit;
      renderAll();
    });
  });
  document.querySelectorAll('[data-cancel-edit-commit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!unlocked) return;
      editingCommitId = null;
      renderAll();
    });
  });
  document.querySelectorAll('[data-edit-commit-form]').forEach(f=>{
    f.addEventListener('submit', e=>{
      e.preventDefault();
      if(!unlocked) return;
      const c = state.commitments.find(x=>x.id===f.dataset.editCommitForm);
      const el = e.target;
      const newAmount = Number(el.amount.value)||0;
      const newType = el.type.value;
      const newTotalAmount = newType==='installment' ? (Number(el.totalAmount.value)||0) : null;
      if(newAmount<=0){ alert('لازم المبلغ يكون أكبر من صفر'); return; }
      if(newType==='installment' && newTotalAmount<=0){ alert('لازم تدخل الإجمالي المستهدف للقسط'); return; }
      c.type = newType;
      c.note = el.note.value;
      c.amount = newAmount;
      c.totalAmount = newTotalAmount;
      c.startMonth = el.startMonth.value || c.startMonth;
      c.fundType = el.isElevator && el.isElevator.checked ? 'elevator' : 'general';
      if(!c.aptId && el.kind && el.kind.value) c.kind = el.kind.value;
      editingCommitId = null;
      persist(); renderAll();
    });
  });
}
function bindTabEvents(){

      });

    });
    document.querySelectorAll('[data-commit-pay]').forEach(btn=>{
      btn.addEventListener('click', ()=>{

      else if(group==='noElevator') targets = targets.filter(a=>!a.elevator);
      if(total<=0 || targets.length===0){
        alert('لازم مبلغ أكبر من صفر، ولازم يكون فيه شقق في المجموعة اللي اخترتها.');

      });
    });
    document.querySelectorAll('[data-del-commitpay]').forEach(b=>{
      b.addEventListener('click', ()=>{
        state.commitmentPayments = (state.commitmentPayments||[]).filter(cp=>cp.id!==b.dataset.delCommitpay);
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-del-elevator-spend]').forEach(b=>{
      b.addEventListener('click', ()=>{
        state.elevatorSpends = (state.elevatorSpends||[]).filter(sp=>sp.id!==b.dataset.delElevatorSpend);
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-del-exp-fund]').forEach(b=>{
      b.addEventListener('click', ()=>{
        state.expenses = state.expenses.filter(e=>e.id!==b.dataset.delExpFund);
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-del-payment]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const [mk, aptId] = b.dataset.delPayment.split('|');
        if(state.payments[mk]) delete state.payments[mk][aptId];
        if(state.paymentDates[mk]) delete state.paymentDates[mk][aptId];
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-edit-fund-date]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        if(!unlocked) return;
        const f = state.fundLedger.find(x=>x.id===inp.dataset.editFundDate);
        if(f && inp.value) f.date = inp.value;
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-edit-commitpay-date]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        if(!unlocked) return;
        const cp = (state.commitmentPayments||[]).find(x=>x.id===inp.dataset.editCommitpayDate);
        if(cp && inp.value) cp.date = inp.value;
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-edit-exp-date]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        if(!unlocked) return;
        const e = state.expenses.find(x=>x.id===inp.dataset.editExpDate);
        if(e && inp.value) e.date = inp.value;
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-edit-elevator-spend-date]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        if(!unlocked) return;
        const sp = (state.elevatorSpends||[]).find(x=>x.id===inp.dataset.editElevatorSpendDate);
        if(sp && inp.value) sp.date = inp.value;
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-edit-payment-date]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        if(!unlocked) return;
        const [mk, aptId] = inp.dataset.editPaymentDate.split('|');
        if(!inp.value) return;
        if(!state.paymentDates[mk]) state.paymentDates[mk] = {};
        state.paymentDates[mk][aptId] = inp.value;
        persist(); renderAll();
      });
    });
  }
  if(currentTab==='plans'){
    document.querySelectorAll('[data-plan-toggle]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const p = state.plans.find(x=>x.id===cb.dataset.planToggle);
        p.done = cb.checked;
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-del-plan]').forEach(b=>{
      b.addEventListener('click', ()=>{
        state.plans = state.plans.filter(p=>p.id!==b.dataset.delPlan);
        persist(); renderAll();
      });
    });
    document.getElementById('planForm').addEventListener('submit', e=>{
      e.preventDefault();
      const f = e.target;
      const cost = Number(f.cost.value)||0;
      if(cost<=0){ alert('لازم تكلفة الخطة تكون أكبر من صفر'); return; }
      state.plans.push({id:'p'+Date.now(), item:f.item.value, cost, done:false});
      persist(); renderAll();
    });
  }
  if(currentTab==='apts'){
    document.getElementById('settingsForm').addEventListener('submit', e=>{
      e.preventDefault();
      const f = e.target;
      const elevatorAmount = Number(f.elevatorAmount.value)||0;
      const noElevatorAmount = Number(f.noElevatorAmount.value)||0;
      if(elevatorAmount<=0 || noElevatorAmount<=0){ alert('لازم القيمتين يكونوا أكبر من صفر'); return; }
      state.settings.elevatorAmount = elevatorAmount;
      state.settings.noElevatorAmount = noElevatorAmount;
      persist(); renderAll();
    });
    const lockSettingsForm = document.getElementById('lockSettingsForm');
    if(lockSettingsForm){
      lockSettingsForm.addEventListener('submit', e=>{
        e.preventDefault();
        const f = e.target;
        state.settings.editPin = f.editPin.value || state.settings.editPin;
        state.settings.unlockTaps = Number(f.unlockTaps.value) || state.settings.unlockTaps;
        state.settings.changePinTaps = Number(f.changePinTaps.value) || state.settings.changePinTaps;
        persist(); renderAll();
      });
    }
    document.querySelectorAll('[data-apt-occupied]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const a = state.apartments.find(x=>x.id===cb.dataset.aptOccupied);
        const wasOccupied = a.occupied;
        a.occupied = cb.checked;
        if(!Array.isArray(a.occupancyPeriods)) a.occupancyPeriods = [];
        if(!a.occupied && wasOccupied){
          // بقت شاغرة: نقفل الفترة المفتوحة عند بداية الشهر الجاي، عشان الشهر الحالي يفضل محسوب على الساكن (متأخراته/فلوسه متسحبش)
          const openP = a.occupancyPeriods.find(p=>p.to===null);
          if(openP) openP.to = shiftMonth(currentMonth, 1);
        } else if(a.occupied && !wasOccupied){
          // بقت مأهولة: الاشتراك هيتحسب من الشهر ده وما بعده بس، مش من الأول
          a.occupancyPeriods.push({from: currentMonth, to: null});
          if(a.subscription===0){
            a.subscription = a.elevator ? state.settings.elevatorAmount : state.settings.noElevatorAmount;
          }
        }
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-apt-floor]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const a = state.apartments.find(x=>x.id===sel.dataset.aptFloor);
        a.floor = sel.value;
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-apt-id]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const oldId = inp.dataset.aptId;
        const newId = inp.value.trim();
        if(!newId || newId===oldId){ inp.value = oldId; return; }
        if(state.apartments.some(a=>a.id===newId)){
          alert('رقم الشقة ده مستخدم بالفعل');
          inp.value = oldId;
          return;
        }
        const a = state.apartments.find(x=>x.id===oldId);
        a.id = newId;
        Object.values(state.payments).forEach(monthObj=>{
          if(monthObj[oldId]!==undefined){ monthObj[newId]=monthObj[oldId]; delete monthObj[oldId]; }
        });
        Object.values(state.paymentDates).forEach(monthObj=>{
          if(monthObj[oldId]!==undefined){ monthObj[newId]=monthObj[oldId]; delete monthObj[oldId]; }
        });
        (state.commitments||[]).forEach(c=>{ if(c.aptId===oldId) c.aptId=newId; });
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-apt-name]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const a = state.apartments.find(x=>x.id===inp.dataset.aptName);
        a.name = inp.value;
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-apt-elevator]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const a = state.apartments.find(x=>x.id===cb.dataset.aptElevator);
        a.elevator = cb.checked;
        a.subscription = a.elevator ? state.settings.elevatorAmount : state.settings.noElevatorAmount;
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-apt-sub]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const a = state.apartments.find(x=>x.id===inp.dataset.aptSub);
        a.subscription = Math.max(0, Number(inp.value)||0);
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-del-apt]').forEach(b=>{
      b.addEventListener('click', ()=>{
        state.apartments = state.apartments.filter(a=>a.id!==b.dataset.delApt);
        persist(); renderAll();
      });
    });
    document.getElementById('aptForm').addEventListener('submit', e=>{
      e.preventDefault();
      const f = e.target;
      const newId = f.id.value.trim();
      const subscription = Number(f.subscription.value) || 0;
      if(!newId){ alert('لازم تكتب رقم شقة'); return; }
      if(state.apartments.some(a=>a.id===newId)){
        alert('رقم الشقة ده مستخدم بالفعل — اختار رقم تاني');
        return;
      }
      if(!f.floor.value){ alert('لازم تختار الدور'); return; }
      if(subscription<=0){ alert('لازم الاشتراك الشهري يكون أكبر من صفر'); return; }
      state.apartments.push({
        id: newId, floor: f.floor.value, name: f.name.value,
        subscription, elevator: f.floor.value !== 'الأرضي', occupied:true,
        occupancyPeriods: [{from: currentMonth, to: null}]
      });
      persist(); renderAll();
    });
  }
  if(currentTab==='settings') bindSettingsEvents();
  document.querySelectorAll('[data-goto-settings]').forEach(el=> el.addEventListener('click', ()=>{
    const btn = document.querySelector('#tabbar button[data-tab="settings"]');
    if(btn){ btn.click(); window.scrollTo(0, 0); }
  }));
  /* زرار "احفظ التصنيفات" في مراجعة الحاجات القديمة (بيظهر في المصروفات والالتزامات) */
  const saveKindReview = document.getElementById('saveKindReview');
  if(saveKindReview) saveKindReview.addEventListener('click', ()=>{
    if(!unlocked){ alert('افتح وضع التعديل الأول'); return; }
    let count = 0;
    document.querySelectorAll('[data-review-kind]').forEach(sel=>{
      const [type, id] = sel.dataset.reviewKind.split('|');
      if(!validKind(sel.value)) return;
      if(type==='exp'){
        const e = state.expenses.find(x=> x.id===id);
        if(e){ setExpenseKind(e, sel.value); count++; }
      } else {
        const c = (state.commitments||[]).find(x=> x.id===id);
        if(c){ setCommitKind(c, sel.value); count++; }
      }
    });
    persist(); renderAll();
    alert('اتحفظ تصنيف ' + count + ' حاجة.');
  });
  /* إضافة مرفق لأي حاجة متسجّلة من قبل من غير مرفق (مصروف، حركة صندوق يدوية،
     سداد التزام، صرف أسانسير) — الدبوس ده ممكن يظهر في أي تبويب فيه دفتر حركات. */
  document.querySelectorAll('[data-add-attach]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const file = inp.files && inp.files[0];
      if(!file) return;
      const record = findAttachableRecordById(inp.dataset.addAttach);
      if(!record) return;
      const label = inp.closest('label');
      if(label){ label.style.opacity = '1'; label.textContent = '⏳'; }
      inp.disabled = true;
      const result = await resolveAttachmentFile(file);
      if(result){
        record.attachment = result;
        persist();
      }
      renderAll(); // بيرجّع شكل الدبوس لوضعه الطبيعي في الحالتين (نجاح أو تراجع)
    });
  });
}

document.getElementById('tabbar').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  document.querySelectorAll('#tabbar button').forEach(b=>{
    b.classList.remove('active');
    const ic = b.querySelector('.icon3d');
    if(ic) ic.classList.remove('gold');
  });
  btn.classList.add('active');
  const activeIcon = btn.querySelector('.icon3d');
  if(activeIcon) activeIcon.classList.add('gold');
  renderAll();
});
document.getElementById('prevMonth').addEventListener('click', ()=>{
  if(currentMonth <= START_MONTH) return; // مفيش بيانات قبل أول شهر مسجّل، فمنوقفش تحته
  currentMonth = shiftMonth(currentMonth, -1); renderAll();
});
document.getElementById('nextMonth').addEventListener('click', ()=>{
  currentMonth = shiftMonth(currentMonth, 1); renderAll();
});

let titleTaps = [];
let pendingIntent = 'unlock'; // 'unlock' or 'changePin'
document.querySelector('.hero-title').addEventListener('click', ()=>{
  const now = Date.now();
  titleTaps.push(now);
  titleTaps = titleTaps.filter(t => now - t < 4000);
  const s = state && state.settings;
  if(!s) return;
  const needed = s.unlockTaps || 4;
  const neededChange = s.changePinTaps || 7;
  if(titleTaps.length >= neededChange){
    pendingIntent = 'changePin';
    document.getElementById('lockBtn').classList.add('revealed');
  } else if(titleTaps.length >= needed){
    pendingIntent = 'unlock';
    document.getElementById('lockBtn').classList.add('revealed');
  }
});

document.getElementById('lockBtn').addEventListener('click', ()=>{
  if(unlocked){
    lockNow();
    return;
  }
  document.getElementById('unlockPanel').classList.toggle('show');
  document.getElementById('pinInput').focus();
});
document.getElementById('pinSubmit').addEventListener('click', tryUnlock);
document.getElementById('pinInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') tryUnlock();
});
function tryUnlock(){
  if(booting){
    // لسه بنعرض نسخة الجهاز — أي تعديل دلوقتي هيتمسح أول ما البيانات الجديدة توصل من جوجل شيت
    alert('استنى ثواني لحد ما البيانات الجديدة توصل من جوجل شيت، وبعدين افتح التعديل.');
    return;
  }
  const val = document.getElementById('pinInput').value;
  if(val === state.settings.editPin){
    unlocked = true;
    document.getElementById('unlockPanel').classList.remove('show');
    document.getElementById('pinInput').value='';
    if(pendingIntent==='changePin'){
      currentTab = 'apts';
      document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='apts'));
    }
    pendingIntent = 'unlock';
    titleTaps = [];
    renderAll();
    resetIdleTimer();
  } else {
    document.getElementById('pinInput').value='';
  }
}

function lockNow(){
  unlocked = false;
  document.getElementById('lockBtn').classList.remove('revealed');
  document.getElementById('unlockPanel').classList.remove('show');
  if(idleTimer) clearTimeout(idleTimer);
  renderAll();
}

/* قفل تلقائي بعد فترة عدم استخدام، أو لما الصفحة تتخبى/تتقفل */
let idleTimer = null;
function resetIdleTimer(){
  if(idleTimer) clearTimeout(idleTimer);
  if(!unlocked) return;
  idleTimer = setTimeout(lockNow, 3*60*1000); // 3 دقايق من غير أي تعديل
}
document.addEventListener('click', ()=>{ if(unlocked) resetIdleTimer(); });
document.addEventListener('input', ()=>{ if(unlocked) resetIdleTimer(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && unlocked) lockNow();
});
window.addEventListener('pagehide', ()=>{
  if(unlocked) lockNow();
});

/* أزرار النسخة الاحتياطية اليدوية */
document.getElementById('btnExport').addEventListener('click', exportBackup);
document.getElementById('btnImport').addEventListener('click', function(){
  if(!unlocked){ alert('افتح وضع التعديل الأول (الرمز السري) قبل الاستعادة.'); return; }
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', function(ev){
  const f = ev.target.files && ev.target.files[0];
  if(f) importBackup(f);
  ev.target.value = '';
});

/* فتح سريع: جوجل شيت (Apps Script) بياخد من 3 لـ 10 ثواني عشان يرد، فبدل ما الشاشة
   تفضل فاضية بنعرض فورًا آخر نسخة متحفظة على الجهاز (عرض فقط، مفيش حفظ)، وفي نفس
   الوقت بنقرا من جوجل شيت، وأول ما يرد بنبدّل الشاشة بالبيانات الجديدة ونفتح الحفظ.
   قواعد الحماية زي ما هي: canWrite مش بيبقى true غير بعد قراءة ناجحة من الشيت. */
(async function init(){
  const local = readLocalBackup();
  const cached = local ? safeParse(local.raw) : null;
  if(validState(cached)){
    booting = true;
    state = cached;
    migrateState({noSave:true});
    renderAll();
  }
  const ok = await loadState();
  booting = false;
  if(state) renderAll();          // لو القراءة فشلت خالص، شاشة التوقف هي اللي بتظهر
  if(ok) startSyncPolling();
})();
</script>
</body>
</html>
