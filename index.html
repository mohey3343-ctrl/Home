<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير المالية برج الاندلس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#312d5e;
    --night-2:#1c1a38;
    --wall:#4b4780;
    --wall-2:#6a64ab;
    --paper:#f4f8fe;
    --paper-2:#e9f1fc;
    --ink:#221f42;
    --ink-soft:#647089;
    --lit:#eaa93f;
    --lit-2:#dc8f26;
    --lit-glow:#f6c977;
    --dim:#57538c;
    --dim-2:#4a4678;
    --vacant:#57538c;
    --good:#0fa671;
    --bad:#e24a4a;
    --line:#dde6f5;
    --radius:16px;
    --sidebar-w:64px;
  }
  ::-webkit-scrollbar{width:0;height:0;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace; font-weight:600;}
  h1,h2,h3{font-family:'El Messiri', sans-serif; margin:0;}

  /* ---------- HERO / FACADE ---------- */
  .hero{
    position:relative; overflow:hidden;
    background:linear-gradient(175deg, var(--night) 0%, var(--night-2) 100%);
    padding:16px 14px 20px;
    padding-inline-end:calc(var(--sidebar-w) + 16px);
    border-radius:0 0 26px 26px;
    box-shadow:0 14px 32px rgba(10,8,30,.35);
  }
  .hero::before{
    content:'';
    position:absolute; top:-120px; left:50%; transform:translateX(-50%);
    width:320px; height:320px; border-radius:50%;
    background:radial-gradient(circle, rgba(234,169,63,.20) 0%, rgba(234,169,63,0) 70%);
    pointer-events:none;
  }
  .hero > *{position:relative;}
  .hero-top{
    display:flex; align-items:center; justify-content:space-between;
    color:#fff; margin-bottom:12px;
  }
  .hero-title{color:#fff; font-size:23px; letter-spacing:.3px; font-weight:700;}
  .month-nav{display:flex; align-items:center; gap:10px; color:#fff;}
  .month-nav button{
    background:linear-gradient(155deg, #7a74c7 0%, #4b4780 55%, #38356a 100%);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.5), inset 0 -2px 3px rgba(0,0,0,.3), 0 3px 6px rgba(10,8,30,.4);
    color:#fff; width:32px; height:32px; border-radius:50%;
    font-size:16px; cursor:pointer;
  }
  .month-nav button:active{transform:scale(.92);}
  .month-label{font-family:'IBM Plex Mono'; font-size:15px; min-width:110px; text-align:center;}

  .hero-title{cursor:default; user-select:none;}

  #lockBtn{
    background:transparent; border:none; color:transparent;
    width:6px; height:32px; font-size:0; cursor:default; padding:0;
  }
  #lockBtn.revealed{
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
    color:#fff; width:32px; border-radius:50%; font-size:14px; cursor:pointer;
  }
  #lockBtn.change-mode{
    background:rgba(255,255,255,.35); border:1px solid #fff;
  }
  #tapHint{
    font-size:10.5px; color:#fff; margin-inline-end:2px; white-space:nowrap;
  }
  #unlockPanel{
    display:none; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
    border-radius:10px; padding:8px 10px; margin-bottom:12px; gap:8px;
  }
  #unlockPanel.show{display:flex; align-items:center;}
  #unlockPanel input{
    flex:1; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
    color:#fff; border-radius:8px; padding:7px 10px; font-family:'IBM Plex Mono'; font-size:13px;
  }
  #unlockPanel button{
    background:#fff; color:var(--night); border:none; border-radius:8px;
    padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .view-only-banner{
    background:var(--paper-2); color:var(--ink-soft); font-size:12px; text-align:center;
    padding:8px 10px; border-radius:10px; margin-bottom:12px; border:1px solid var(--line);
  }
  #content.locked input, #content.locked select,
  #content.locked button.pill, #content.locked button.del,
  #content.locked form.inline button, #content.locked .preset,
  #content.locked #settleAllElevatorShares,
  #content.locked input[type=checkbox]{
    pointer-events:none; opacity:.45;
  }
  /* الـ label اللي لافة حوالين أي checkbox (زي "مأهولة"، "أسانسير"، "تحديد الكل") لازم تتقفل هي كمان،
     لأن الضغط على نص الـ label بيفعّل الـ checkbox جواه حتى لو الـ checkbox نفسه pointer-events:none */
  #content.locked label{
    pointer-events:none;
  }
  .facade.locked .win{ pointer-events:none; }

  .balance-hero{
    position:relative;
    background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.22);
    border-radius:18px; padding:16px 16px 14px; margin-bottom:12px; text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 8px 20px rgba(10,8,30,.25);
  }
  .balance-hero .lbl{color:#c9c4ee; font-size:13px;}
  .balance-hero .val{color:#fff; font-size:40px; margin-top:4px; font-weight:700;}
  .balance-hero.balance-neg .val{color:#ffb199;}

  /* ---------- 3D ICON BADGES ---------- */
  .icon3d{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:10px; flex-shrink:0;
    font-size:16px; line-height:1;
    background:linear-gradient(155deg, #7a74c7 0%, #4b4780 55%, #38356a 100%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.55),
      inset 0 -3px 4px rgba(0,0,0,.30),
      0 3px 6px rgba(10,8,30,.45);
    border:1px solid rgba(255,255,255,.18);
  }
  .icon3d.gold{
    background:linear-gradient(155deg, #f8d488 0%, #eaa93f 55%, #c9821f 100%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.7),
      inset 0 -3px 4px rgba(0,0,0,.25),
      0 3px 8px rgba(200,130,20,.4);
  }
  .icon3d.sm{width:24px; height:24px; border-radius:8px; font-size:13px;}
  .icon3d.lg{width:42px; height:42px; border-radius:13px; font-size:21px;}
  .stat-head{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .stat-head .lbl{margin:0;}

  .overview-block{
    position:relative; overflow:hidden;
    background:linear-gradient(175deg, var(--night) 0%, var(--night-2) 100%);
    border-radius:22px; padding:16px 14px 14px; margin-bottom:6px;
    box-shadow:0 14px 32px rgba(10,8,30,.3);
  }
  .overview-block::before{
    content:''; position:absolute; top:-110px; left:50%; transform:translateX(-50%);
    width:300px; height:300px; border-radius:50%;
    background:radial-gradient(circle, rgba(234,169,63,.18) 0%, rgba(234,169,63,0) 70%);
    pointer-events:none;
  }
  .overview-block > *{position:relative;}

  .facade{
    display:flex; flex-direction:column-reverse; gap:4px;
    background:rgba(255,255,255,.12); border-radius:10px; padding:9px 9px 7px;
    border:1px solid rgba(255,255,255,.25);
  }
  .floor-row{display:flex; align-items:center; gap:6px;}
  .floor-label{
    width:40px; flex-shrink:0; color:#cfe0fb; font-size:11px; font-weight:600; text-align:left;
    font-family:'IBM Plex Mono';
  }
  .windows{display:flex; gap:5px; flex:1;}
  .win{
    position:relative;
    flex:1; min-width:0; height:58px; border-radius:8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1px; padding:0 3px;
    transition:transform .12s ease;
    border:1px solid rgba(0,0,0,.12);
  }
  .win .apt-num{
    font-size:13px; font-family:'IBM Plex Mono'; font-weight:700; line-height:1.15;
  }
  .win .apt-name{
    font-size:10px; font-family:'IBM Plex Sans Arabic'; font-weight:600; line-height:1.15;
    max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.92;
  }
  .win .apt-sub{
    font-size:9px; font-family:'IBM Plex Mono'; line-height:1.1; opacity:.85;
  }
  .win .apt-status{
    font-size:9px; font-family:'IBM Plex Sans Arabic'; font-weight:700; line-height:1.2;
    margin-top:1px;
  }
  .win.paid .apt-status{color:#eaf3ff;}
  .win.partial .apt-status,
  .win.unpaid .apt-status{color:#ffd7d2;}
  .win.vacant .apt-status{color:#5b6b93;}
  .win .occ-dot{
    position:absolute; top:4px; left:4px;
    width:9px; height:9px; border-radius:50%;
    border:1px solid rgba(0,0,0,.25);
  }
  .win .occ-dot.occ-yes{ background:#3ddc73; box-shadow:0 0 6px 2px rgba(61,220,115,.85); }
  .win .occ-dot.occ-no{ background:#ff5b4d; box-shadow:0 0 6px 2px rgba(255,91,77,.75); }
  .win:active{transform:scale(.94);}
  .win.paid{
    background:linear-gradient(160deg, #f6c977 0%, #eaa93f 55%, #d69329 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -6px 10px rgba(150,90,10,.25), 0 4px 10px rgba(200,130,20,.35);
    color:#3a2807; border-color:rgba(255,255,255,.35);
  }
  .win.paid .apt-status, .win.paid .apt-sub, .win.paid .apt-name{color:#4a3410;}
  .win.partial{
    background:linear-gradient(160deg, #6a64ab 0%, #4a4678 100%); color:#fff;
    border-inline-start:3px solid var(--lit);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 3px 8px rgba(10,8,30,.3);
  }
  .win.unpaid{
    background:linear-gradient(160deg, #6a64ab 0%, #4a4678 100%); color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 3px 8px rgba(10,8,30,.3);
  }
  .win.vacant{
    background:linear-gradient(160deg, #625d9c 0%, #47437a 100%); color:#e4e1f7;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 3px 8px rgba(10,8,30,.3);
  }
  .win.vacant .apt-name{display:none;}

  .stats{
    display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px;
  }
  .stat{
    background:linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:10px 12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  }
  .stat .lbl{color:#c9c4ee; font-size:12px;}
  .stat .val{color:#fff; font-size:25px; margin-top:2px;}
  .stat.balance-neg .val{color:#ffb199;}

  .collection-progress{
    background:linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:10px 12px 12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
    margin-bottom:12px;
  }
  .cp-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .cp-head .lbl{color:#c9c4ee; font-size:12px;}
  .cp-head .pct{color:#fff; font-size:18px; font-weight:700;}
  .cp-track{
    position:relative; width:100%; height:14px; border-radius:8px;
    background:rgba(255,255,255,.10); overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(10,8,30,.35);
  }
  .cp-fill{
    height:100%; border-radius:8px;
    background:linear-gradient(90deg, var(--lit,#ffcf5c), #ffe28a);
    box-shadow:0 0 8px rgba(255,207,92,.55);
    transition:width .4s ease;
  }
  .cp-fill.cp-low{background:linear-gradient(90deg, #ff8a7a, #ffb199);}
  .cp-sub{display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:#c7d7f5;}

  /* ---------- كارت نصيب الساكن من مصروفات الشهر ---------- */
  .share-card{
    background:linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:10px 12px 12px; margin-bottom:12px; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
    transition:transform .12s ease;
  }
  .share-card:active{transform:scale(.98);}
  .share-card .sc-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .share-card .sc-head .lbl{color:#c9c4ee; font-size:12px;}
  .share-card .sc-head .more{color:var(--lit-glow); font-size:11px; white-space:nowrap;}
  .share-card .sc-tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .share-card .sc-tile{background:rgba(255,255,255,.08); border-radius:10px; padding:8px 10px;}
  .share-card .sc-tile .t{color:#c9c4ee; font-size:11px;}
  .share-card .sc-tile .v{color:#fff; font-size:22px; margin-top:2px;}
  .share-card .sc-tile .v small{font-size:11px; font-weight:400; color:#c7d7f5;}
  .share-card .sc-sub{margin-top:8px; font-size:11px; color:#c7d7f5; display:flex; flex-wrap:wrap; gap:4px 12px;}

  /* ---------- بوب أب التفاصيل ---------- */
  .popup-overlay{
    position:fixed; inset:0; z-index:9000; background:rgba(20,18,45,.62);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .popup-box{
    background:#fff; border-radius:16px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
    padding:14px 16px 16px; box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .popup-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .popup-head h3{font-size:17px; color:var(--ink);}
  .popup-close{background:var(--paper-2); border:none; border-radius:50%; width:30px; height:30px; font-size:14px; cursor:pointer; color:var(--ink-soft);}
  .pp-sec{margin-top:14px;}
  .pp-sec-title{font-size:13px; font-weight:700; color:var(--night); margin-bottom:4px;}
  .pp-row{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
  .pp-row:last-child{border-bottom:none;}
  .pp-row .k{color:var(--ink-soft);}
  .pp-row.total{font-weight:700; color:var(--ink);}
  .pp-row.total .k{color:var(--ink);}
  .pp-row.muted{opacity:.5;}
  .pp-note{font-size:11.5px; color:var(--ink-soft); line-height:1.7; margin-top:4px;}
  .pp-grid{display:grid; grid-template-columns:1.3fr 1fr 1fr; font-size:12.5px; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .pp-grid > div{padding:6px 8px; border-bottom:1px solid var(--line);}
  .pp-grid > div:nth-last-child(-n+3){border-bottom:none;}
  .pp-grid .h{background:var(--paper-2); font-weight:700; font-size:11.5px; color:var(--ink-soft);}
  .pp-grid .n{text-align:center; font-family:'IBM Plex Mono'; font-weight:600;}
  .pp-grid .tot{background:#fff6e3; font-weight:700;}

  /* ---------- TABS: side dock ---------- */
  .tabbar{
    display:flex; flex-direction:column; align-items:center;
    gap:8px; padding:14px 6px 20px;
    background:linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    position:fixed; top:0; bottom:0; inset-inline-end:0; width:var(--sidebar-w);
    border-inline-start:1px solid rgba(255,255,255,.08);
    box-shadow:-6px 0 18px rgba(10,8,30,.25);
    z-index:30; overflow-y:auto;
  }
  .tabbar button{
    all:unset; box-sizing:border-box; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    width:100%; padding:6px 2px 8px; border-radius:12px;
    font-family:'IBM Plex Sans Arabic'; text-align:center;
  }
  .tabbar button .icon3d{width:36px; height:36px; border-radius:11px; font-size:18px;}
  .tabbar button .tab-label{
    font-size:8.5px; color:#b7b1e6; line-height:1.15; white-space:normal;
  }
  .tabbar button.active{background:rgba(255,255,255,.08);}
  .tabbar button.active .tab-label{color:#fff; font-weight:700;}

  .content{padding:14px 14px 60px; padding-inline-end:calc(var(--sidebar-w) + 14px); max-width:640px; margin:0 auto;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:10px;
    box-shadow:0 3px 14px rgba(30,80,190,.06);
  }
  .section-title{font-size:13px; color:var(--ink-soft); margin:16px 0 8px; font-weight:600;}
  .bulk-checkbox{
    width:16px; height:16px; flex-shrink:0; margin:2px 0 0; accent-color:var(--lit); cursor:pointer;
  }

  /* apartment row */
  .apt-row{
    display:flex; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line);
    gap:8px;
  }
  .apt-row:last-child{border-bottom:none;}
  .apt-info{display:flex; flex-direction:column; flex:1; min-width:0;}
  .apt-info .name{font-size:14.5px; font-weight:600;}
  .apt-info .meta{font-size:11.5px; color:var(--ink-soft);}
  .apt-actions{display:flex; align-items:center; gap:6px;}
  .amount-input{
    width:64px; text-align:center; border:1px solid var(--line); border-radius:8px;
    padding:6px 4px; font-family:'IBM Plex Mono'; font-size:13px;
  }
  .pill{
    font-size:11px; padding:5px 10px; border-radius:20px; border:none; cursor:pointer;
    font-family:'IBM Plex Sans Arabic'; font-weight:600;
  }
  .pill.pay{background:var(--good); color:#fff;}
  .pill.pay.done{background:#e9f5ef; color:var(--good); border:1px solid var(--good);}
  .vacant-tag{font-size:11px; color:var(--ink-soft); background:var(--paper-2); padding:4px 10px; border-radius:20px;}
  .export-btn{
    font-size:12px; padding:7px 14px; border-radius:20px; border:none; cursor:pointer;
    font-family:'IBM Plex Sans Arabic'; font-weight:600; background:var(--ink); color:#fff;
  }

  .floor-group-title{
    font-size:11px; color:#8b98b5; margin:14px 0 2px; letter-spacing:.5px;
  }

  /* expenses / fund list */
  .tx-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .tx-row:last-child{border-bottom:none;}
  .tx-main{display:flex; flex-direction:column;}
  .tx-main .note{font-weight:600;}
  .tx-main .date{font-size:11px; color:var(--ink-soft);}
  .tx-amt.out{color:var(--bad);}
  .tx-amt.in{color:var(--good);}
  .tx-attach{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:6px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    font-size:12px; text-decoration:none; cursor:pointer;
  }
  .exp-file-name{font-size:11px; color:var(--ink-soft); margin-inline-start:4px;}

  form.inline{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  form.inline input, form.inline select{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:'IBM Plex Sans Arabic'; font-size:13px; flex:1; min-width:100px;
  }
  form.inline button{
    background:var(--ink); color:#fff; border:none; border-radius:8px;
    padding:8px 16px; font-size:13px; cursor:pointer; font-weight:600;
  }
  .preset-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .preset{
    font-size:11.5px; background:var(--paper-2); border:1px solid var(--line);
    border-radius:20px; padding:5px 10px; cursor:pointer; color:var(--ink-soft);
  }

  .plan-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .plan-row:last-child{border-bottom:none;}
  .plan-row .item{flex:1; font-size:13.5px;}
  .plan-row.done .item{text-decoration:line-through; color:#a2acc4;}
  .plan-row input[type=checkbox]{width:18px; height:18px; accent-color:var(--good);}

  .empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 0;}
  .note-strip{
    background:#eaf2ff; border:1px solid #bcd6fb; border-radius:10px; padding:9px 12px;
    font-size:12px; color:#1e4fa8; margin-bottom:12px;
  }
  .del{background:none; border:none; color:#a7b2c9; cursor:pointer; font-size:15px; padding:2px 6px;}
  /* خانة البحث في الصندوق — شغّالة حتى في وضع العرض فقط */
  .search-input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 12px;
    font-family:'IBM Plex Sans Arabic'; font-size:13.5px; background:var(--paper); color:var(--ink);
  }
  .search-input:focus{outline:none; border-color:var(--wall-2); background:#fff;}
  #content.locked input.search-input{pointer-events:auto; opacity:1;}
  .search-info{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}
  .search-info:empty{display:none;}

  /* ---------- أنواع المصروفات (القوايم + صفحة الإعدادات) ---------- */
  .kind-select{
    border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:#fff; color:var(--ink);
    font-family:'IBM Plex Sans Arabic'; font-size:12.5px; max-width:100%;
  }
  form.inline select.kind-select{flex:1; min-width:140px;}
  .kind-row{padding:10px 0; border-bottom:1px solid var(--line);}
  .kind-row:last-child{border-bottom:none;}
  .kind-top, .kind-bottom{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .kind-bottom{margin-top:8px;}
  .kind-row input, .kind-row select{
    border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-family:'IBM Plex Sans Arabic'; font-size:13px;
  }
  .kind-icon{width:48px; text-align:center;}
  .kind-name{flex:1; min-width:120px; font-weight:600;}
  .kind-used{font-size:11px; color:var(--ink-soft); white-space:nowrap;}
  .kind-pct{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--ink-soft);}
  .kind-pct input{width:64px; text-align:center;}
  .kind-fixed{flex:1; min-width:150px;}
  .kind-hint{font-size:11.5px; color:var(--ink-soft); margin-top:6px; line-height:1.6;}
  .arrear-amount-input{
    width:78px; text-align:center; border:1px solid var(--line); border-radius:8px;
    padding:5px 4px; font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--bad); font-weight:600;
    background:#fff5f5;
  }

  /* ================= Design system: ليل البرج (Night Tower) ================= */
  :root{ --sidebar-w:0px; --night-card:#232048; --lit-edge:#eaa93f; --unpaid-win:#3b3870; --vacant-win:#28254f; --vacant-ink:#8f8ac6; --muted-on-night:#b8b3e6; --warn-on-night:#ffb5ab; --shadow-night:0 10px 26px rgba(10,8,30,.22); --shadow-card:0 2px 10px rgba(30,40,90,.05); }

  /* Header */
  .hero{ padding:16px 16px 18px; border-radius:0 0 26px 26px; box-shadow:0 10px 28px rgba(10,8,30,.28); }
  .hero::before{ top:-140px; left:-60px; transform:none; width:280px; height:280px;
    background:radial-gradient(circle, rgba(234,169,63,.22) 0%, rgba(234,169,63,0) 70%); }
  .hero-top{ margin-bottom:10px; }
  .hero-title{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:38px; height:38px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(165deg, var(--lit-glow), var(--lit-2)); box-shadow:0 0 18px rgba(234,169,63,.45); }
  .brand-mark svg{ width:24px; height:24px; }
  .brand-text{ display:flex; flex-direction:column; }
  .brand-t1{ font-family:'El Messiri', sans-serif; font-size:20px; font-weight:700; line-height:1.2; color:#fff; }
  .brand-t2{ font-family:'IBM Plex Sans Arabic', sans-serif; font-size:11.5px; font-weight:400; color:var(--muted-on-night); }
  .month-nav{ gap:6px; }
  .month-nav button:not(#lockBtn){ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); box-shadow:none;
    width:30px; height:30px; font-size:15px; line-height:1; }
  .month-label{ font-size:13px; min-width:92px; font-weight:600; }
  #lockBtn:not(.revealed){ box-shadow:none; }

  /* Flat icons (no 3D bevel) */
  .icon3d, .icon3d.gold{ background:none; box-shadow:none; border:none; }

  /* Overview: balance on night, KPIs on white, facade on night */
  .overview-block{ background:none; box-shadow:none; padding:0; border-radius:0; overflow:visible; }
  .overview-block::before{ display:none; }
  .balance-hero{ overflow:hidden; text-align:start; border-radius:20px; padding:18px;
    background:linear-gradient(175deg, var(--night) 0%, var(--night-2) 100%);
    border:1px solid rgba(255,255,255,.1); box-shadow:var(--shadow-night); }
  .balance-hero::before{ content:''; position:absolute; top:-90px; left:-50px; width:240px; height:240px; border-radius:50%;
    background:radial-gradient(circle, rgba(234,169,63,.28) 0%, rgba(234,169,63,0) 70%); pointer-events:none; }
  .balance-hero > *{ position:relative; }
  .balance-hero .icon3d{ display:none; }
  .balance-hero .lbl{ color:#c9c4ee; font-size:12.5px; }
  .balance-hero .val{ font-size:38px; margin-top:2px; }

  .stats{ gap:10px; }
  .stat{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow-card); }
  .stat .icon3d{ display:none; }
  .stat .lbl{ color:var(--ink-soft); font-size:11.5px; }
  .stat .val{ color:var(--ink); font-size:21px; }
  .stat .val span{ color:var(--ink-soft) !important; }
  .stat.balance-neg .val{ color:#d23c3c; }

  .collection-progress{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow-card); }
  .cp-head .lbl{ color:var(--ink-soft); }
  .cp-head .pct{ color:var(--ink); }
  .cp-track{ height:10px; border-radius:99px; background:#e6ebf5; box-shadow:none; }
  .cp-fill{ border-radius:99px; background:linear-gradient(90deg, var(--lit-2), var(--lit-glow)); box-shadow:none; }
  .cp-fill.cp-low{ background:linear-gradient(90deg, #e24a4a, #ff8a7a); }
  .cp-sub{ color:var(--ink-soft); }

  .share-card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow-card); }
  .share-card .sc-head .lbl{ color:var(--ink-soft); }
  .share-card .sc-head .more{ color:var(--night); font-weight:600; }
  .share-card .sc-tile{ background:var(--paper); border:1px solid var(--line); }
  .share-card .sc-tile .t{ color:var(--ink-soft); }
  .share-card .sc-tile .v{ color:var(--ink); font-size:20px; }
  .share-card .sc-tile .v small, .share-card .sc-sub{ color:var(--ink-soft); }

  .facade{ background:var(--night-card); border:none; border-radius:18px; padding:12px 10px 10px; box-shadow:var(--shadow-night); gap:6px; }
  .floor-label{ color:var(--muted-on-night); }
  .windows{ gap:6px; }
  .win{ border:1px solid transparent; }
  .win.paid{ background:linear-gradient(165deg, var(--lit-glow), var(--lit)); border-color:rgba(255,255,255,.3);
    box-shadow:0 0 14px rgba(234,169,63,.45); }
  .win.partial{ background:var(--wall); border-inline-start:1px solid transparent; box-shadow:inset -3px 0 0 var(--lit-edge); }
  .win.unpaid{ background:var(--unpaid-win); box-shadow:none; }
  .win.partial .apt-status, .win.unpaid .apt-status{ color:var(--warn-on-night); }
  .win.vacant{ background:var(--vacant-win); color:var(--vacant-ink); border:1px dashed var(--wall); box-shadow:none; }
  .win.vacant .apt-status{ color:var(--vacant-ink); }

  /* Tabs: bottom bar (scrolls sideways on narrow phones) */
  .tabbar{ flex-direction:row; justify-content:safe center; align-items:stretch;
    top:auto; bottom:0; left:0; right:0; width:auto; height:auto; gap:2px;
    padding:8px 6px calc(10px + env(safe-area-inset-bottom));
    background:#fff; border-inline-start:none; border-top:1px solid var(--line);
    box-shadow:0 -6px 20px rgba(30,40,90,.08); overflow-x:auto; overflow-y:hidden; }
  .tabbar button{ width:auto; min-width:66px; flex-shrink:0; padding:4px 4px 2px; gap:3px; border-radius:12px; }
  .tabbar button .icon3d{ width:44px; height:30px; border-radius:10px; color:#8a90a8; }
  .tabbar button .icon3d svg{ width:22px; height:22px; }
  .tabbar button .icon3d.gold{ background:#fdf1dc; color:var(--night); }
  .tabbar button .tab-label{ font-size:10px; color:var(--ink-soft); white-space:nowrap; }
  .tabbar button.active{ background:none; }
  .tabbar button.active .tab-label{ color:var(--night); font-weight:700; }

  .content{ padding:14px 14px 100px; padding-inline-end:14px; }

  /* ================= بوب أب نصيب الساكن (ليل البرج) ================= */
  .popup-box{ padding:0 0 14px; background:var(--paper); border-radius:18px; }
  .popup-head{ position:sticky; top:0; z-index:2; margin:0; padding:14px 16px 12px;
    background:linear-gradient(175deg, var(--night) 0%, var(--night-2) 100%); border-radius:18px 18px 0 0; }
  .popup-head h3{ color:#fff; font-size:17px; }
  .popup-close{ background:rgba(255,255,255,.12); color:#fff; }
  .pp-chips{ display:flex; flex-wrap:wrap; gap:6px; padding:12px 14px 0; }
  .pp-chip{ font-size:11.5px; color:var(--ink-soft); background:#fff; border:1px solid var(--line); border-radius:99px; padding:3px 10px; }
  .pp-chip b{ color:var(--ink); }
  .pp-summary{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 14px 0; }
  .pp-sum-tile{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; }
  .pp-sum-tile span{ font-size:11.5px; color:var(--ink-soft); }
  .pp-sum-tile b{ font-size:24px; color:var(--ink); line-height:1.2; margin-top:2px; }
  .pp-sum-tile small{ font-size:10.5px; color:var(--ink-soft); }
  .pp-sec{ margin:10px 14px 0; background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 12px; box-shadow:var(--shadow-card); }
  .pp-sec-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    padding-bottom:8px; margin-bottom:6px; border-bottom:1px solid var(--line); }
  .pp-sec-title{ font-size:14px; font-weight:700; color:var(--night); margin:0; }
  .pp-split{ font-size:10.5px; color:var(--night); background:#fdf1dc; border-radius:99px; padding:2px 9px; white-space:nowrap; }
  .pp-subtitle{ font-size:12px; font-weight:700; color:var(--ink); margin:10px 0 2px; }
  .pp-note{ font-size:12px; color:var(--ink-soft); line-height:1.7; margin:2px 0 6px; }
  .pp-note.warn{ color:#9a4a00; background:#fff4e0; border-radius:8px; padding:6px 8px; }
  .pp-foot{ font-size:11px; color:var(--ink-soft); line-height:1.6; margin-top:6px; }
  .pp-row{ align-items:center; padding:8px 0; font-size:13px; }
  .pp-row .k{ display:flex; flex-direction:column; gap:2px; color:var(--ink); min-width:0; }
  .pp-row .k small{ font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .pp-row .v{ white-space:nowrap; font-size:14px; color:var(--ink); }
  .pp-row .v small{ font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Sans Arabic'; font-weight:400; }
  .pp-row.total{ margin-top:4px; padding:9px 10px; background:var(--paper); border:none; border-radius:10px; }
  .pp-row.total .v{ font-size:16px; }
  .pp-row.split .k{ color:var(--ink-soft); }
  .pp-row.split .v{ color:var(--night); }
  .pp-badge{ display:inline-block; font-size:10.5px; font-weight:600; border-radius:99px; padding:1px 8px; line-height:1.6; font-family:'IBM Plex Sans Arabic'; }
  .pp-badge.warn{ background:#fff1e0; color:#9a4a00; }
  .pp-badge.soft{ background:var(--paper-2); color:var(--ink-soft); }
  .pp-grid{ grid-template-columns:1.4fr 1fr 1fr; border-radius:10px; }
  .pp-grid .h{ background:var(--paper); color:var(--ink-soft); }
  .pp-grid .tot{ background:#fdf1dc; color:var(--ink); }
  .pp-table{ display:grid; grid-template-columns:1.35fr 1fr .8fr 1fr 1fr; font-size:12px; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:4px 0 8px; }
  .pp-table > div{ padding:7px 6px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .pp-table > div:nth-last-child(-n+5){ border-bottom:none; }
  .pp-table .h{ background:var(--paper); color:var(--ink-soft); font-weight:700; font-size:11px; }
  .pp-table .n{ justify-content:center; font-family:'IBM Plex Mono'; font-weight:600; text-align:center; }
  .pp-table .n small{ font-family:'IBM Plex Sans Arabic'; font-weight:400; font-size:10px; color:var(--ink-soft); }
  .pp-table .strong{ color:var(--night); font-weight:700; }
  .pp-table .est{ background:#fbf8f1; color:var(--ink-soft); }
  .pp-table .strong.est{ color:var(--night); }

  /* ================= كشف الحساب + ساكن مشي/جديد ================= */
  .pp-badge.ok{ background:#e6f6ef; color:#0b7a53; }
  .pp-badge.bad{ background:#fdeaea; color:#b23434; }
  .pp-field{ display:flex; flex-direction:column; gap:4px; margin:8px 0; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .pp-field.row{ flex-direction:row; align-items:center; gap:8px; color:var(--ink); }
  .pp-field input[type=text], .pp-field input[type=month], .pp-field input[type=number]{
    border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-family:'IBM Plex Sans Arabic'; font-size:14px; color:var(--ink); background:#fff; }
  .pp-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .pp-btn{ border:none; border-radius:10px; padding:9px 16px; font-family:'IBM Plex Sans Arabic'; font-size:13px; font-weight:700; cursor:pointer;
    background:var(--night); color:#fff; }
  .pp-btn.ghost{ background:var(--paper-2); color:var(--ink); }
  .st-row{ flex-wrap:wrap; gap:6px; }
  .st-row.sub{ padding:4px 0 4px; border-bottom:none; }
  .st-edit{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .st-edit.add{ margin:4px 0 8px; }
  .st-in{ width:72px; border:1px solid var(--line); border-radius:8px; padding:5px 6px; font-family:'IBM Plex Mono'; font-size:12.5px; text-align:center; }
  .st-date{ border:1px solid var(--line); border-radius:8px; padding:4px 5px; font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-soft); max-width:128px; }
  .st-mini{ border:1px solid var(--line); background:#fff; color:var(--night); border-radius:8px; padding:4px 8px; font-size:12px; font-weight:700; cursor:pointer; font-family:'IBM Plex Sans Arabic'; }
  .st-mini.del{ color:#b23434; }
  .st-commit{ border-top:1px dashed var(--line); margin-top:4px; }
  .st-link{ cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; }

  /* ================= تقرير المتأخرات PDF (بيظهر في الطباعة بس) ================= */
  #printArea{ display:none; }
  @media print{
    @page{ size:A4; margin:12mm; }
    body.printing{ background:#fff !important; }
    body.printing > *:not(#printArea){ display:none !important; }
    body.printing #printArea{ display:block !important; color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif;
      -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  .pr-head{ display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 16px; margin-bottom:12px;
    background:linear-gradient(175deg, var(--night) 0%, var(--night-2) 100%); color:#fff; border-radius:14px; }
  .pr-title{ font-family:'El Messiri', sans-serif; font-size:20px; font-weight:700; }
  .pr-meta{ font-size:11.5px; color:#c9c4ee; margin-top:2px; }
  .pr-total{ display:flex; flex-direction:column; align-items:flex-end; background:rgba(255,255,255,.1); border-radius:10px; padding:8px 14px; }
  .pr-total span{ font-size:11px; color:#c9c4ee; }
  .pr-total b{ font-size:22px; color:var(--lit-glow); }
  .pr-total small{ font-size:10.5px; color:#c9c4ee; }
  .pr-table{ width:100%; border-collapse:collapse; font-size:11.5px; }
  .pr-table th{ background:var(--paper-2); color:var(--ink-soft); font-weight:700; text-align:right; padding:7px 8px; border-bottom:2px solid var(--line); }
  .pr-table td{ padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .pr-table tr{ page-break-inside:avoid; }
  .pr-table .c{ text-align:center; }
  .pr-table tfoot td{ background:#fdf1dc; font-weight:700; border-bottom:none; }
  .pr-sub{ font-size:10px; color:var(--ink-soft); font-weight:400; }
  .pr-chip{ display:inline-block; background:#fdeaea; color:#9b2c2c; border-radius:6px; padding:1px 6px; margin:1px 0; white-space:nowrap; font-size:10.5px; }
  .pr-chip b{ font-family:'IBM Plex Mono'; }
  .pr-foot{ font-size:10px; color:var(--ink-soft); margin-top:8px; }
  .pr-table th.c{ text-align:center; white-space:nowrap; }
  .pr-table td.owed, .pr-table .owed{ color:#b23434; font-weight:600; }
  .pr-table .nil{ color:#c3c9d6; }
  .pr-table tfoot td.grand{ color:var(--night); font-size:13px; }
  .pr-table tfoot tr.cnt td{ background:#fff8ea; font-weight:400; color:var(--ink-soft); font-size:10.5px; }
  .pdf-host.wide{ width:1100px; }
  .pr-block{ margin-top:14px; page-break-inside:avoid; }
  .pr-sec-title{ font-weight:700; color:var(--night); font-size:13px; margin-bottom:6px; }
  .pr-summary{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .pr-summary > div{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:2px; }
  .pr-summary span{ font-size:10.5px; color:var(--ink-soft); }
  .pr-summary b{ font-size:16px; color:var(--ink); }
  .pr-summary .neg b{ color:#b23434; }
  .pr-summary .pos b{ color:#0b7a53; }
  .pr-msg{ background:#fff4e0; border:1px solid #f3d29a; border-radius:12px; padding:10px 12px; font-size:13px; line-height:1.8; color:#5a3a00; }
  .pr-msg-main{ font-weight:700; }
  .pr-msg-note{ margin-top:4px; }
  .pr-pay{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .pr-pay-item{ display:flex; align-items:baseline; gap:8px; font-size:13px; line-height:2; }
  .pr-dot{ color:var(--lit-2); font-size:9px; }
  .rp-text{ width:100%; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-family:'IBM Plex Sans Arabic'; font-size:13px; color:var(--ink); resize:vertical; font-weight:400; }
  #content.locked textarea{ pointer-events:none; opacity:.45; }
  .pdf-host{ position:fixed; top:0; left:-10000px; width:760px; padding:16px; background:#fff; color:var(--ink);
    direction:rtl; font-family:'IBM Plex Sans Arabic', sans-serif; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <div class="hero-title"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="#312d5e" aria-hidden="true"><rect x="7" y="4" width="10" height="17" rx="1.5"/><rect x="9.3" y="7" width="2" height="2" rx=".4" fill="#f6c977"/><rect x="12.7" y="7" width="2" height="2" rx=".4" fill="#f6c977"/><rect x="9.3" y="11" width="2" height="2" rx=".4" fill="#f6c977"/><rect x="12.7" y="15" width="2" height="2" rx=".4" fill="#f6c977"/></svg></span><span class="brand-text"><span class="brand-t1">برج الأندلس</span><span class="brand-t2">التقارير المالية</span></span></div>
    <div class="month-nav">
      <button id="lockBtn" title="">🔒</button>
      <button id="prevMonth">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonth">›</button>
    </div>
  </div>
  <div id="unlockPanel">
    <input type="password" id="pinInput" inputmode="numeric">
    <button id="pinSubmit">فتح</button>
  </div>
  <div id="syncStatus" style="font-size:10.5px; text-align:center; color:#bfe0ff; margin:-4px 0 6px;">🔄 بيتزامن مع جوجل شيت...</div>
  <div id="backupRow" style="display:none; gap:8px; justify-content:center; margin:0 0 10px;">
    <button id="btnExport" style="font-size:10.5px; padding:5px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.10); color:#dceaff; font-family:inherit; cursor:pointer;">⬇️ نزّل نسخة احتياطية</button>
    <button id="btnImport" style="font-size:10.5px; padding:5px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.10); color:#dceaff; font-family:inherit; cursor:pointer;">⬆️ استرجاع من ملف</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
  </div>
</div>

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function arrearsAsOfMonth(){
  const realMonth = todayStr().slice(0,7);
  return currentMonth < realMonth ? currentMonth : realMonth;
}

function monthKey(y,m){ return y+'-'+String(m).padStart(2,'0'); }
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return MONTH_NAMES[m-1] + ' ' + y;
}
function shiftMonth(key, delta){
  let [y,m] = key.split('-').map(Number);
  m += delta;
  if(m>12){m=1;y++;} if(m<1){m=12;y--;}
  return monthKey(y,m);
}

/* ---------------- شيت جوجل كقاعدة بيانات مشتركة ---------------- */
/* غيّر الرابط ده لو عملت نشر (Deploy) جديد للسكريبت وطلع لك رابط مختلف */
const REMOTE_DB_URL = 'https://script.google.com/macros/s/AKfycbz1_5VB0BEdJt6w0GiajPA2Rwdyx63CWSaYhZ2EYfu9EG038vZmsgDleAYxZrW1-Ch3aA/exec';

/* رابط سكريبت رفع المرفقات على جوجل درايف (ملف Attachments.gs — نشر منفصل).
   لو فاضي: المرفقات بتتحفظ جوه الشيت زي الأول (وده اللي بيخلّي الحفظ يفشل لما الحجم يكبر).
   لو متعبّي: المرفق بيترفع على درايف وبيتحفظ في الشيت رابطه بس. */
const ATTACH_UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbxYa9M4dq4gIQ2xjpmd_jAOTwDL3jsQ3mNgVOKS_bdnwsW7Tj0wbvXZdMPuZt4EERtl/exec';

async function uploadAttachmentToDrive(att){
  const comma = att.dataUrl.indexOf(',');
  const res = await fetch(ATTACH_UPLOAD_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // نص عادي عشان نتفادى preflight
    body: JSON.stringify({action:'upload', name: att.name, type: att.type, data: att.dataUrl.slice(comma+1)})
  });
  const txt = await res.text();
  let json = null;
  try{ json = JSON.parse(txt); }catch(e){}
  if(!json || json.ok !== true || !json.url){
    throw new Error((json && json.error) || 'رد غير مفهوم من سكريبت المرفقات (راجع إن النشر Anyone)');
  }
  return {name: att.name, type: att.type, id: json.id, url: json.url};
}

/* ================== طبقة القراءة والحفظ — نسخة محميّة ==================
   اللي حصل قبل كده: لو القراءة من جوجل شيت فشلت لأي سبب (نت ضعيف، صلاحيات
   النشر، رد غير متوقع من السكريبت)، البرنامج كان بيفهم إن قاعدة البيانات فاضية،
   فيبدأ ببيانات افتراضية (seed) ويحفظها فوق البيانات الحقيقية.

   القواعد الجديدة:
   1) ممنوع أي كتابة قبل ما نتأكد إن القراءة نجحت (canWrite).
   2) بنفرّق بين "فشل القراءة" و"قاعدة البيانات فاضية فعلاً".
   3) مفيش بيانات افتراضية بتتكتب تلقائيًا — لازم قرار صريح منك.
   4) كل نسخة بتتقرأ بنجاح بتتخزّن نسخة منها على الجهاز كـ backup.
   5) السيرفر نفسه بيرفض أي حفظ بينقّص البيانات فجأة (شوف Code.gs). */

const LOCAL_BACKUP_KEY = STORE_KEY + '::backup';
let lastSyncedRaw = null;
let syncTimer = null;
let canWrite = false;        // مفيش حفظ خالص قبل قراءة ناجحة
let readOnlyReason = '';
let booting = false;         // true = بنعرض نسخة الجهاز لحد ما القراءة من جوجل شيت تخلص

function setSyncStatus(txt, isError){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = txt;
  el.style.color = isError ? '#ffc2c2' : '#bfe0ff';
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

function saveLocalBackup(raw){
  try{
    localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify({at: new Date().toISOString(), raw: raw}));
    localStorage.setItem('data', raw);
  }catch(e){}
}

function readLocalBackup(){
  try{
    const s = localStorage.getItem(LOCAL_BACKUP_KEY);
    if(s){
      const o = JSON.parse(s);
      if(o && o.raw) return o;
    }
    const legacy = localStorage.getItem('data');
    if(legacy) return {at:null, raw:legacy};
  }catch(e){}
  return null;
}

function validState(obj){
  return !!obj && typeof obj === 'object' && Array.isArray(obj.apartments) && obj.apartments.length > 0;
}

/* ---- شاشة توقف كاملة: بتظهر لما نبقى مش متأكدين من البيانات، وبتمنع أي شغل ---- */
function showBlocker(title, msg, buttons){
  let ov = document.getElementById('blockerOverlay');
  if(ov) ov.remove();
  ov = document.createElement('div');
  ov.id = 'blockerOverlay';
  ov.setAttribute('style','position:fixed; inset:0; background:rgba(11,26,52,.92); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;');
  const box = document.createElement('div');
  box.setAttribute('style','background:#fff; border-radius:16px; max-width:420px; width:100%; padding:20px; text-align:center; font-family:inherit; box-shadow:0 20px 50px rgba(0,0,0,.35);');
  const h = document.createElement('div');
  h.setAttribute('style','font-size:16px; font-weight:800; color:#0b1a34; margin-bottom:8px;');
  h.textContent = title;
  const p = document.createElement('div');
  p.setAttribute('style','font-size:13px; line-height:1.8; color:#3d4b66; margin-bottom:16px; white-space:pre-line;');
  p.textContent = msg;
  box.appendChild(h); box.appendChild(p);
  (buttons||[]).forEach(function(b){
    const btn = document.createElement('button');
    btn.textContent = b.label;
    btn.setAttribute('style','display:block; width:100%; margin:6px 0; padding:11px; border-radius:10px; border:1px solid ' + (b.danger?'#e2b4b4':'#bcd6fb') + '; background:' + (b.danger?'#fff5f5':'#eaf2ff') + '; color:' + (b.danger?'#a12b2b':'#1e4fa8') + '; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer;');
    btn.onclick = b.onClick;
    box.appendChild(btn);
  });
  ov.appendChild(box);
  document.body.appendChild(ov);
}
function hideBlocker(){
  const ov = document.getElementById('blockerOverlay');
  if(ov) ov.remove();
}

/* ---------------- القراءة من جوجل شيت ---------------- */
/* بترجّع {ok:true, value:'...'} أو {ok:true, value:null} (فاضية فعلاً)
   أو {ok:false, error:'...'} (فشل — ومفيش أي كتابة في الحالة دي) */
async function remoteGetOnce(key){
  const res = await fetch(REMOTE_DB_URL + '?key=' + encodeURIComponent(key), {cache:'no-store'});
  if(!res.ok) throw new Error('السيرفر رجّع كود ' + res.status);
  const txt = await res.text();
  let json;
  try{ json = JSON.parse(txt); }
  catch(e){ throw new Error('رد غير مفهوم من السكريبت (راجع صلاحيات النشر: Anyone)'); }
  if(!json || typeof json !== 'object' || !('value' in json)) throw new Error('الرد ناقص من السكريبت');
  const v = json.value;
  if(v === null || v === undefined || String(v).trim() === '') return {ok:true, value:null};
  return {ok:true, value:String(v)};
}

async function remoteGet(key, tries){
  if(!REMOTE_DB_URL) return {ok:false, error:'مفيش رابط لقاعدة البيانات'};
  tries = tries || 3;
  let lastErr = null;
  for(let i=0; i<tries; i++){
    try{ return await remoteGetOnce(key); }
    catch(e){
      lastErr = e;
      if(i < tries-1) await sleep(900*(i+1));
    }
  }
  return {ok:false, error: lastErr ? lastErr.message : 'سبب غير معروف'};
}

async function remoteSet(key, value, force){
  const res = await fetch(REMOTE_DB_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // نص عادي عشان نتفادى preflight
    body: JSON.stringify({key:key, value:value, force: !!force})
  });
  const txt = await res.text();
  let json = null;
  try{ json = JSON.parse(txt); }catch(e){}
  if(!json || json.ok !== true){
    const err = new Error((json && json.error) || 'الحفظ ما تمّش');
    err.code = json && json.code;
    err.info = json;
    throw err;
  }
  return json;
}

/* ---------------- تحميل البيانات أول ما التطبيق يفتح ---------------- */
async function loadState(){
  setSyncStatus(booting
    ? '⚡ معروض من آخر نسخة على الجهاز — بيحدّث من جوجل شيت...'
    : '🔄 بيقرأ البيانات من جوجل شيت...');
  const r = await remoteGet('data');

  // 1) قراءة ناجحة وفيها بيانات
  if(r.ok && r.value){
    let parsed = null;
    try{ parsed = JSON.parse(r.value); }catch(e){}
    if(!validState(parsed)){
      canWrite = false;
      readOnlyReason = 'البيانات اللي في الشيت مش سليمة';
      setSyncStatus('⛔ البيانات اللي في جوجل شيت مش مقروءة — الحفظ متوقف', true);
      showBlocker('البيانات في جوجل شيت مش سليمة',
        'التطبيق قرأ الشيت بس مش قادر يفهم المحتوى، فوقف الحفظ عشان مايكتبش فوق حاجة.\nافتح الشيت وارجع نسخة سابقة من: ملف ← سجل الإصدارات.',
        [{label:'حاول تاني', onClick: retryLoad}]);
      return false;
    }
    lastSyncedRaw = r.value;
    state = parsed;
    canWrite = true;
    saveLocalBackup(r.value);
    setSyncStatus('🟢 متصل بجوجل شيت');
    migrateState();
    return true;
  }

  const local = readLocalBackup();

  // 2) فشل الاتصال — ممنوع الكتابة تمامًا
  if(!r.ok){
    canWrite = false;
    readOnlyReason = 'مفيش اتصال بجوجل شيت';
    setSyncStatus('🟠 مش متصل بجوجل شيت — الحفظ متوقف', true);
    const btns = [{label:'حاول تاني', onClick: retryLoad}];
    if(local && validState(safeParse(local.raw))){
      btns.push({label:'اعرض آخر نسخة على الجهاز (عرض فقط)', onClick: function(){
        state = safeParse(local.raw);
        migrateState();
        hideBlocker();
        renderAll();
        setSyncStatus('👁️ عرض فقط من نسخة الجهاز — أي تعديل مش هيتحفظ', true);
      }});
    }
    showBlocker('مش قادر أوصل لقاعدة البيانات',
      'السبب: ' + r.error + '\nالتطبيق وقف الحفظ عشان مايمسحش البيانات الموجودة في جوجل شيت.',
      btns);
    return false;
  }

  // 3) الاتصال تمام بس قاعدة البيانات فاضية فعلاً
  canWrite = false;
  readOnlyReason = 'قاعدة البيانات فاضية';
  setSyncStatus('⚠️ قاعدة البيانات فاضية — مفيش حفظ تلقائي', true);
  const btns = [{label:'حاول تاني', onClick: retryLoad}];
  if(local && validState(safeParse(local.raw))){
    btns.push({label:'ارفع آخر نسخة محفوظة على الجهاز' + (local.at ? ' (' + new Date(local.at).toLocaleString('ar-EG') + ')' : ''), onClick: async function(){
      const parsed = safeParse(local.raw);
      state = parsed;
      canWrite = true;
      lastSyncedRaw = null;
      hideBlocker();
      await persist({force:true});
      renderAll();
    }});
  }
  btns.push({label:'ابدأ بيانات جديدة من الصفر', danger:true, onClick: async function(){
    if(prompt('ده هيكتب بيانات جديدة فاضية في جوجل شيت.\nلو انت متأكد اكتب كلمة: جديد') !== 'جديد') return;
    state = seedState();
    canWrite = true;
    lastSyncedRaw = null;
    hideBlocker();
    await persist({force:true});
    renderAll();
  }});
  showBlocker('قاعدة البيانات فاضية',
    'جوجل شيت رد بنجاح بس مفيش بيانات متسجّلة.\nلو المفروض فيه بيانات، متكملش — افتح الشيت وارجع نسخة سابقة من: ملف ← سجل الإصدارات.',
    btns);
  return false;
}

function safeParse(raw){
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

async function retryLoad(){
  hideBlocker();
  setSyncStatus('🔄 بيحاول تاني...');
  const ok = await loadState();
  if(ok) renderAll();
}

/* بيجيب آخر نسخة من جوجل شيت دوري عشان أي تغيير يظهر عند الكل.
   بيوقف وانت فاتح وضع التعديل، وبيوقف كمان لو إحنا في وضع "عرض فقط". */
async function pollRemote(){
  if(unlocked || !canWrite) return;
  const r = await remoteGet('data', 1);
  if(!r.ok || !r.value || r.value === lastSyncedRaw) return;
  const parsed = safeParse(r.value);
  if(!validState(parsed)) return;   // مانستبدلش الشاشة ببيانات مشبوهة
  lastSyncedRaw = r.value;
  state = parsed;
  saveLocalBackup(r.value);
  migrateState();
  renderAll();
}

function startSyncPolling(){
  if(!REMOTE_DB_URL) return;
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(pollRemote, 20000); // كل 20 ثانية
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden) pollRemote();
  });
}

function migrateState(opts){
  opts = opts || {};
  let changed = false;
  if(!state.settings){
    state.settings = { elevatorAmount:500, noElevatorAmount:450 };
    changed = true;
  }
  if(!state.settings.editPin){
    state.settings.editPin = '1234';
    changed = true;
  }
  if(typeof state.settings.unlockTaps !== 'number'){
    state.settings.unlockTaps = 4;
    changed = true;
  }
  if(typeof state.settings.changePinTaps !== 'number'){
    state.settings.changePinTaps = 7;
    changed = true;
  }
  // ورقة المتأخرات: طرق السداد، رسالة للسكان، وإظهار التزامات العمارة
  if(typeof state.settings.paymentOptions !== 'string'){ state.settings.paymentOptions = DEFAULT_PAYMENT_OPTIONS; changed = true; }
  if(typeof state.settings.reportNote !== 'string'){ state.settings.reportNote = ''; changed = true; }
  if(typeof state.settings.reportShowObligations !== 'boolean'){ state.settings.reportShowObligations = true; changed = true; }
  if(!Array.isArray(state.settings.expenseKinds) || !state.settings.expenseKinds.length){
    // أنواع المصروفات الافتراضية (بتتعدّل من تبويب الإعدادات)
    state.settings.expenseKinds = DEFAULT_EXPENSE_KINDS.map(k=> Object.assign({}, k));
    changed = true;
  }
  if(typeof state.settings.openingBalance !== 'number'){
    const oldLedgerSum = (state.fundLedger||[]).reduce((s,f)=>s+f.amount,0);
    state.settings.openingBalance = oldLedgerSum || 4050;
    state.fundLedger = [];
    changed = true;
  }
  state.apartments.forEach(a=>{
    if(typeof a.elevator !== 'boolean'){
      a.elevator = a.floor !== 'الأرضي';
      changed = true;
    }
    if(typeof a.occupied !== 'boolean'){
      a.occupied = !!a.name;
      changed = true;
    }
    if(!Array.isArray(a.occupancyPeriods)){
      // بيانات قديمة: لو الشقة مأهولة حاليًا نعتبرها مأهولة من أول شهر متسجّل عندنا عشان مانخسرش المتأخرات القديمة
      a.occupancyPeriods = a.occupied ? [{from: START_MONTH, to: null}] : [];
      changed = true;
    }
    // فترات السكن: نشيل المكرر ونرتّبها، وكل فترة تاخد بيانات ساكنها (اسم/اشتراك/أسانسير) ورقم ساكن (rid)
    // عشان الشهور القديمة تفضل بقيمها حتى لو الساكن مشي أو الاشتراك اتغيّر.
    const before = JSON.stringify(a.occupancyPeriods) + a.occupied;
    const seen = new Set();
    a.occupancyPeriods = a.occupancyPeriods
      .filter(p=> p && p.from && (p.to==null || p.to > p.from)          // فترة فاضية (بدأت وخلصت في نفس الشهر) = مالهاش لازمة
        && !seen.has(p.from + '|' + p.to) && seen.add(p.from + '|' + p.to))
      .sort((x,y)=> x.from.localeCompare(y.from));
    let prev = null;
    a.occupancyPeriods.forEach(p=>{
      if(p.to===undefined) p.to = null;
      if(typeof p.name !== 'string') p.name = a.name || '';
      if(typeof p.subscription !== 'number') p.subscription = Number(a.subscription)||0;
      if(typeof p.elevator !== 'boolean') p.elevator = !!a.elevator;
      if(!p.rid){
        // فترة لاصقة أو متداخلة مع اللي قبلها بنفس الاسم = نفس الساكن
        p.rid = (prev && prev.name===p.name && prev.to!==null && p.from <= prev.to) ? prev.rid : newRid();
      }
      prev = p;
    });
    a.occupied = a.occupancyPeriods.some(p=> p.to===null);
    if(JSON.stringify(a.occupancyPeriods) + a.occupied !== before) changed = true;
  });
  if(!Array.isArray(state.commitments)){
    state.commitments = [];
    changed = true;
  }
  if(!Array.isArray(state.commitmentPayments)){
    state.commitmentPayments = [];
    changed = true;
  }
  if(!Array.isArray(state.elevatorSpends)){
    state.elevatorSpends = [];
    changed = true;
  }
  if(!state.paymentDates){
    state.paymentDates = {};
    changed = true;
  }
  (state.commitments||[]).forEach(c=>{
    if(typeof c.fundType !== 'string'){
      c.fundType = 'general';
      changed = true;
    }
  });
  if(changed && !opts.noSave) persist();
}

/* الحفظ: مفيش كتابة قبل قراءة ناجحة، ومفيش كتابة لبيانات فاضية أو ناقصة.

   ملحوظة عن التزامن: لو المستخدم عدّل كذا حاجة ورا بعض بسرعة (زي إنه يعدّي على
   كذا حقل تحصيل ورا بعض)، كل تعديل كان بيبعت request منفصل لجوجل شيت، والشبكة
   مش بتضمن إن الـ requests دي توصل وتتنفذ بنفس ترتيبها — فممكن تعديل أقدم يوصل
   ويتنفذ بعد تعديل أحدث ويمسحه من غير ما حد يلاحظ. عشان كده الحفظ دلوقتي بيعدّي
   من خلال "طابور": مفيش أكتر من request حفظ شغال في نفس اللحظة؛ لو تعديل جديد
   حصل وإحنا لسه بنحفظ التعديل اللي قبله، بنستنى لحد ما الحفظ الحالي يخلص وبعدين
   نبعت حفظة واحدة تانية بأحدث نسخة من الداتا (بدل ما نبعت request لكل تعديل). */
let saveInFlight = false;
let savePending = false;
let pendingForce = false;

async function persist(opts){
  opts = opts || {};
  if(opts.force) pendingForce = true;
  if(saveInFlight){
    savePending = true;
    return true; // اتسجّل واتحفظ محليًا فعلاً (localStorage) — هيتبعت لجوجل شيت أول ما الحفظ الحالي يخلص
  }
  saveInFlight = true;
  const forceThisRun = pendingForce;
  pendingForce = false;
  let result = await persistNow({force: forceThisRun});
  saveInFlight = false;
  if(savePending){
    savePending = false;
    result = await persist(); // فيه تعديل جديد اتراكم وإحنا بنحفظ — نحفظ بأحدث نسخة دلوقتي
  }
  return result;
}

async function persistNow(opts){
  opts = opts || {};
  if(!canWrite){
    setSyncStatus('⛔ الحفظ متوقف (' + (readOnlyReason || 'البيانات مش متحمّلة من جوجل شيت') + ')', true);
    return false;
  }
  if(!validState(state)){
    setSyncStatus('⛔ اتمنع حفظ بيانات ناقصة', true);
    return false;
  }
  const raw = JSON.stringify(state);
  saveLocalBackup(raw);
  const prev = lastSyncedRaw;
  lastSyncedRaw = raw;
  setSyncStatus('🔄 بيحفظ...');
  try{
    await remoteSet('data', raw, opts.force);
    setSyncStatus('🟢 اتحفظ في جوجل شيت ' + new Date().toLocaleTimeString('ar-EG'));
    return true;
  }catch(e){
    if(e.code === 'SHRINK_GUARD'){
      const info = e.info || {};
      const ok = confirm('تحذير: البيانات الجديدة أصغر بكتير من اللي متسجّل في جوجل شيت'
        + '\n(القديم ' + (info.oldLength||'?') + ' حرف — الجديد ' + (info.newLength||'?') + ' حرف).'
        + '\nلو ده مش مقصود، اختار "إلغاء" والبيانات هتفضل زي ما هي.'
        + '\nتحب تكمّل الحفظ؟');
      if(ok) return await persistNow({force:true});
      lastSyncedRaw = prev;
      setSyncStatus('⛔ الحفظ اتلغى — البيانات في جوجل شيت زي ما هي', true);
      return false;
    }
    lastSyncedRaw = prev;
    setSyncStatus('🟠 محفوظ على الجهاز بس — ' + e.message, true);
    return false;
  }
}

/* ---------------- نسخة احتياطية يدوية (ملف على الموبايل/الكمبيوتر) ---------------- */
function exportBackup(){
  const raw = lastSyncedRaw || (state ? JSON.stringify(state) : null);
  if(!raw){ alert('مفيش بيانات متحمّلة دلوقتي.'); return; }
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  const blob = new Blob([raw], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'نسخة-حسابات-العمارة-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async function(){
    const parsed = safeParse(String(reader.result));
    if(!validState(parsed)){ alert('الملف ده مش نسخة سليمة.'); return; }
    if(!confirm('هيتم استبدال البيانات الحالية في جوجل شيت بمحتوى الملف ('
      + parsed.apartments.length + ' شقة). تحب تكمّل؟')) return;
    state = parsed;
    canWrite = true;
    migrateState();
    await persist({force:true});
    renderAll();
    alert('تمّت الاستعادة.');
  };
  reader.readAsText(file, 'utf-8');
}

function fmt(n){
  n = Math.round(n);
  return n.toLocaleString('en-US');
}

/* أي نص بيكتبه المستخدم (اسم ساكن، ملاحظة، بيان...) ولازم يتحط جوه HTML لازم
   يعدّي من هنا الأول، عشان علامة زي " أو < ماتكسرش شكل الصفحة أو الحقول. */
function escapeHtml(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/[&<>"']/g, function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}

function fileToAttachment(file){
  if(file.type && file.type.startsWith('image/')){
    return compressImageToAttachment(file);
  }
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve({name: file.name, type: file.type, dataUrl: reader.result});
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressImageToAttachment(file, maxDim = 1600, quality = 0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({name: file.name.replace(/\.(png|heic|webp)$/i,'.jpg'), type:'image/jpeg', dataUrl});
      };
      img.onerror = ()=>{
        // مش قادر يفتحها كصورة (مثلا HEIC مش مدعومة) — رجّع الملف الأصلي من غير ضغط
        resolve({name: file.name, type: file.type, dataUrl: reader.result});
      };
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function apartmentsByFloor(){
  const groups = {};
  state.apartments.forEach(a=>{
    if(!groups[a.floor]) groups[a.floor]=[];
    groups[a.floor].push(a);
  });
  return groups;
}

function isOccupiedInMonth(apt, monthKey){
  const periods = apt.occupancyPeriods || [];
  return periods.some(p => monthKey >= p.from && (p.to===null || monthKey < p.to));
}

/* ---------------- السكان وفترات السكن ----------------
   كل شقة ليها occupancyPeriods = فترات سكن. كل فترة:
     {rid, from:'YYYY-MM', to:'YYYY-MM' أو null (to = أول شهر مش عليه اشتراك), name, subscription, elevator}
   الفترات اللي ليها نفس rid = نفس الساكن (بتتقسم لما اشتراكه أو الأسانسير بتاعه يتغيّر من شهر معيّن).
   الاشتراك والاسم والأسانسير في أي شهر بيتاخدوا من فترة الشهر ده — فلما ساكن يمشي وييجي غيره، فلوس
   القديم ومتأخراته والتزاماته بتفضل باسمه، وتغيير اشتراك حد مابيغيّرش الشهور اللي فاتت.
   apt.name / apt.subscription / apt.elevator = بيانات الساكن الحالي (أو آخر ساكن لو الشقة فاضية). */
function periodFor(apt, mk){
  return (apt.occupancyPeriods||[]).find(p=> mk >= p.from && (p.to===null || mk < p.to)) || null;
}
function openPeriod(apt){
  return (apt.occupancyPeriods||[]).find(p=> p.to===null) || null;
}
function subscriptionFor(apt, mk){
  const p = periodFor(apt, mk);
  return p && typeof p.subscription==='number' ? p.subscription : (Number(apt.subscription)||0);
}
function residentNameFor(apt, mk){
  const p = periodFor(apt, mk);
  return p && typeof p.name==='string' ? p.name : (apt.name||'');
}
function elevatorFor(apt, mk){
  const p = periodFor(apt, mk);
  return p && typeof p.elevator==='boolean' ? p.elevator : !!apt.elevator;
}
function defaultSubscription(elevator){
  return elevator ? (Number(state.settings.elevatorAmount)||0) : (Number(state.settings.noElevatorAmount)||0);
}
function newRid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

/* السكان اللي سكنوا الشقة (الأقدم الأول) — كل ساكن ومعاه فتراته */
function residentsOf(apt){
  const map = new Map();
  (apt.occupancyPeriods||[]).forEach(p=>{
    const rid = p.rid || (apt.id + '_' + p.from);
    if(!map.has(rid)) map.set(rid, {rid, apt, periods:[]});
    map.get(rid).periods.push(p);
  });
  return [...map.values()].map(r=>{
    r.periods.sort((a,b)=> a.from.localeCompare(b.from));
    const last = r.periods[r.periods.length-1];
    r.name = last.name || '';
    r.from = r.periods[0].from;
    r.to = last.to;                       // null = لسه ساكن
    r.current = last.to === null;
    return r;
  }).sort((a,b)=> a.from.localeCompare(b.from));
}
function residentKey(r){ return r.apt.id + '@' + r.rid; }
function findResident(key){
  const i = key.indexOf('@');
  const apt = state.apartments.find(a=> a.id===key.slice(0,i));
  return apt ? (residentsOf(apt).find(r=> r.rid===key.slice(i+1)) || null) : null;
}
function residentOfPeriod(apt, p){
  return p ? (residentsOf(apt).find(r=> r.periods.includes(p)) || null) : null;
}
function residentRangeText(r){
  return 'من ' + monthLabel(r.from) + (r.to ? ' لـ ' + monthLabel(shiftMonth(r.to, -1)) : ' — لسه ساكن');
}
/* الشهور اللي الساكن كان عليه فيها اشتراك (من أول الحسابات لحد maxMonth) */
function residentMonths(r, maxMonth){
  const out = [];
  r.periods.forEach(p=>{
    const from = p.from > START_MONTH ? p.from : START_MONTH;
    const last = p.to ? shiftMonth(p.to, -1) : maxMonth;
    const to = last < maxMonth ? last : maxMonth;
    if(from > to) return;
    monthsRange(from, to).forEach(mk=>{ if(periodFor(r.apt, mk)===p && !out.includes(mk)) out.push(mk); });
  });
  return out.sort();
}

/* الالتزام الإضافي على شقة بيتبع الساكن اللي كان ساكن في شهر بدايته */
function commitmentPeriod(c){
  const apt = state.apartments.find(a=> a.id===c.aptId);
  if(!apt) return null;
  const ps = (apt.occupancyPeriods||[]).slice().sort((a,b)=> a.from.localeCompare(b.from));
  return periodFor(apt, c.startMonth)
    || ps.filter(p=> p.from <= c.startMonth).pop()
    || openPeriod(apt) || ps[0] || null;
}
function commitmentResident(c){
  const apt = state.apartments.find(a=> a.id===c.aptId);
  return apt ? residentOfPeriod(apt, commitmentPeriod(c)) : null;
}
function residentCommitments(r){
  return (state.commitments||[]).filter(c=> c.aptId===r.apt.id && (commitmentResident(c)||{}).rid===r.rid);
}

/* تغيير اشتراك/أسانسير الساكن الحالي: يا من شهر معيّن (الشهور اللي قبله زي ما هي)، يا على كل فترته */
function applyResidentChange(apt, changes){
  const p = openPeriod(apt);
  if(!p){ Object.assign(apt, changes); return; }
  const realMonth = todayStr().slice(0,7);
  let fromMonth = null;
  if(p.from < realMonth){
    const fromNow = confirm('التغيير ده يبدأ من شهر ' + monthLabel(realMonth) + '؟\n\n'
      + 'موافق ← من ' + monthLabel(realMonth) + ' وانت رايح (الشهور اللي فاتت زي ما هي)\n'
      + 'إلغاء ← على كل الشهور من أول ما سكن');
    if(fromNow) fromMonth = realMonth;
  }
  if(fromMonth){
    p.to = fromMonth;
    apt.occupancyPeriods.push(Object.assign({}, p, {from: fromMonth, to: null}, changes));
  } else {
    const r = residentOfPeriod(apt, p);
    (r ? r.periods : [p]).forEach(x=> Object.assign(x, changes));
  }
  Object.assign(apt, changes);
}

/* ---------------- نوافذ البوب أب العامة ---------------- */
function openPopup(id, innerHtml){
  closePopup(id);
  const ov = document.createElement('div');
  ov.id = id;
  ov.className = 'popup-overlay';
  ov.innerHTML = `<div class="popup-box" role="dialog" aria-modal="true">${innerHtml}</div>`;
  ov.addEventListener('click', ev=>{
    if(ev.target === ov || ev.target.closest('.popup-close')) closePopup(id);
  });
  document.body.appendChild(ov);
  return ov;
}
function closePopup(id){
  const ov = document.getElementById(id);
  if(ov) ov.remove();
}
function popupHead(title){
  return `<div class="popup-head"><h3>${title}</h3><button class="popup-close" aria-label="إغلاق">✕</button></div>`;
}

/* ---------------- ساكن مشي / ساكن جديد ---------------- */
function showMoveOut(aptId){
  if(!unlocked){ alert('افتح وضع التعديل الأول'); return; }
  const apt = state.apartments.find(a=> a.id===aptId);
  const p = apt && openPeriod(apt);
  if(!p) return;
  const r = residentOfPeriod(apt, p);
  const realMonth = todayStr().slice(0,7);
  // لو لسه في أول الشهر، غالبًا الساكن مشي آخر الشهر اللي فات
  let def = Number(todayStr().slice(8,10)) >= 15 ? realMonth : shiftMonth(realMonth, -1);
  if(def < p.from) def = p.from;
  const html = popupHead('🚪 ' + escapeHtml(r ? r.name || apt.id : apt.id) + ' مشي — شقة ' + escapeHtml(apt.id)) + `
    <div class="pp-sec">
      <label class="pp-field">آخر شهر عليه اشتراك
        <input type="month" id="moLast" value="${def}">
      </label>
      <div class="pp-note">الاشتراك بيتحسب عليه لحد الشهر ده، والشقة بتبقى فاضية من الشهر اللي بعده. أي متأخرات أو التزامات عليه بتفضل متسجّلة باسمه في متأخرات السكان وكشف الحساب.</div>
      <div class="pp-actions">
        <button type="button" class="pp-btn" id="moConfirm">✔ تأكيد</button>
        <button type="button" class="pp-btn ghost popup-close">إلغاء</button>
      </div>
    </div>`;
  const ov = openPopup('movePopup', html);
  ov.querySelector('#moConfirm').addEventListener('click', ()=>{
    const last = ov.querySelector('#moLast').value;
    if(!last){ alert('اختار آخر شهر'); return; }
    const newTo = shiftMonth(last, 1);
    // دفعات اشتراك متسجّلة بعد آخر شهر (مثلًا دفع مقدّم) — بتفضل في الصندوق، فننبّه عليها
    const after = Object.keys(state.payments).filter(mk=> mk >= newTo && (state.payments[mk]||{})[apt.id] > 0);
    if(after.length && !confirm('فيه دفعات اشتراك متسجّلة للشقة دي بعد ' + monthLabel(last) + ' (' + after.map(monthLabel).join('، ') + ').\n'
      + 'هتفضل في الصندوق — لو محتاج ترجعها للساكن امسحها من الصندوق.\nتكمّل؟')) return;
    if(newTo <= p.from){
      if(!confirm('الشهر ده قبل ما يسكن (' + monthLabel(p.from) + ') — يعني مش هيتحسب عليه أي شهر. تكمّل؟')) return;
      apt.occupancyPeriods = apt.occupancyPeriods.filter(x=> x !== p);
    } else {
      p.to = newTo;
    }
    // الالتزامات الشهرية/الأقساط اللي عليه بتقف عند آخر شهر ليه
    if(r) residentCommitments(r).forEach(c=>{ if(c.type!=='once' && !c.endMonth) c.endMonth = last; });
    apt.occupied = !!openPeriod(apt);
    closePopup('movePopup');
    persist(); renderAll();
  });
}

function showMoveIn(aptId){
  if(!unlocked){ alert('افتح وضع التعديل الأول'); return; }
  const apt = state.apartments.find(a=> a.id===aptId);
  if(!apt || openPeriod(apt)) return;
  const realMonth = todayStr().slice(0,7);
  const lastTo = (apt.occupancyPeriods||[]).map(p=> p.to).filter(Boolean).sort().pop();
  let def = currentMonth > realMonth ? currentMonth : realMonth;
  if(lastTo && def < lastTo) def = lastTo;
  const elev = apt.floor !== 'الأرضي';
  const html = popupHead('🏠 ساكن جديد — شقة ' + escapeHtml(apt.id)) + `
    <div class="pp-sec">
      <label class="pp-field">اسم الساكن
        <input type="text" id="miName" placeholder="الاسم">
      </label>
      <label class="pp-field">أول شهر عليه اشتراك
        <input type="month" id="miFrom" value="${def}">
      </label>
      <label class="pp-field row"><input type="checkbox" id="miElev" ${elev?'checked':''}> مشترك في الأسانسير</label>
      <label class="pp-field">الاشتراك الشهري
        <input type="number" id="miSub" min="0" value="${defaultSubscription(elev)}">
      </label>
      ${lastTo ? `<div class="pp-note">آخر ساكن كان لحد ${monthLabel(shiftMonth(lastTo,-1))} — الساكن الجديد لازم يبدأ بعده.</div>` : ''}
      <div class="pp-actions">
        <button type="button" class="pp-btn" id="miConfirm">✔ تسجيل الساكن</button>
        <button type="button" class="pp-btn ghost popup-close">إلغاء</button>
      </div>
    </div>`;
  const ov = openPopup('movePopup', html);
  const elevCb = ov.querySelector('#miElev'), subIn = ov.querySelector('#miSub');
  let subEdited = false;
  subIn.addEventListener('input', ()=>{ subEdited = true; });
  elevCb.addEventListener('change', ()=>{ if(!subEdited) subIn.value = defaultSubscription(elevCb.checked); });
  ov.querySelector('#miConfirm').addEventListener('click', ()=>{
    const name = ov.querySelector('#miName').value.trim();
    const from = ov.querySelector('#miFrom').value;
    const subscription = Math.max(0, Number(subIn.value)||0);
    if(!name){ alert('اكتب اسم الساكن'); return; }
    if(!from){ alert('اختار أول شهر'); return; }
    if(lastTo && from < lastTo){ alert('الشهر ده متداخل مع الساكن اللي قبله (كان لحد ' + monthLabel(shiftMonth(lastTo,-1)) + ').'); return; }
    if(subscription <= 0 && !confirm('الاشتراك صفر — تكمّل؟')) return;
    if(!Array.isArray(apt.occupancyPeriods)) apt.occupancyPeriods = [];
    apt.occupancyPeriods.push({rid: newRid(), from, to: null, name, subscription, elevator: elevCb.checked});
    Object.assign(apt, {name, subscription, elevator: elevCb.checked, occupied: true});
    closePopup('movePopup');
    persist(); renderAll();
  });
}

function showStatement(aptId){
  statementAptId = aptId;
  renderStatement();
}
function refreshStatement(){
  if(statementAptId && document.getElementById('statementPopup')) renderStatement(true);
}
