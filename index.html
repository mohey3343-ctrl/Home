<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير المالية برج الاندلس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#312d5e;
    --night-2:#1c1a38;
    --wall:#4b4780;
    --wall-2:#6a64ab;
    --paper:#f4f8fe;
    --paper-2:#e9f1fc;
    --ink:#221f42;
    --ink-soft:#647089;
    --lit:#eaa93f;
    --lit-2:#dc8f26;
    --lit-glow:#f6c977;
    --dim:#57538c;
    --dim-2:#4a4678;
    --vacant:#57538c;
    --good:#0fa671;
    --bad:#e24a4a;
    --line:#dde6f5;
    --radius:16px;
    --sidebar-w:64px;
  }
  ::-webkit-scrollbar{width:0;height:0;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace; font-weight:600;}
  h1,h2,h3{font-family:'El Messiri', sans-serif; margin:0;}

  /* ---------- HERO / FACADE ---------- */
  .hero{
    position:relative; overflow:hidden;
    background:linear-gradient(175deg, var(--night) 0%, var(--night-2) 100%);
    padding:16px 14px 20px;
    padding-inline-end:calc(var(--sidebar-w) + 16px);
    border-radius:0 0 26px 26px;
    box-shadow:0 14px 32px rgba(10,8,30,.35);
  }
  .hero::before{
    content:'';
    position:absolute; top:-120px; left:50%; transform:translateX(-50%);
    width:320px; height:320px; border-radius:50%;
    background:radial-gradient(circle, rgba(234,169,63,.20) 0%, rgba(234,169,63,0) 70%);
    pointer-events:none;
  }
  .hero > *{position:relative;}
  .hero-top{
    display:flex; align-items:center; justify-content:space-between;
    color:#fff; margin-bottom:12px;
  }
  .hero-title{color:#fff; font-size:23px; letter-spacing:.3px; font-weight:700;}
  .month-nav{display:flex; align-items:center; gap:10px; color:#fff;}
  .month-nav button{
    background:linear-gradient(155deg, #7a74c7 0%, #4b4780 55%, #38356a 100%);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.5), inset 0 -2px 3px rgba(0,0,0,.3), 0 3px 6px rgba(10,8,30,.4);
    color:#fff; width:32px; height:32px; border-radius:50%;
    font-size:16px; cursor:pointer;
  }
  .month-nav button:active{transform:scale(.92);}
  .month-label{font-family:'IBM Plex Mono'; font-size:15px; min-width:110px; text-align:center;}

  .hero-title{cursor:default; user-select:none;}

  #lockBtn{
    background:transparent; border:none; color:transparent;
    width:6px; height:32px; font-size:0; cursor:default; padding:0;
  }
  #lockBtn.revealed{
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
    color:#fff; width:32px; border-radius:50%; font-size:14px; cursor:pointer;
  }
  #lockBtn.change-mode{
    background:rgba(255,255,255,.35); border:1px solid #fff;
  }
  #tapHint{
    font-size:10.5px; color:#fff; margin-inline-end:2px; white-space:nowrap;
  }
  #unlockPanel{
    display:none; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
    border-radius:10px; padding:8px 10px; margin-bottom:12px; gap:8px;
  }
  #unlockPanel.show{display:flex; align-items:center;}
  #unlockPanel input{
    flex:1; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
    color:#fff; border-radius:8px; padding:7px 10px; font-family:'IBM Plex Mono'; font-size:13px;
  }
  #unlockPanel button{
    background:#fff; color:var(--night); border:none; border-radius:8px;
    padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .view-only-banner{
    background:var(--paper-2); color:var(--ink-soft); font-size:12px; text-align:center;
    padding:8px 10px; border-radius:10px; margin-bottom:12px; border:1px solid var(--line);
  }
  #content.locked input, #content.locked select,
  #content.locked button.pill, #content.locked button.del,
  #content.locked form.inline button, #content.locked .preset,
  #content.locked #settleAllElevatorShares,
  #content.locked input[type=checkbox]{
    pointer-events:none; opacity:.45;
  }
  /* الـ label اللي لافة حوالين أي checkbox (زي "مأهولة"، "أسانسير"، "تحديد الكل") لازم تتقفل هي كمان،
     لأن الضغط على نص الـ label بيفعّل الـ checkbox جواه حتى لو الـ checkbox نفسه pointer-events:none */
  #content.locked label{
    pointer-events:none;
  }
  .facade.locked .win{ pointer-events:none; }

  .balance-hero{
    position:relative;
    background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.22);
    border-radius:18px; padding:16px 16px 14px; margin-bottom:12px; text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 8px 20px rgba(10,8,30,.25);
  }
  .balance-hero .lbl{color:#c9c4ee; font-size:13px;}
  .balance-hero .val{color:#fff; font-size:40px; margin-top:4px; font-weight:700;}
  .balance-hero.balance-neg .val{color:#ffb199;}

  /* ---------- 3D ICON BADGES ---------- */
  .icon3d{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:10px; flex-shrink:0;
    font-size:16px; line-height:1;
    background:linear-gradient(155deg, #7a74c7 0%, #4b4780 55%, #38356a 100%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.55),
      inset 0 -3px 4px rgba(0,0,0,.30),
      0 3px 6px rgba(10,8,30,.45);
    border:1px solid rgba(255,255,255,.18);
  }
  .icon3d.gold{
    background:linear-gradient(155deg, #f8d488 0%, #eaa93f 55%, #c9821f 100%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.7),
      inset 0 -3px 4px rgba(0,0,0,.25),
      0 3px 8px rgba(200,130,20,.4);
  }
  .icon3d.sm{width:24px; height:24px; border-radius:8px; font-size:13px;}
  .icon3d.lg{width:42px; height:42px; border-radius:13px; font-size:21px;}
  .stat-head{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .stat-head .lbl{margin:0;}

  .overview-block{
    position:relative; overflow:hidden;
    background:linear-gradient(175deg, var(--night) 0%, var(--night-2) 100%);
    border-radius:22px; padding:16px 14px 14px; margin-bottom:6px;
    box-shadow:0 14px 32px rgba(10,8,30,.3);
  }
  .overview-block::before{
    content:''; position:absolute; top:-110px; left:50%; transform:translateX(-50%);
    width:300px; height:300px; border-radius:50%;
    background:radial-gradient(circle, rgba(234,169,63,.18) 0%, rgba(234,169,63,0) 70%);
    pointer-events:none;
  }
  .overview-block > *{position:relative;}

  .facade{
    display:flex; flex-direction:column-reverse; gap:4px;
    background:rgba(255,255,255,.12); border-radius:10px; padding:9px 9px 7px;
    border:1px solid rgba(255,255,255,.25);
  }
  .floor-row{display:flex; align-items:center; gap:6px;}
  .floor-label{
    width:40px; flex-shrink:0; color:#cfe0fb; font-size:11px; font-weight:600; text-align:left;
    font-family:'IBM Plex Mono';
  }
  .windows{display:flex; gap:5px; flex:1;}
  .win{
    position:relative;
    flex:1; min-width:0; height:58px; border-radius:8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1px; padding:0 3px;
    transition:transform .12s ease;
    border:1px solid rgba(0,0,0,.12);
  }
  .win .apt-num{
    font-size:13px; font-family:'IBM Plex Mono'; font-weight:700; line-height:1.15;
  }
  .win .apt-name{
    font-size:10px; font-family:'IBM Plex Sans Arabic'; font-weight:600; line-height:1.15;
    max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.92;
  }
  .win .apt-sub{
    font-size:9px; font-family:'IBM Plex Mono'; line-height:1.1; opacity:.85;
  }
  .win .apt-status{
    font-size:9px; font-family:'IBM Plex Sans Arabic'; font-weight:700; line-height:1.2;
    margin-top:1px;
  }
  .win.paid .apt-status{color:#eaf3ff;}
  .win.partial .apt-status,
  .win.unpaid .apt-status{color:#ffd7d2;}
  .win.vacant .apt-status{color:#5b6b93;}
  .win .occ-dot{
    position:absolute; top:4px; left:4px;
    width:9px; height:9px; border-radius:50%;
    border:1px solid rgba(0,0,0,.25);
  }
  .win .occ-dot.occ-yes{ background:#3ddc73; box-shadow:0 0 6px 2px rgba(61,220,115,.85); }
  .win .occ-dot.occ-no{ background:#ff5b4d; box-shadow:0 0 6px 2px rgba(255,91,77,.75); }
  .win:active{transform:scale(.94);}
  .win.paid{
    background:linear-gradient(160deg, #f6c977 0%, #eaa93f 55%, #d69329 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -6px 10px rgba(150,90,10,.25), 0 4px 10px rgba(200,130,20,.35);
    color:#3a2807; border-color:rgba(255,255,255,.35);
  }
  .win.paid .apt-status, .win.paid .apt-sub, .win.paid .apt-name{color:#4a3410;}
  .win.partial{
    background:linear-gradient(160deg, #6a64ab 0%, #4a4678 100%); color:#fff;
    border-inline-start:3px solid var(--lit);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 3px 8px rgba(10,8,30,.3);
  }
  .win.unpaid{
    background:linear-gradient(160deg, #6a64ab 0%, #4a4678 100%); color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 3px 8px rgba(10,8,30,.3);
  }
  .win.vacant{
    background:linear-gradient(160deg, #625d9c 0%, #47437a 100%); color:#e4e1f7;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 3px 8px rgba(10,8,30,.3);
  }
  .win.vacant .apt-name{display:none;}

  .stats{
    display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px;
  }
  .stat{
    background:linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:10px 12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  }
  .stat .lbl{color:#c9c4ee; font-size:12px;}
  .stat .val{color:#fff; font-size:25px; margin-top:2px;}
  .stat.balance-neg .val{color:#ffb199;}

  .collection-progress{
    background:linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:10px 12px 12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
    margin-bottom:12px;
  }
  .cp-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .cp-head .lbl{color:#c9c4ee; font-size:12px;}
  .cp-head .pct{color:#fff; font-size:18px; font-weight:700;}
  .cp-track{
    position:relative; width:100%; height:14px; border-radius:8px;
    background:rgba(255,255,255,.10); overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(10,8,30,.35);
  }
  .cp-fill{
    height:100%; border-radius:8px;
    background:linear-gradient(90deg, var(--lit,#ffcf5c), #ffe28a);
    box-shadow:0 0 8px rgba(255,207,92,.55);
    transition:width .4s ease;
  }
  .cp-fill.cp-low{background:linear-gradient(90deg, #ff8a7a, #ffb199);}
  .cp-sub{display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:#c7d7f5;}

  /* ---------- كارت نصيب الساكن من مصروفات الشهر ---------- */
  .share-card{
    background:linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:10px 12px 12px; margin-bottom:12px; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
    transition:transform .12s ease;
  }
  .share-card:active{transform:scale(.98);}
  .share-card .sc-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .share-card .sc-head .lbl{color:#c9c4ee; font-size:12px;}
  .share-card .sc-head .more{color:var(--lit-glow); font-size:11px; white-space:nowrap;}
  .share-card .sc-tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .share-card .sc-tile{background:rgba(255,255,255,.08); border-radius:10px; padding:8px 10px;}
  .share-card .sc-tile .t{color:#c9c4ee; font-size:11px;}
  .share-card .sc-tile .v{color:#fff; font-size:22px; margin-top:2px;}
  .share-card .sc-tile .v small{font-size:11px; font-weight:400; color:#c7d7f5;}
  .share-card .sc-sub{margin-top:8px; font-size:11px; color:#c7d7f5; display:flex; flex-wrap:wrap; gap:4px 12px;}

  /* ---------- بوب أب التفاصيل ---------- */
  .popup-overlay{
    position:fixed; inset:0; z-index:9000; background:rgba(20,18,45,.62);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .popup-box{
    background:#fff; border-radius:16px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
    padding:14px 16px 16px; box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .popup-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .popup-head h3{font-size:17px; color:var(--ink);}
  .popup-close{background:var(--paper-2); border:none; border-radius:50%; width:30px; height:30px; font-size:14px; cursor:pointer; color:var(--ink-soft);}
  .pp-sec{margin-top:14px;}
  .pp-sec-title{font-size:13px; font-weight:700; color:var(--night); margin-bottom:4px;}
  .pp-row{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
  .pp-row:last-child{border-bottom:none;}
  .pp-row .k{color:var(--ink-soft);}
  .pp-row.total{font-weight:700; color:var(--ink);}
  .pp-row.total .k{color:var(--ink);}
  .pp-row.muted{opacity:.5;}
  .pp-note{font-size:11.5px; color:var(--ink-soft); line-height:1.7; margin-top:4px;}
  .pp-grid{display:grid; grid-template-columns:1.3fr 1fr 1fr; font-size:12.5px; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .pp-grid > div{padding:6px 8px; border-bottom:1px solid var(--line);}
  .pp-grid > div:nth-last-child(-n+3){border-bottom:none;}
  .pp-grid .h{background:var(--paper-2); font-weight:700; font-size:11.5px; color:var(--ink-soft);}
  .pp-grid .n{text-align:center; font-family:'IBM Plex Mono'; font-weight:600;}
  .pp-grid .tot{background:#fff6e3; font-weight:700;}

  /* ---------- TABS: side dock ---------- */
  .tabbar{
    display:flex; flex-direction:column; align-items:center;
    gap:8px; padding:14px 6px 20px;
    background:linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    position:fixed; top:0; bottom:0; inset-inline-end:0; width:var(--sidebar-w);
    border-inline-start:1px solid rgba(255,255,255,.08);
    box-shadow:-6px 0 18px rgba(10,8,30,.25);
    z-index:30; overflow-y:auto;
  }
  .tabbar button{
    all:unset; box-sizing:border-box; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    width:100%; padding:6px 2px 8px; border-radius:12px;
    font-family:'IBM Plex Sans Arabic'; text-align:center;
  }
  .tabbar button .icon3d{width:36px; height:36px; border-radius:11px; font-size:18px;}
  .tabbar button .tab-label{
    font-size:8.5px; color:#b7b1e6; line-height:1.15; white-space:normal;
  }
  .tabbar button.active{background:rgba(255,255,255,.08);}
  .tabbar button.active .tab-label{color:#fff; font-weight:700;}

  .content{padding:14px 14px 60px; padding-inline-end:calc(var(--sidebar-w) + 14px); max-width:640px; margin:0 auto;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:10px;
    box-shadow:0 3px 14px rgba(30,80,190,.06);
  }
  .section-title{font-size:13px; color:var(--ink-soft); margin:16px 0 8px; font-weight:600;}
  .bulk-checkbox{
    width:16px; height:16px; flex-shrink:0; margin:2px 0 0; accent-color:var(--lit); cursor:pointer;
  }

  /* apartment row */
  .apt-row{
    display:flex; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line);
    gap:8px;
  }
  .apt-row:last-child{border-bottom:none;}
  .apt-info{display:flex; flex-direction:column; flex:1; min-width:0;}
  .apt-info .name{font-size:14.5px; font-weight:600;}
  .apt-info .meta{font-size:11.5px; color:var(--ink-soft);}
  .apt-actions{display:flex; align-items:center; gap:6px;}
  .amount-input{
    width:64px; text-align:center; border:1px solid var(--line); border-radius:8px;
    padding:6px 4px; font-family:'IBM Plex Mono'; font-size:13px;
  }
  .pill{
    font-size:11px; padding:5px 10px; border-radius:20px; border:none; cursor:pointer;
    font-family:'IBM Plex Sans Arabic'; font-weight:600;
  }
  .pill.pay{background:var(--good); color:#fff;}
  .pill.pay.done{background:#e9f5ef; color:var(--good); border:1px solid var(--good);}
  .vacant-tag{font-size:11px; color:var(--ink-soft); background:var(--paper-2); padding:4px 10px; border-radius:20px;}
  .export-btn{
    font-size:12px; padding:7px 14px; border-radius:20px; border:none; cursor:pointer;
    font-family:'IBM Plex Sans Arabic'; font-weight:600; background:var(--ink); color:#fff;
  }

  .floor-group-title{
    font-size:11px; color:#8b98b5; margin:14px 0 2px; letter-spacing:.5px;
  }

  /* expenses / fund list */
  .tx-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .tx-row:last-child{border-bottom:none;}
  .tx-main{display:flex; flex-direction:column;}
  .tx-main .note{font-weight:600;}
  .tx-main .date{font-size:11px; color:var(--ink-soft);}
  .tx-amt.out{color:var(--bad);}
  .tx-amt.in{color:var(--good);}
  .tx-attach{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:6px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    font-size:12px; text-decoration:none; cursor:pointer;
  }
  .exp-file-name{font-size:11px; color:var(--ink-soft); margin-inline-start:4px;}

  form.inline{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  form.inline input, form.inline select{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:'IBM Plex Sans Arabic'; font-size:13px; flex:1; min-width:100px;
  }
  form.inline button{
    background:var(--ink); color:#fff; border:none; border-radius:8px;
    padding:8px 16px; font-size:13px; cursor:pointer; font-weight:600;
  }
  .preset-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .preset{
    font-size:11.5px; background:var(--paper-2); border:1px solid var(--line);
    border-radius:20px; padding:5px 10px; cursor:pointer; color:var(--ink-soft);
  }

  .plan-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .plan-row:last-child{border-bottom:none;}
  .plan-row .item{flex:1; font-size:13.5px;}
  .plan-row.done .item{text-decoration:line-through; color:#a2acc4;}
  .plan-row input[type=checkbox]{width:18px; height:18px; accent-color:var(--good);}

  .empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 0;}
  .note-strip{
    background:#eaf2ff; border:1px solid #bcd6fb; border-radius:10px; padding:9px 12px;
    font-size:12px; color:#1e4fa8; margin-bottom:12px;
  }
  .del{background:none; border:none; color:#a7b2c9; cursor:pointer; font-size:15px; padding:2px 6px;}
  /* خانة البحث في الصندوق — شغّالة حتى في وضع العرض فقط */
  .search-input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 12px;
    font-family:'IBM Plex Sans Arabic'; font-size:13.5px; background:var(--paper); color:var(--ink);
  }
  .search-input:focus{outline:none; border-color:var(--wall-2); background:#fff;}
  #content.locked input.search-input{pointer-events:auto; opacity:1;}

/* ---------------- شيت جوجل كقاعدة بيانات مشتركة ---------------- */
/* غيّر الرابط ده لو عملت نشر (Deploy) جديد للسكريبت وطلع لك رابط مختلف */
const REMOTE_DB_URL = 'https://script.google.com/macros/s/AKfycbz1_5VB0BEdJt6w0GiajPA2Rwdyx63CWSaYhZ2EYfu9EG038vZmsgDleAYxZrW1-Ch3aA/exec';

/* رابط سكريبت رفع المرفقات على جوجل درايف (ملف Attachments.gs — نشر منفصل).
   لو فاضي: المرفقات بتتحفظ جوه الشيت زي الأول (وده اللي بيخلّي الحفظ يفشل لما الحجم يكبر).
   لو متعبّي: المرفق بيترفع على درايف وبيتحفظ في الشيت رابطه بس. */
const ATTACH_UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbxYa9M4dq4gIQ2xjpmd_jAOTwDL3jsQ3mNgVOKS_bdnwsW7Tj0wbvXZdMPuZt4EERtl/exec';

async function uploadAttachmentToDrive(att){
  const comma = att.dataUrl.indexOf(',');
  const res = await fetch(ATTACH_UPLOAD_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // نص عادي عشان نتفادى preflight
    body: JSON.stringify({action:'upload', name: att.name, type: att.type, data: att.dataUrl.slice(comma+1)})
  });
  const txt = await res.text();
  let json = null;
  try{ json = JSON.parse(txt); }catch(e){}
  if(!json || json.ok !== true || !json.url){
    throw new Error((json && json.error) || 'رد غير مفهوم من سكريبت المرفقات (راجع إن النشر Anyone)');
  }
  return {name: att.name, type: att.type, id: json.id, url: json.url};
}

/* ================== طبقة القراءة والحفظ — نسخة محميّة ==================
   اللي حصل قبل كده: لو القراءة من جوجل شيت فشلت لأي سبب (نت ضعيف، صلاحيات
   النشر، رد غير متوقع من السكريبت)، البرنامج كان بيفهم إن قاعدة البيانات فاضية،
   فيبدأ ببيانات افتراضية (seed) ويحفظها فوق البيانات الحقيقية.

   القواعد الجديدة:
   1) ممنوع أي كتابة قبل ما نتأكد إن القراءة نجحت (canWrite).
   2) بنفرّق بين "فشل القراءة" و"قاعدة البيانات فاضية فعلاً".
   3) مفيش بيانات افتراضية بتتكتب تلقائيًا — لازم قرار صريح منك.
   4) كل نسخة بتتقرأ بنجاح بتتخزّن نسخة منها على الجهاز كـ backup.
   5) السيرفر نفسه بيرفض أي حفظ بينقّص البيانات فجأة (شوف Code.gs). */

const LOCAL_BACKUP_KEY = STORE_KEY + '::backup';
let lastSyncedRaw = null;
let syncTimer = null;
let canWrite = false;        // مفيش حفظ خالص قبل قراءة ناجحة
let readOnlyReason = '';
let booting = false;         // true = بنعرض نسخة الجهاز لحد ما القراءة من جوجل شيت تخلص

function setSyncStatus(txt, isError){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = txt;
  el.style.color = isError ? '#ffc2c2' : '#bfe0ff';
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

function saveLocalBackup(raw){
  try{
    localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify({at: new Date().toISOString(), raw: raw}));
    localStorage.setItem('data', raw);
  }catch(e){}
}

function readLocalBackup(){
  try{
    const s = localStorage.getItem(LOCAL_BACKUP_KEY);
    if(s){
      const o = JSON.parse(s);
      if(o && o.raw) return o;
    }
    const legacy = localStorage.getItem('data');
    if(legacy) return {at:null, raw:legacy};
  }catch(e){}
  return null;
}

function validState(obj){
  return !!obj && typeof obj === 'object' && Array.isArray(obj.apartments) && obj.apartments.length > 0;
}

/* ---- شاشة توقف كاملة: بتظهر لما نبقى مش متأكدين من البيانات، وبتمنع أي شغل ---- */
function showBlocker(title, msg, buttons){
  let ov = document.getElementById('blockerOverlay');
  if(ov) ov.remove();

  ov.id = 'blockerOverlay';

  p.setAttribute('style','font-size:13px; line-height:1.8; color:#3d4b66; margin-bottom:16px; white-space:pre-line;');

  box.appendChild(h); box.appendChild(p);
  (buttons||[]).forEach(function(b){
    const btn = document.createElement('button');
    btn.textContent = b.label;
    btn.setAttribute('style','display:block; width:100%; margin:6px 0; padding:11px; border-radius:10px; border:1px solid ' + (b.danger?'#e2b4b4':'#bcd6fb') + '; background:' + (b.danger?'#fff5f5':'#eaf2ff') + '; color:' + (b.danger?'#a12b2b':'#1e4fa8') + '; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer;');
    btn.onclick = b.onClick;
    box.appendChild(btn);
  });
  ov.appendChild(box);
  document.body.appendChild(ov);
}
function hideBlocker(){
  const ov = document.getElementById('blockerOverlay');
  if(ov) ov.remove();
}

/* ---------------- القراءة من جوجل شيت ---------------- */
/* بترجّع {ok:true, value:'...'} أو {ok:true, value:null} (فاضية فعلاً)
   أو {ok:false, error:'...'} (فشل — ومفيش أي كتابة في الحالة دي) */
async function remoteGetOnce(key){
  const res = await fetch(REMOTE_DB_URL + '?key=' + encodeURIComponent(key), {cache:'no-store'});
  if(!res.ok) throw new Error('السيرفر رجّع كود ' + res.status);
  const txt = await res.text();
  let json;
  try{ json = JSON.parse(txt); }
  catch(e){ throw new Error('رد غير مفهوم من السكريبت (راجع صلاحيات النشر: Anyone)'); }
  if(!json || typeof json !== 'object' || !('value' in json)) throw new Error('الرد ناقص من السكريبت');
  const v = json.value;
  if(v === null || v === undefined || String(v).trim() === '') return {ok:true, value:null};
  return {ok:true, value:String(v)};
}

async function remoteGet(key, tries){
  if(!REMOTE_DB_URL) return {ok:false, error:'مفيش رابط لقاعدة البيانات'};
  tries = tries || 3;
  let lastErr = null;
  for(let i=0; i<tries; i++){
    try{ return await remoteGetOnce(key); }
    catch(e){
      lastErr = e;
      if(i < tries-1) await sleep(900*(i+1));
    }
  }
  return {ok:false, error: lastErr ? lastErr.message : 'سبب غير معروف'};
}

async function remoteSet(key, value, force){
  const res = await fetch(REMOTE_DB_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // نص عادي عشان نتفادى preflight
    body: JSON.stringify({key:key, value:value, force: !!force})
  });
  const txt = await res.text();
  let json = null;
  try{ json = JSON.parse(txt); }catch(e){}
  if(!json || json.ok !== true){
    const err = new Error((json && json.error) || 'الحفظ ما تمّش');
    err.code = json && json.code;
    err.info = json;
    throw err;
  }
  return json;
}

/* ---------------- تحميل البيانات أول ما التطبيق يفتح ---------------- */
async function loadState(){
  setSyncStatus(booting
    ? '⚡ معروض من آخر نسخة على الجهاز — بيحدّث من جوجل شيت...'
    : '🔄 بيقرأ البيانات من جوجل شيت...');
  const r = await remoteGet('data');

  // 1) قراءة ناجحة وفيها بيانات
  if(r.ok && r.value){
    let parsed = null;
    try{ parsed = JSON.parse(r.value); }catch(e){}
    if(!validState(parsed)){
      canWrite = false;
      readOnlyReason = 'البيانات اللي في الشيت مش سليمة';
      setSyncStatus('⛔ البيانات اللي في جوجل شيت مش مقروءة — الحفظ متوقف', true);
      showBlocker('البيانات في جوجل شيت مش سليمة',
        'التطبيق قرأ الشيت بس مش قادر يفهم المحتوى، فوقف الحفظ عشان مايكتبش فوق حاجة.\nافتح الشيت وارجع نسخة سابقة من: ملف ← سجل الإصدارات.',
        [{label:'حاول تاني', onClick: retryLoad}]);
      return false;
    }
    lastSyncedRaw = r.value;
    state = parsed;
    canWrite = true;
    saveLocalBackup(r.value);
    setSyncStatus('🟢 متصل بجوجل شيت');
    migrateState();
    return true;
  }

  const local = readLocalBackup();

  // 2) فشل الاتصال — ممنوع الكتابة تمامًا
  if(!r.ok){
    canWrite = false;
    readOnlyReason = 'مفيش اتصال بجوجل شيت';
    setSyncStatus('🟠 مش متصل بجوجل شيت — الحفظ متوقف', true);
    const btns = [{label:'حاول تاني', onClick: retryLoad}];
    if(local && validState(safeParse(local.raw))){
      btns.push({label:'اعرض آخر نسخة على الجهاز (عرض فقط)', onClick: function(){
        state = safeParse(local.raw);
        migrateState();
        hideBlocker();
        renderAll();
        setSyncStatus('👁️ عرض فقط من نسخة الجهاز — أي تعديل مش هيتحفظ', true);
      }});
    }
    showBlocker('مش قادر أوصل لقاعدة البيانات',
      'السبب: ' + r.error + '\nالتطبيق وقف الحفظ عشان مايمسحش البيانات الموجودة في جوجل شيت.',
      btns);
    return false;
  }

  // 3) الاتصال تمام بس قاعدة البيانات فاضية فعلاً
  canWrite = false;
  readOnlyReason = 'قاعدة البيانات فاضية';
  setSyncStatus('⚠️ قاعدة البيانات فاضية — مفيش حفظ تلقائي', true);
  const btns = [{label:'حاول تاني', onClick: retryLoad}];
  if(local && validState(safeParse(local.raw))){
    btns.push({label:'ارفع آخر نسخة محفوظة على الجهاز' + (local.at ? ' (' + new Date(local.at).toLocaleString('ar-EG') + ')' : ''), onClick: async function(){
      const parsed = safeParse(local.raw);
      state = parsed;
      canWrite = true;
      lastSyncedRaw = null;
      hideBlocker();
      await persist({force:true});
      renderAll();
    }});
  }
  btns.push({label:'ابدأ بيانات جديدة من الصفر', danger:true, onClick: async function(){
    if(prompt('ده هيكتب بيانات جديدة فاضية في جوجل شيت.\nلو انت متأكد اكتب كلمة: جديد') !== 'جديد') return;
    state = seedState();
    canWrite = true;
    lastSyncedRaw = null;
    hideBlocker();
    await persist({force:true});
    renderAll();
  }});
  showBlocker('قاعدة البيانات فاضية',
    'جوجل شيت رد بنجاح بس مفيش بيانات متسجّلة.\nلو المفروض فيه بيانات، متكملش — افتح الشيت وارجع نسخة سابقة من: ملف ← سجل الإصدارات.',
    btns);
  return false;
}

function safeParse(raw){
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

async function retryLoad(){
  hideBlocker();
  setSyncStatus('🔄 بيحاول تاني...');
  const ok = await loadState();
  if(ok) renderAll();
}

/* بيجيب آخر نسخة من جوجل شيت دوري عشان أي تغيير يظهر عند الكل.
   بيوقف وانت فاتح وضع التعديل، وبيوقف كمان لو إحنا في وضع "عرض فقط". */
async function pollRemote(){
  if(unlocked || !canWrite) return;
  const r = await remoteGet('data', 1);
  if(!r.ok || !r.value || r.value === lastSyncedRaw) return;
  const parsed = safeParse(r.value);
  if(!validState(parsed)) return;   // مانستبدلش الشاشة ببيانات مشبوهة
  lastSyncedRaw = r.value;
  state = parsed;
  saveLocalBackup(r.value);
  migrateState();
  renderAll();
}

function startSyncPolling(){
  if(!REMOTE_DB_URL) return;
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(pollRemote, 20000); // كل 20 ثانية
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden) pollRemote();
  });
}

function migrateState(opts){
  opts = opts || {};
  let changed = false;
  if(!state.settings){
    state.settings = { elevatorAmount:500, noElevatorAmount:450 };
    changed = true;
  }
  if(!state.settings.editPin){
    state.settings.editPin = '1234';
    changed = true;
  }
  if(typeof state.settings.unlockTaps !== 'number'){
    state.settings.unlockTaps = 4;
    changed = true;
  }
  if(typeof state.settings.changePinTaps !== 'number'){
    state.settings.changePinTaps = 7;
    changed = true;
  }
  if(!Array.isArray(state.settings.expenseKinds) || !state.settings.expenseKinds.length){
    // أنواع المصروفات الافتراضية (بتتعدّل من تبويب الإعدادات)
    state.settings.expenseKinds = DEFAULT_EXPENSE_KINDS.map(k=> Object.assign({}, k));
    changed = true;
  }
  if(typeof state.settings.openingBalance !== 'number'){
    const oldLedgerSum = (state.fundLedger||[]).reduce((s,f)=>s+f.amount,0);
    state.settings.openingBalance = oldLedgerSum || 4050;
    state.fundLedger = [];
    changed = true;
  }
  state.apartments.forEach(a=>{
    if(typeof a.elevator !== 'boolean'){
      a.elevator = a.floor !== 'الأرضي';
      changed = true;
    }
    if(typeof a.occupied !== 'boolean'){
      a.occupied = !!a.name;
      changed = true;
    }
    if(!Array.isArray(a.occupancyPeriods)){
      // بيانات قديمة: لو الشقة مأهولة حاليًا نعتبرها مأهولة من أول شهر متسجّل عندنا عشان مانخسرش المتأخرات القديمة
      a.occupancyPeriods = a.occupied ? [{from: START_MONTH, to: null}] : [];
      changed = true;
    }
  });
  if(!Array.isArray(state.commitments)){
    state.commitments = [];
    changed = true;
  }
  if(!Array.isArray(state.commitmentPayments)){
    state.commitmentPayments = [];
    changed = true;
  }
  if(!Array.isArray(state.elevatorSpends)){
    state.elevatorSpends = [];
    changed = true;
  }
  if(!state.paymentDates){
    state.paymentDates = {};
    changed = true;
  }
  (state.commitments||[]).forEach(c=>{
    if(typeof c.fundType !== 'string'){
      c.fundType = 'general';
      changed = true;
    }
  });
  if(changed && !opts.noSave) persist();
}

/* الحفظ: مفيش كتابة قبل قراءة ناجحة، ومفيش كتابة لبيانات فاضية أو ناقصة.

   ملحوظة عن التزامن: لو المستخدم عدّل كذا حاجة ورا بعض بسرعة (زي إنه يعدّي على
   كذا حقل تحصيل ورا بعض)، كل تعديل كان بيبعت request منفصل لجوجل شيت، والشبكة
   مش بتضمن إن الـ requests دي توصل وتتنفذ بنفس ترتيبها — فممكن تعديل أقدم يوصل
   ويتنفذ بعد تعديل أحدث ويمسحه من غير ما حد يلاحظ. عشان كده الحفظ دلوقتي بيعدّي
   من خلال "طابور": مفيش أكتر من request حفظ شغال في نفس اللحظة؛ لو تعديل جديد
   حصل وإحنا لسه بنحفظ التعديل اللي قبله، بنستنى لحد ما الحفظ الحالي يخلص وبعدين
   نبعت حفظة واحدة تانية بأحدث نسخة من الداتا (بدل ما نبعت request لكل تعديل). */
let saveInFlight = false;
let savePending = false;
let pendingForce = false;

async function persist(opts){
  opts = opts || {};
  if(opts.force) pendingForce = true;
  if(saveInFlight){
    savePending = true;
    return true; // اتسجّل واتحفظ محليًا فعلاً (localStorage) — هيتبعت لجوجل شيت أول ما الحفظ الحالي يخلص
  }
  saveInFlight = true;
  const forceThisRun = pendingForce;
  pendingForce = false;
  let result = await persistNow({force: forceThisRun});
  saveInFlight = false;
  if(savePending){
    savePending = false;
    result = await persist(); // فيه تعديل جديد اتراكم وإحنا بنحفظ — نحفظ بأحدث نسخة دلوقتي
  }
  return result;
}

async function persistNow(opts){
  opts = opts || {};
  if(!canWrite){
    setSyncStatus('⛔ الحفظ متوقف (' + (readOnlyReason || 'البيانات مش متحمّلة من جوجل شيت') + ')', true);
    return false;
  }
  if(!validState(state)){
    setSyncStatus('⛔ اتمنع حفظ بيانات ناقصة', true);
    return false;
  }
  const raw = JSON.stringify(state);
  saveLocalBackup(raw);
  const prev = lastSyncedRaw;
  lastSyncedRaw = raw;
  setSyncStatus('🔄 بيحفظ...');
  try{
    await remoteSet('data', raw, opts.force);
    setSyncStatus('🟢 اتحفظ في جوجل شيت ' + new Date().toLocaleTimeString('ar-EG'));
    return true;
  }catch(e){
    if(e.code === 'SHRINK_GUARD'){
      const info = e.info || {};
      const ok = confirm('تحذير: البيانات الجديدة أصغر بكتير من اللي متسجّل في جوجل شيت'
        + '\n(القديم ' + (info.oldLength||'?') + ' حرف — الجديد ' + (info.newLength||'?') + ' حرف).'
        + '\nلو ده مش مقصود، اختار "إلغاء" والبيانات هتفضل زي ما هي.'
        + '\nتحب تكمّل الحفظ؟');
      if(ok) return await persistNow({force:true});
      lastSyncedRaw = prev;
      setSyncStatus('⛔ الحفظ اتلغى — البيانات في جوجل شيت زي ما هي', true);
      return false;
    }
    lastSyncedRaw = prev;
    setSyncStatus('🟠 محفوظ على الجهاز بس — ' + e.message, true);
    return false;
  }
}

/* ---------------- نسخة احتياطية يدوية (ملف على الموبايل/الكمبيوتر) ---------------- */
function exportBackup(){
  const raw = lastSyncedRaw || (state ? JSON.stringify(state) : null);
  if(!raw){ alert('مفيش بيانات متحمّلة دلوقتي.'); return; }
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  const blob = new Blob([raw], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'نسخة-حسابات-العمارة-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = async function(){
    const parsed = safeParse(String(reader.result));
    if(!validState(parsed)){ alert('الملف ده مش نسخة سليمة.'); return; }
    if(!confirm('هيتم استبدال البيانات الحالية في جوجل شيت بمحتوى الملف ('
      + parsed.apartments.length + ' شقة). تحب تكمّل؟')) return;
    state = parsed;
    canWrite = true;
    migrateState();
    await persist({force:true});
    renderAll();
    alert('تمّت الاستعادة.');
  };
  reader.readAsText(file, 'utf-8');
}

function fmt(n){
  n = Math.round(n);
  return n.toLocaleString('en-US');
}

/* أي نص بيكتبه المستخدم (اسم ساكن، ملاحظة، بيان...) ولازم يتحط جوه HTML لازم
   يعدّي من هنا الأول، عشان علامة زي " أو < ماتكسرش شكل الصفحة أو الحقول. */
function escapeHtml(str){
  if(str===null || str===undefined) return '';
  return String(str).replace(/[&<>"']/g, function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}

function fileToAttachment(file){
  if(file.type && file.type.startsWith('image/')){
    return compressImageToAttachment(file);
  }
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve({name: file.name, type: file.type, dataUrl: reader.result});
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressImageToAttachment(file, maxDim = 1600, quality = 0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({name: file.name.replace(/\.(png|heic|webp)$/i,'.jpg'), type:'image/jpeg', dataUrl});
      };
      img.onerror = ()=>{
        // مش قادر يفتحها كصورة (مثلا HEIC مش مدعومة) — رجّع الملف الأصلي من غير ضغط
        resolve({name: file.name, type: file.type, dataUrl: reader.result});
      };
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function apartmentsByFloor(){
  const groups = {};
  state.apartments.forEach(a=>{
    if(!groups[a.floor]) groups[a.floor]=[];
    groups[a.floor].push(a);
  });
  return groups;
}

function isOccupiedInMonth(apt, monthKey){
  const periods = apt.occupancyPeriods || [];
  return periods.some(p => monthKey >= p.from && (p.to===null || monthKey < p.to));
}

function statusFor(apt, monthKey){
  if(!isOccupiedInMonth(apt, monthKey)) return 'vacant';
  const paid = (state.payments[monthKey]||{})[apt.id] || 0;
  if(paid<=0) return 'unpaid';
  if(paid>=apt.subscription) return 'paid';
  return 'partial';
}

function computeMonthTotals(monthKey){
  let expected=0, collected=0, outstanding=0;
  state.apartments.forEach(a=>{
    if(!isOccupiedInMonth(a, monthKey)) return;
    expected += a.subscription;
    const paid = (state.payments[monthKey]||{})[a.id] || 0;
    collected += paid;
    if(paid < a.subscription) outstanding++;
  });
  return {expected, collected, outstanding};
}

function computeFundBalance(){
  let bal = state.settings.openingBalance || 0;
  state.fundLedger.forEach(f=> bal += f.amount);
  Object.values(state.payments).forEach(monthObj=>{
    Object.values(monthObj).forEach(v=> bal += v);
  });
  (state.commitmentPayments||[]).forEach(cp=>{
    const c = state.commitments.find(x=>x.id===cp.commitmentId);
    if(c && !c.aptId){
      bal -= cp.amount; // سداد التزام عام (دين/فاتورة على العمارة) = فلوس بتخرج من الصندوق
    } else {
      bal += cp.amount; // تحصيل التزام إضافي من ساكن معيّن = فلوس بتدخل الصندوق
    }
  });
  state.expenses.forEach(e=> bal -= e.amount);
  (state.elevatorSpends||[]).forEach(sp=> bal -= sp.amount);
  return bal;
}

/* ---------------- COMMITMENTS (التزامات) ---------------- */
const COMMITMENT_TYPES = {
  once: 'مرة واحدة',
  monthly: 'شهري ثابت',
  installment: 'قسط شهري'
};

function commitmentTotalDue(c, uptoMonthKey){
  uptoMonthKey = uptoMonthKey || currentMonth;
  if(uptoMonthKey < c.startMonth) return 0;
  if(c.type==='once') return c.amount;
  const months = monthsRange(c.startMonth, uptoMonthKey).length;
  if(c.type==='installment') return Math.min(c.totalAmount||0, c.amount * months);
  // monthly: تراكم كل شهر من شهر البداية لحد الشهر الحالي
  return c.amount * months;
}

function commitmentPaidTotal(c){
  return (state.commitmentPayments||[])
    .filter(cp=>cp.commitmentId===c.id)
    .reduce((s,cp)=>s+cp.amount,0);
}

function commitmentRemaining(c, uptoMonthKey){
  const due = commitmentTotalDue(c, uptoMonthKey);
  const paid = commitmentPaidTotal(c);
  const rem = due - paid;
  return c.type==='monthly' ? rem : Math.max(0, rem);
}

function commitmentTotalRemaining(c){
  // remaining to fully close the commitment, regardless of how many months elapsed
  const total = c.type==='installment' ? (c.totalAmount||0) : commitmentTotalDue(c, currentMonth);
  return Math.max(0, total - commitmentPaidTotal(c));
}

function commitmentSuggestedAmount(c){
  const rem = commitmentRemaining(c, currentMonth);
  if(c.type==='monthly') return c.amount;
  return Math.max(0, Math.min(c.amount, rem));
}

function aptCommitments(aptId){
  return (state.commitments||[]).filter(c=>c.aptId===aptId && c.startMonth<=currentMonth);
}

function monthsRange(fromKey, toKey){
  const months = [];
  let cur = fromKey;
  // safety cap so a bad date never loops forever
  for(let i=0;i<240;i++){
    months.push(cur);
    if(cur===toKey) break;
    cur = shiftMonth(cur, 1);
  }
  return months;
}

function computeArrears(){
  const asOf = arrearsAsOfMonth();
  const months = monthsRange(START_MONTH, asOf);
  const perApt = {}; // aptId -> {apt, total, items:[{label, owed}]}
  state.apartments.forEach(apt=>{
    months.forEach(mk=>{
      if(!isOccupiedInMonth(apt, mk)) return;
      const paid = (state.payments[mk]||{})[apt.id] || 0;
      const owed = apt.subscription - paid;
      if(owed>0){
        if(!perApt[apt.id]) perApt[apt.id] = {apt, total:0, items:[]};
        perApt[apt.id].total += owed;
        perApt[apt.id].items.push({label: monthLabel(mk), owed, mk});
      }
    });
    aptCommitments(apt.id).forEach(c=>{
      const rem = commitmentRemaining(c, asOf);
      if(rem>0){
        if(!perApt[apt.id]) perApt[apt.id] = {apt, total:0, items:[]};
        perApt[apt.id].total += rem;
        perApt[apt.id].items.push({label: 'دين: ' + (c.note||COMMITMENT_TYPES[c.type]), owed: rem, commitId: c.id});
      }
    });
  });
  return Object.values(perApt).sort((a,b)=> b.total - a.total);
}

function settleArrearsForApt(aptId){
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt) return;
  const asOf = arrearsAsOfMonth();
  const months = monthsRange(START_MONTH, asOf);
  months.forEach(mk=>{
    if(!isOccupiedInMonth(apt, mk)) return;
    if(!state.payments[mk]) state.payments[mk] = {};
    if(!state.paymentDates[mk]) state.paymentDates[mk] = {};
    const paid = state.payments[mk][apt.id] || 0;
    if(paid < apt.subscription){
      state.payments[mk][apt.id] = apt.subscription;
      state.paymentDates[mk][apt.id] = collectDate; // تاريخ التحصيل المختار، مش النهارده بالعافية
    }
  });
  aptCommitments(apt.id).forEach(c=>{
    const rem = commitmentRemaining(c, asOf);
    if(rem>0){
      if(!state.commitmentPayments) state.commitmentPayments=[];
      state.commitmentPayments.push({
        id:'cp'+Date.now()+Math.random().toString(36).slice(2,6),
        commitmentId:c.id, aptId:c.aptId, date: collectDate, amount: rem
      });
    }
  });
}

function editArrearOwed(aptId, key, newOwedRaw){
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt) return;
  const newOwed = Number(newOwedRaw);
  if(isNaN(newOwed) || newOwed<0) { renderAll(); return; }
  if(key.startsWith('m:')){
    // بند اشتراك شهر معيّن: المتأخر = الاشتراك - المدفوع، فتعديل المتأخر معناه تعديل المدفوع المقابل
    const mk = key.slice(2);
    if(newOwed > apt.subscription){
      // المتأخر مايزيدش عن الاشتراك، وإلا المدفوع هيتسجّل بالسالب وينقّص رصيد الصندوق
      alert('المتأخر ماينفعش يبقى أكبر من الاشتراك الشهري (' + fmt(apt.subscription) + ' جنيه).\nلو فيه مبلغ زيادة على الساكن سجّله كالتزام/دين عليه.');
      renderAll();
      return;
    }
    if(!state.payments[mk]) state.payments[mk] = {};
    if(!state.paymentDates[mk]) state.paymentDates[mk] = {};
    state.payments[mk][apt.id] = apt.subscription - newOwed;
    state.paymentDates[mk][apt.id] = collectDate;
  } else if(key.startsWith('c:')){
    // بند التزام (دين/قسط): بنسجّل الفرق كسداد أو كإضافة على الالتزام عشان يظبط المتبقي على القيمة الجديدة
    const commitId = key.slice(2);
    const c = state.commitments.find(x=>x.id===commitId);
    if(!c) return;
    const oldRem = commitmentRemaining(c, arrearsAsOfMonth());
    const delta = oldRem - newOwed;
    if(delta !== 0){
      if(!state.commitmentPayments) state.commitmentPayments = [];
      state.commitmentPayments.push({
        id:'cp'+Date.now()+Math.random().toString(36).slice(2,6),
        commitmentId: c.id, aptId: c.aptId, date: collectDate, amount: delta
      });
    }
  }
  persist(); renderAll();
}

function computeElevatorFundBalance(){
  // بيجمع بس الالتزامات اللي اتعلّمت "خاصة باشتراكات الأسانسير" — سواء تحصيل من ساكن مشترك جديد (بيزوّد الرصيد)
  // أو التزام عام مرتبط بالأسانسير بدون شقة معيّنة (بيقلل منه)، بالإضافة لعمليات الصرف اليدوي
  let bal = 0;
  (state.commitmentPayments||[]).forEach(cp=>{
    const c = state.commitments.find(x=>x.id===cp.commitmentId);
    if(c && c.fundType==='elevator'){
      bal += c.aptId ? cp.amount : -cp.amount;
    }
  });
  (state.elevatorSpends||[]).forEach(sp=> bal -= sp.amount);
  return bal;
}

function apartmentElevatorCredit(aptId){
  // الرصيد ده ملك مشترك لكل المشتركين في الأسانسير مع بعض (مش خاص بمين دفع بالظبط) — بيتقسم بالتساوي بينهم
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt || !apt.elevator) return 0;
  const subscribers = state.apartments.filter(a=>a.elevator);
  if(subscribers.length===0) return 0;
  return computeElevatorFundBalance() / subscribers.length;
}

function useElevatorShareForApt(aptId, amount){
  // بيستخدم مبلغ (نصيب الشقة من رصيد الأسانسير المشترك) في سداد المستحق على الشقة دي —
  // بيبدأ بالاشتراكات المتأخرة (الأقدم فالأقدم) وبعدين أي التزامات تانية عليها غير مرتبطة بالأسانسير نفسه،
  // وبعدين بيسجّل المبلغ اللي فعلاً اتصرف كخصم من رصيد الأسانسير المشترك.
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt || amount<=0) return 0;
  let remaining = amount;
  const months = monthsRange(START_MONTH, currentMonth);
  months.forEach(mk=>{
    if(remaining<=0) return;
    if(!isOccupiedInMonth(apt, mk)) return;
    if(!state.payments[mk]) state.payments[mk] = {};
    if(!state.paymentDates[mk]) state.paymentDates[mk] = {};
    const paid = state.payments[mk][apt.id] || 0;
    const owed = apt.subscription - paid;
    if(owed>0){
      const pay = Math.min(owed, remaining);
      state.payments[mk][apt.id] = paid + pay;
      state.paymentDates[mk][apt.id] = todayStr();
      remaining -= pay;
    }
  });
  if(remaining>0){
    aptCommitments(apt.id).forEach(c=>{
      if(remaining<=0) return;
      if(c.fundType==='elevator') return; // متعملش خصم لاشتراك الأسانسير نفسه من رصيد الأسانسير
      const rem = commitmentRemaining(c, currentMonth);
      if(rem>0){
        const pay = Math.min(rem, remaining);
        if(!state.commitmentPayments) state.commitmentPayments=[];
        state.commitmentPayments.push({
          id:'cp'+Date.now()+Math.random().toString(36).slice(2,6),
          commitmentId:c.id, aptId:c.aptId, date: currentMonth+'-01', amount: pay
        });
        remaining -= pay;
      }
    });
  }
  const used = amount - remaining;
  if(used>0){
    if(!state.elevatorSpends) state.elevatorSpends=[];
    state.elevatorSpends.push({
      id:'esp'+Date.now()+Math.random().toString(36).slice(2,6),
      date: currentMonth+'-01',
      note: 'خصم نصيب '+(apt.name||apt.id)+' من رصيد الأسانسير في سداد المستحق عليه',
      amount: used
    });
  }
  return used;
}

function computeTotalObligations(){
  // بس الالتزامات العامة على العمارة (بدون شقة) — مش المبالغ الإضافية المطلوبة من ساكن معيّن
  return (state.commitments||[]).filter(c=>!c.aptId).reduce((s,c)=> s + commitmentTotalRemaining(c), 0);
}

function commitmentAptLabel(c){
  if(!c.aptId) return 'التزام عام (بدون شقة)';
  const apt = state.apartments.find(a=>a.id===c.aptId);
  return apt ? (apt.name||apt.id) : c.aptId;
}

function computeMonthExpenses(monthKey){
  return state.expenses
    .filter(e=> e.date && e.date.slice(0,7)===monthKey)
    .reduce((s,e)=>s+e.amount,0);
}

/* ---------------- أنواع المصروفات وطريقة تقسيمها ----------------
   كل مصروف أو التزام عام على العمارة ليه "نوع" من القايمة دي، والقايمة بتتعدّل من تبويب ⚙️ الإعدادات.
   طريقة التقسيم لكل نوع (split):
     all          على كل السكان النشطين (المأهولين في الشهر)
     elevator     على المشتركين في الأسانسير بس
     nonElevator  على غير المشتركين بس
     mixed        allPct% على الكل والباقي على المشتركين في الأسانسير
   لو النوع ليه fixedMonthly: المبلغ ده بيتحسب كل شهر (من أول شهر اتسجّل فيه النوع) مهما اتدفع،
   والدفعات المتسجّلة بتظهر للمتابعة بس.
   نوعين ليهم حساب خاص (method):
     water        مصروف المياه في الشهر، وإلا التزام الإيصال (بشهر الفاتورة)، وإلا تقدير من آخر فاتورة.
     electricity  بندفع كل ما الكارت يخلص: كل شحنة بتتوزع على الأيام لحد الشحنة اللي بعدها،
                  والأيام بعد آخر شحنة بتتقدّر بمتوسط اليوم (شوف computeMonthElectricity). */
const DEFAULT_EXPENSE_KINDS = [
  {key:'water',       label:'مياه',             icon:'💧', split:'all', method:'water'},
  {key:'electricity', label:'كهرباء',           icon:'⚡', split:'mixed', allPct:70, method:'electricity'},
  {key:'stairs',      label:'نظافة سلم',        icon:'🧹', split:'all', fixedMonthly:1200},
  {key:'elevator',    label:'صيانة أسانسير',    icon:'🛗', split:'elevator'},
  {key:'pump',        label:'صيانة موتور مياه', icon:'⚙️', split:'all'},
  {key:'maintenance', label:'صيانة عامة',       icon:'🔧', split:'all'},
  {key:'other',       label:'أخرى',             icon:'🧾', split:'all'},
];
const LOCKED_KINDS = ['water','electricity','other']; // مينفعش تتمسح: ليها حساب خاص، و"أخرى" هي الاحتياطي
const SPLIT_LABELS = {
  all: 'على كل السكان',
  elevator: 'مشتركين الأسانسير بس',
  nonElevator: 'غير المشتركين بس',
  mixed: 'نسبة على الكل والباقي على الأسانسير'
};

function expenseKinds(){
  return (state && state.settings && Array.isArray(state.settings.expenseKinds) && state.settings.expenseKinds.length)
    ? state.settings.expenseKinds : DEFAULT_EXPENSE_KINDS;
}
function validKind(key){ return !!key && expenseKinds().some(k=> k.key===key); }
function kindInfo(key){
  return expenseKinds().find(k=> k.key===key)
    || expenseKinds().find(k=> k.key==='other')
    || DEFAULT_EXPENSE_KINDS[DEFAULT_EXPENSE_KINDS.length-1];
}
function kindName(key){ const k = kindInfo(key); return (k.icon ? k.icon + ' ' : '') + k.label; }
function splitText(k){
  if(k.split==='mixed'){
    const p = Math.max(0, Math.min(100, Number(k.allPct)||0));
    return p + '% على الكل · ' + (100-p) + '% على الأسانسير';
  }
  return SPLIT_LABELS[k.split] || SPLIT_LABELS.all;
}

function kindSelectHtml(attrs, selected, placeholder){
  return `<select class="kind-select" ${attrs}>`
    + (placeholder ? `<option value="">${escapeHtml(placeholder)}</option>` : '')
    + expenseKinds().map(k=> `<option value="${escapeHtml(k.key)}" ${k.key===selected?'selected':''}>${escapeHtml(kindName(k.key))}</option>`).join('')
    + `</select>`;
}

/* ---- تخمين نوع الحاجات القديمة اللي اتسجّلت قبل قايمة الأنواع (بيتراجع من "مراجعة التصنيف") ---- */
function textKind(text){
  const c = normalizeSearch(text);
  if(c.includes('صيان')) return 'other';            // صيانة مواسير/موتور المياه = صيانة، مش مياه
  if(c.includes('كهرب')) return 'electricity';
  if(c.includes('مياه') || c.includes('ميه')) return 'water';
  if(c.includes('السلم') || (c.includes('سلم') && /(نظاف|تنظيف|مسح|غسيل)/.test(c))) return 'stairs';
  return 'other';
}
function isElevatorText(text){
  const t = normalizeSearch(text);
  return t.includes('اسانس') || t.includes('مصعد');
}
function guessKind(mainText, extraText, elevatorFund){
  const k = textKind(mainText);
  let g;
  if(k==='electricity') g = k;
  else if(elevatorFund || isElevatorText(mainText) || isElevatorText(extraText)) g = 'elevator';
  else if(k!=='other') g = k;
  else {
    const t = normalizeSearch((mainText||'') + ' ' + (extraText||''));
    if(/(ماتور|موتور|طلمب|طرمب)/.test(t)) g = 'pump';
    else if(t.includes('صيان')) g = 'maintenance';
    else g = 'other';
  }
  return validKind(g) ? g : 'other';
}
function expenseKind(e){ return validKind(e.kind) ? e.kind : guessKind(e.category, e.note, false); }
function commitKind(c){ return validKind(c.kind) ? c.kind : guessKind(c.note, '', c.fundType==='elevator'); }

/* تغيير نوع مصروف: الفئة بتبقى اسم النوع، ولو الفئة القديمة كان فيها كلام مش موجود في البيان بنحطه في أول البيان عشان مايضيعش */
function setExpenseKind(e, key){
  const label = kindInfo(key).label;
  const old = String(e.category||'').trim();
  const oldN = normalizeSearch(old);
  if(old && !normalizeSearch(label).includes(oldN) && !normalizeSearch(e.note||'').includes(oldN)){
    e.note = old + (e.note ? ' — ' + e.note : '');
  }
  e.kind = key;
  e.category = label;
}
function setCommitKind(c, key){ c.kind = key; }

/* الحاجات اللي لسه مالهاش نوع محفوظ (مصروفات + التزامات عامة) */
function unclassifiedRecords(){
  const list = [];

    if(!validKind(e.kind)) list.push({type:'exp', id:e.id, date:e.date, text:(e.category||'') + (e.note ? ' — ' + e.note : ''), amount:e.amount, guess:expenseKind(e)});

  (state.commitments||[]).forEach(c=>{

  return list.sort((a,b)=> String(a.date).localeCompare(String(b.date)));
}

    </div>`;

/* سطر صغير في المصروفات والالتزامات بيودّي على المراجعة في الإعدادات (بيختفي لما كله يتصنّف) */
function tplKindReviewHint(){

/* ---- شهر الالتزام اللي بيتحسب عليه: من البيان لو فيه اسم شهر ("فاتورة مياه شهر يوليه" أو "شهر 7")، وإلا "شهر البداية" ----
   السنة = الأقرب لشهر التسجيل (فاتورة ديسمبر متسجّلة في يناير = ديسمبر اللي فات). */
const NOTE_MONTHS = [['يناير'],['فبراير'],['مارس'],['ابريل'],['مايو'],['يونيو','يونيه'],['يوليو','يوليه'],['اغسطس'],['سبتمبر'],['اكتوبر'],['نوفمبر'],['ديسمبر']];

function monthFromNote(note, refMonth){
  const t = normalizeSearch(note);
  let num = null;
  NOTE_MONTHS.forEach((names,i)=>{ if(num===null && names.some(n=> t.includes(n))) num = i+1; });
  if(num===null){
    const m = t.match(/شهر\s*(\d{1,2})(?!\d)/);
    if(m && Number(m[1])>=1 && Number(m[1])<=12) num = Number(m[1]);
  }
  if(num===null || !refMonth) return null;
  const [ry, rm] = refMonth.split('-').map(Number);
  let best = null, bestDiff = Infinity;
  [ry-1, ry, ry+1].forEach(y=>{
    const diff = Math.abs((y*12 + num) - (ry*12 + rm));
    if(diff < bestDiff){ bestDiff = diff; best = monthKey(y, num); }
  });
  return best;
}
function commitBillMonth(c){
  return monthFromNote(c.note, c.startMonth) || c.startMonth;
}

/* الالتزامات العامة اللي بتدخل في الحسبة. التزامات "خاص بالأسانسير" مستبعدة لأنها بتتدفع من رصيد
   الأسانسير اللي المشتركين دفعوه قبل كده، فلو دخلت هيتحسبوا عليها مرتين. */
function shareCommitments(){
  return (state.commitments||[]).filter(c=> !c.aptId && c.fundType!=='elevator');
}
function commitmentPayments(c){
  return (state.commitmentPayments||[]).filter(cp=> cp.commitmentId===c.id)
    .sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')));
}
/* كام من الالتزام ده بيتحسب على الشهر ده:
   مرة واحدة ← كله في شهره (ولو اتدفع أكتر من المبلغ، بيتحسب المدفوع) · شهري ← المبلغ كل شهر · قسط ← قسط الشهر */
function commitmentAmountForMonth(c, mk){
  if(!c.startMonth) return 0;
  if(c.type==='monthly') return c.startMonth<=mk ? (Number(c.amount)||0) : 0;
  if(c.type==='installment'){
    if(mk < c.startMonth) return 0;
    const prev = shiftMonth(mk, -1);
    return commitmentTotalDue(c, mk) - (prev >= c.startMonth ? commitmentTotalDue(c, prev) : 0);
  }
  return commitBillMonth(c)===mk ? Math.max(Number(c.amount)||0, commitmentPaidTotal(c)) : 0;
}
function commitmentStatusText(c){
  if(c.type!=='once') return COMMITMENT_TYPES[c.type];
  const pays = commitmentPayments(c);
  const paid = pays.reduce((s,cp)=> s+(Number(cp.amount)||0), 0);
  const bill = Number(c.amount)||0;
  const lastPay = pays.length ? pays[pays.length-1].date : '';
  return paid >= bill
    ? '✓ اتدفع ' + fmt(paid) + (lastPay ? ' يوم ' + lastPay : '')
    : '⏳ لسه علينا — ' + fmt(bill) + (paid ? ' (اتدفع منه ' + fmt(paid) + ')' : '');
}

function expenseItem(e){
  return {date: e.date, title: e.note || e.category || '', sub: '', amount: Number(e.amount)||0};
}
function commitmentItem(c, amount){
  return {date: c.startMonth, title: 'التزام: ' + (c.note || COMMITMENT_TYPES[c.type]), sub: commitmentStatusText(c), amount};
}

/* التواريخ اللي بتظهر تحت كل التزام: شهره، نوعه والشهر اللي بيتحسب عليه (للالتزام العام)، وكل دفعة بتاريخها */
function commitmentDatesHtml(c){
  const parts = [];
  if(c.startMonth) parts.push('📅 ' + (c.type==='once' ? 'الشهر: ' : 'بداية من: ') + monthLabel(c.startMonth));
  if(!c.aptId){
    let t = '🏷 ' + kindName(commitKind(c)) + (validKind(c.kind) ? '' : ' (متوقع)');
    if(c.type==='once' && c.startMonth) t += ' — محسوب على ' + monthLabel(commitBillMonth(c));
    parts.push(t);
  }
  const pays = commitmentPayments(c);
  const payTxt = pays.length
    ? '💳 ' + pays.map(p=> fmt(p.amount) + ' يوم ' + (p.date||'—')).join(' · ')
    : '💳 لسه مفيش دفع';
  return `<div class="date">${escapeHtml(parts.join(' · '))}</div><div class="date">${escapeHtml(payTxt)}</div>`;
}

/* ---- المياه ---- */
function waterForExactMonth(key, mk){
  const exp = state.expenses.filter(e=> e.date && e.date.slice(0,7)===mk && expenseKind(e)===key);
  if(exp.length) return {source:'expenses', items: exp.map(expenseItem)};
  const commits = shareCommitments().filter(c=> commitKind(c)===key)
    .map(c=> ({c, amt: commitmentAmountForMonth(c, mk)})).filter(x=> x.amt > 0);
  if(commits.length) return {source:'commitment', items: commits.map(x=> commitmentItem(x.c, x.amt))};
  return null;
}
function computeMonthWater(key, mk){
  const withTotal = (r, extra)=> Object.assign({}, r, extra||{}, {total: r.items.reduce((s,x)=> s+x.amount, 0)});
  const exact = waterForExactMonth(key, mk);
  if(exact) return withTotal(exact);
  // مفيش فاتورة للشهر ده لسه ← آخر شهر قبله فيه فاتورة، كتقدير
  const months = state.expenses.filter(e=> e.date && expenseKind(e)===key).map(e=> e.date.slice(0,7))
    .concat(shareCommitments().filter(c=> commitKind(c)===key).map(c=> commitBillMonth(c)))
    .filter(m=> m && m < mk).sort();
  const prev = months.pop();
  if(prev){
    const est = waterForExactMonth(key, prev);
    if(est) return withTotal(est, {source:'estimate', fromMonth: prev});
  }
  return {source:'none', items: [], total: 0};
}

/* ---- الكهرباء ---- */
function daysInMonthOf(mk){
  const [y,m] = mk.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function daysBetween(fromDate, toDate){
  const a = Date.UTC(...fromDate.split('-').map((v,i)=> i===1 ? Number(v)-1 : Number(v)));
  const b = Date.UTC(...toDate.split('-').map((v,i)=> i===1 ? Number(v)-1 : Number(v)));
  return Math.round((b - a) / 86400000);
}
function shortDate(d){ return Number(d.slice(8,10)) + '/' + Number(d.slice(5,7)); }

/* كهرباء الكارت في الشهر: كل شحنة بتتوزع بالتساوي على الأيام من تاريخها لحد الشحنة اللي بعدها،
   والشهر بياخد الأيام اللي وقعت جواه (فعلي). الأيام من آخر شحنة لآخر الشهر لسه مالهاش شحنة بعدها،
   فبتتحسب بمتوسط اليوم (كل الشحنات من أول شحنة لآخر شحنة ÷ الأيام بينهم) كتقدير لحد ما تتسجّل الشحنة الجاية.
   الأيام اللي قبل أول شحنة متسجّلة مش محسوبة. الشهر بيبقى نهائي أول ما تتسجّل شحنة بعد آخره. */
function computeMonthElectricity(key, mk){
  const dim = daysInMonthOf(mk);
  const mStart = mk + '-01';
  const mEnd = shiftMonth(mk, 1) + '-01';     // أول يوم في الشهر اللي بعده (مش داخل)
  const overlap = (from, to)=>{               // عدد أيام [from, to) اللي جوه الشهر
    const s = from > mStart ? from : mStart;
    const e = to < mEnd ? to : mEnd;
    return s < e ? daysBetween(s, e) : 0;
  };
  // الشحنات بتاريخها (شحنتين في نفس اليوم = شحنة واحدة)
  const byDate = {};
  state.expenses.filter(e=> e.date && expenseKind(e)===key).forEach(e=>{
    const d = e.date.slice(0,10);
    byDate[d] = (byDate[d]||0) + (Number(e.amount)||0);
  });
  const charges = Object.keys(byDate).sort().map(d=> ({date:d, amount:byDate[d]}));
  // فواتير/التزامات كهرباء قديمة على العمارة بتتضاف على الشهر بتاعها
  const extras = shareCommitments().filter(c=> commitKind(c)===key)
    .map(c=> ({c, amt: commitmentAmountForMonth(c, mk)})).filter(x=> x.amt > 0)
    .map(x=> commitmentItem(x.c, x.amt));
  const extraTotal = extras.reduce((s,x)=> s+x.amount, 0);
  let r;
  if(charges.length >= 2){
    const periods = [];
    for(let i=0; i<charges.length-1; i++){
      const from = charges[i].date, to = charges[i+1].date;
      const days = daysBetween(from, to);
      const inMonth = overlap(from, to);
      if(inMonth > 0) periods.push({from, to, amount:charges[i].amount, days, rate:charges[i].amount/days, inMonth, share:charges[i].amount*inMonth/days});
    }
    const first = charges[0].date, last = charges[charges.length-1].date;
    const closedTotal = charges.slice(0,-1).reduce((s,c)=> s+c.amount, 0);
    const avgRate = closedTotal / daysBetween(first, last);
    const openDays = overlap(last, '9999-12-31');
    const actual = periods.reduce((s,p)=> s+p.share, 0);
    const estimate = avgRate * openDays;
    r = {method:'periods', periods, first, last, lastAmount:charges[charges.length-1].amount, avgRate, openDays,
         actual, estimate, beforeFirst: overlap('0000-01-01', first), daysInMonth:dim, cardAmount: actual + estimate};
  } else {
    // مفيش شحنتين بتاريخين مختلفين لسه ← الشحنات اللي اتدفعت فعلًا في الشهر ده
    const inMonth = charges.filter(c=> c.date.slice(0,7)===mk);
    r = {method:'actual', charges: inMonth, daysInMonth:dim, cardAmount: inMonth.reduce((s,c)=> s+c.amount, 0)};
  }
  r.extras = extras;
  r.total = r.cardAmount + extraTotal;
  return r;
}

/* ---- أي نوع تاني: مصروفات الشهر + التزامات الشهر، أو مبلغ ثابت شهريًا لو متحدد ---- */
function computeKindMonth(kind, mk){
  if(kind.method==='water') return computeMonthWater(kind.key, mk);
  if(kind.method==='electricity') return computeMonthElectricity(kind.key, mk);
  const exps = state.expenses.filter(e=> e.date && expenseKind(e)===kind.key);
  const commits = shareCommitments().filter(c=> commitKind(c)===kind.key);
  const items = exps.filter(e=> e.date.slice(0,7)===mk).map(expenseItem)
    .concat(commits.map(c=> ({c, amt: commitmentAmountForMonth(c, mk)})).filter(x=> x.amt > 0).map(x=> commitmentItem(x.c, x.amt)));
  const recorded = items.reduce((s,x)=> s+x.amount, 0);
  const fixed = Number(kind.fixedMonthly)||0;
  if(fixed > 0){
    const firstMonth = exps.map(e=> e.date.slice(0,7)).concat(commits.map(c=> commitBillMonth(c))).filter(Boolean).sort()[0];
    const on = !!firstMonth && mk >= firstMonth;
    return {source: on ? 'fixed' : 'none', items, paid: recorded, total: on ? fixed : 0};
  }
  return {source:'recorded', items, total: recorded};
}

function computeResidentShares(mk){
  const active = state.apartments.filter(a=> isOccupiedInMonth(a, mk));
  const n = active.length;
  const m = active.filter(a=> a.elevator).length;
  const k = n - m;
  const lines = expenseKinds().map(kind=>{
    const r = computeKindMonth(kind, mk);
    const total = r.total || 0;
    let allPart = 0, elevPart = 0, nonPart = 0;
    if(kind.split==='elevator') elevPart = total;
    else if(kind.split==='nonElevator') nonPart = total;
    else if(kind.split==='mixed'){
      allPart = total * Math.max(0, Math.min(100, Number(kind.allPct)||0)) / 100;
      elevPart = total - allPart;
    }
    else allPart = total;
    // لو مفيش حد في المجموعة دي الشهر ده، نصيبها بيتوزع على الكل عشان المصروف يتغطى
    let spilled = 0;
    if(elevPart && !m){ spilled += elevPart; allPart += elevPart; elevPart = 0; }
    if(nonPart && !k){ spilled += nonPart; allPart += nonPart; nonPart = 0; }
    const perAll = n ? allPart / n : 0;
    const perElev = m ? elevPart / m : 0;
    const perNon = k ? nonPart / k : 0;
    return {kind, r, total, allPart, elevPart, nonPart, spilled, perAll, perElev, perNon,
            sub: perAll + perElev, non: perAll + perNon};
  });
  const subscriber = lines.reduce((s,l)=> s+l.sub, 0);
  const nonSubscriber = lines.reduce((s,l)=> s+l.non, 0);
  return {mk, n, m, k, lines, subscriber, nonSubscriber};
}

function fmt1(n){
  return (Math.round(n*10)/10).toLocaleString('en-US', {maximumFractionDigits:1});
}
function fmt2(n){
  return (Math.round(n*100)/100).toLocaleString('en-US', {maximumFractionDigits:2});
}

function lineTag(l){
  if(l.kind.method==='water' && l.r.source==='estimate') return ' (تقدير)';
  if(l.kind.method==='electricity' && l.r.estimate > 0) return ' (فيها تقدير)';
  if(l.r.items && l.r.items.some(x=> String(x.sub).startsWith('⏳'))) return ' (لسه علينا)';
  return '';
}

function showSharesPopup(){

  const row = (k, v, cls)=> `<div class="pp-row ${cls||''}"><span class="k">${k}</span><span class="num">${v}</span></div>`;

  let html = `<div class="popup-head"><h3>🧮 نصيب الساكن — ${monthLabel(s.mk)}</h3><button class="popup-close" aria-label="إغلاق">✕</button></div>

      <div class="pp-sec-title">الخلاصة (نصيب الساكن الواحد)</div>
      <div class="pp-grid">
        <div class="h">البند</div><div class="h n">🛗 مشترك</div><div class="h n">🚶 مش مشترك</div>
        ${shown.filter(l=> l.total > 0).map(l=> `<div>${escapeHtml(kindName(l.kind.key))}</div><div class="n">${l.sub ? fmt1(l.sub) : '—'}</div><div class="n">${l.non ? fmt1(l.non) : '—'}</div>`).join('')}
        <div class="tot">الإجمالي</div><div class="n tot">${fmt(s.subscriber)}</div><div class="n tot">${fmt(s.nonSubscriber)}</div>
      </div>
      <div class="pp-note">طريقة تقسيم كل نوع بتتغيّر من تبويب ⚙️ الإعدادات.</div>
    </div>`;

  shown.forEach(l=>{
    const kind = l.kind, r = l.r;
    html += `<div class="pp-sec"><div class="pp-sec-title">${escapeHtml(kindName(kind.key))} <small style="font-weight:400;color:var(--ink-soft)">— ${escapeHtml(splitText(kind))}</small></div>`;
    if(kind.method==='water'){
      html += waterSourceNote(r, s.mk) + itemRows(r.items);
    } else if(kind.method==='electricity'){
      if(r.method==='periods'){
        html += `<div class="pp-note">كل شحنة بتتوزع على الأيام من تاريخها لحد الشحنة اللي بعدها، والشهر بياخد الأيام اللي وقعت جواه.</div>`;
        html += r.periods.map(p=> row(
          shortDate(p.from) + ' ← ' + shortDate(p.to) + ': ' + fmt(p.amount) + ' ÷ ' + p.days + ' يوم = ' + fmt1(p.rate) + ' في اليوم'
            + (p.inMonth < p.days ? ` <small>(منهم ${p.inMonth} يوم في الشهر)</small>` : ''),
          fmt(p.share))).join('');
        if(r.openDays > 0) html += row(
          'من ' + shortDate(r.last) + ' (آخر شحنة ' + fmt(r.lastAmount) + ' — لسه شغالة): تقدير ' + fmt2(r.avgRate) + ' × ' + r.openDays + ' يوم',
          fmt(r.estimate) + ' (تقدير)');
        if(r.beforeFirst > 0) html += `<div class="pp-note">${r.beforeFirst} يوم في الشهر قبل أول شحنة متسجّلة (${shortDate(r.first)}) مش محسوبين.</div>`;
        html += row('كهرباء الكارت في ' + monthLabel(s.mk),
          (r.estimate > 0 && r.actual > 0 ? fmt(r.actual) + ' فعلي + ' + fmt(r.estimate) + ' تقدير = ' : '') + fmt(r.cardAmount), 'total');
        if(r.estimate > 0) html += `<div class="pp-note">التقدير = متوسط اليوم (كل الشحنات من أول شحنة لآخر شحنة ÷ الأيام بينهم) — وبيتظبط لوحده أول ما تسجّل الشحنة الجاية.</div>`;
      } else {
        html += `<div class="pp-note">لسه مفيش شحنتين بتاريخين مختلفين عشان نحسب متوسط اليوم، فبنستخدم الشحنات اللي اتدفعت فعلًا في الشهر ده.</div>`;
        html += r.charges.map(c=> row(escapeHtml(c.date) + ' — ' + escapeHtml(c.note), fmt(c.amount))).join('');
      }
      if(r.extras.length) html += `<div class="pp-note">التزامات كهرباء على الشهر ده:</div>` + itemRows(r.extras);

      html += `<div class="pp-note">مبلغ ثابت ${fmt(kind.fixedMonthly)} جنيه كل شهر. اتدفع منه لحد دلوقتي ${fmt(r.paid)} — الدفعات للمتابعة بس ومش بتغيّر النصيب.${r.paid > Number(kind.fixedMonthly) ? ' ⚠️ المدفوع أكتر من الثابت: لو فيه مصروف زيادة (إصلاح مثلًا) مش من الاشتراك، غيّر نوعه لنوع من غير مبلغ ثابت عشان يتحسب.' : ''}</div>` + itemRows(r.items);
    } else if(r.source==='none' && Number(kind.fixedMonthly) > 0){
      html += `<div class="pp-note">مبلغ ثابت شهريًا، بس بيبدأ من أول شهر اتسجّل فيه النوع ده (بعد الشهر ده).</div>`;
    } else {
      html += itemRows(r.items);
    }
    if(l.total <= 0){
      if(!(r.source==='none' && Number(kind.fixedMonthly) > 0) && kind.method!=='water') html += `<div class="pp-note">مفيش حاجة متسجّلة في الشهر ده.</div>`;
    } else {
      html += row('الإجمالي', fmt(l.total), 'total');
      if(l.allPart) html += row('على كل السكان', fmt(l.allPart) + ' ÷ ' + s.n + ' = ' + fmt1(l.perAll));
      if(l.elevPart) html += row('على مشتركين الأسانسير', fmt(l.elevPart) + ' ÷ ' + s.m + ' = ' + fmt1(l.perElev));
      if(l.nonPart) html += row('على غير المشتركين', fmt(l.nonPart) + ' ÷ ' + s.k + ' = ' + fmt1(l.perNon));
      if(l.spilled) html += `<div class="pp-note">مفيش حد في المجموعة المحددة الشهر ده، فـ ${fmt(l.spilled)} اتوزعت على كل السكان.</div>`;
    }
    html += `</div>`;
  });

  closeSharesPopup();
  const ov = document.createElement('div');
  ov.id = 'sharesPopup';
  ov.className = 'popup-overlay';
  ov.innerHTML = `<div class="popup-box" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('click', ev=>{
    if(ev.target === ov || ev.target.closest('.popup-close')) closeSharesPopup();
  });
  document.body.appendChild(ov);
}

function bindSettingsEvents(){
  const kinds = ()=> state.settings.expenseKinds;
  const find = key=> kinds().find(k=> k.key===key);
  const save = ()=>{ persist(); renderAll(); };
  document.querySelectorAll('[data-k-icon]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked) return;
    const k = find(inp.dataset.kIcon); if(!k) return;
    k.icon = inp.value.trim(); save();
  }));
  document.querySelectorAll('[data-k-label]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked) return;
    const k = find(inp.dataset.kLabel); if(!k) return;
    const label = inp.value.trim();
    if(!label){ renderAll(); return; }
    k.label = label;
    state.expenses.forEach(e=>{ if(e.kind===k.key) e.category = label; }); // الفئة المعروضة في المصروفات تفضل زي اسم النوع
    save();
  }));
  document.querySelectorAll('[data-k-split]').forEach(sel=> sel.addEventListener('change', ()=>{
    if(!unlocked) return;
    const k = find(sel.dataset.kSplit); if(!k) return;
    k.split = sel.value;
    if(k.split==='mixed' && typeof k.allPct !== 'number') k.allPct = 70;
    save();
  }));
  document.querySelectorAll('[data-k-pct]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked) return;
    const k = find(inp.dataset.kPct); if(!k) return;
    k.allPct = Math.max(0, Math.min(100, Number(inp.value)||0)); save();
  }));
  document.querySelectorAll('[data-k-fixed]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked) return;
    const k = find(inp.dataset.kFixed); if(!k) return;
    const v = Math.max(0, Number(inp.value)||0);
    if(v > 0) k.fixedMonthly = v; else delete k.fixedMonthly;
    save();
  }));
  document.querySelectorAll('[data-k-del]').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!unlocked) return;
    const key = btn.dataset.kDel;
    const used = kindUsageCount(key);
    if(used > 0){ alert('النوع ده مستخدم في ' + used + ' مصروف/التزام — غيّر نوعهم الأول وبعدين امسحه.'); return; }
    if(!confirm('تمسح النوع "' + kindInfo(key).label + '"؟')) return;
    state.settings.expenseKinds = kinds().filter(k=> k.key!==key);
    save();
  }));
  const addForm = document.getElementById('addKindForm');
  if(addForm) addForm.addEventListener('submit', e=>{
    e.preventDefault();
    if(!unlocked) return;
    const f = e.target;
    const label = f.label.value.trim();
    if(!label){ alert('اكتب اسم النوع'); return; }
    if(kinds().some(k=> normalizeSearch(k.label)===normalizeSearch(label))){ alert('فيه نوع بنفس الاسم ده'); return; }
    const k = {key:'k' + Date.now(), label, icon: f.icon.value.trim() || '🏷', split: f.split.value};
    if(k.split==='mixed') k.allPct = 70;
    const fixed = Number(f.fixedMonthly.value)||0;
    if(fixed > 0) k.fixedMonthly = fixed;
    kinds().push(k);
    save();
  });
}

function quickTogglePaid(aptId){
  if(!unlocked) return;
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt) return;
  if(!state.payments[currentMonth]) state.payments[currentMonth]={};
  if(!state.paymentDates[currentMonth]) state.paymentDates[currentMonth]={};
  const current = state.payments[currentMonth][aptId]||0;
  const goingToZero = current>=apt.subscription;
  state.payments[currentMonth][aptId] = goingToZero ? 0 : apt.subscription;
  if(goingToZero){
    delete state.paymentDates[currentMonth][aptId];
  } else {
    state.paymentDates[currentMonth][aptId] = collectDate;
  }
  persist();
  renderAll();
}

function renderAll(){
  renderHero();
  // لو التحديث التلقائي (كل 20 ثانية) رسم الشاشة وانت بتكتب في خانة البحث، نرجّع المؤشر مكانه
  const focused = document.activeElement;
  const keepSearchFocus = focused && focused.id === 'fundSearch';
  const caret = keepSearchFocus ? focused.selectionStart : null;
  const c = document.getElementById('content');
  c.classList.toggle('locked', !unlocked);
  // أزرار النسخة الاحتياطية/الاسترجاع ظاهرة بس في وضع التعديل (بعد الرمز السري)
  const backupRow = document.getElementById('backupRow');
  if(backupRow) backupRow.style.display = unlocked ? 'flex' : 'none';
  let banner = unlocked ? '' : `<div class="view-only-banner">👁 وضع العرض فقط</div>`;
  if(currentTab==='overview') c.innerHTML = banner + tplOverview();
  if(currentTab==='collect') c.innerHTML = banner + tplCollect();
  if(currentTab==='balance') c.innerHTML = banner + tplResidentsBalance();
  if(currentTab==='arrears') c.innerHTML = banner + tplArrearsReport();
  if(currentTab==='commitments') c.innerHTML = banner + tplBuildingCommitments();
  if(currentTab==='expenses') c.innerHTML = banner + tplExpenses();
  if(currentTab==='fund') c.innerHTML = banner + tplFund();
  if(currentTab==='plans') c.innerHTML = banner + tplPlans();
  if(currentTab==='apts') c.innerHTML = banner + tplApts();
  if(currentTab==='settings') c.innerHTML = banner + tplSettings();
  renderOverviewData();
  bindTabEvents();
  if(keepSearchFocus){
    const s = document.getElementById('fundSearch');
    if(s){ s.focus(); try{ s.setSelectionRange(caret, caret); }catch(e){} }
  }
}

function collectTabCommitmentIds(){
  let ids = [];
  (state.apartments||[]).filter(a=>a.occupied).forEach(apt=>{
    aptCommitments(apt.id).forEach(c=>{
      const rem = commitmentRemaining(c, currentMonth);
      if(c.type!=='monthly' && rem<=0) return;
      ids.push(c.id);
    });
  });
  return ids;
}

function exportReportCSV(){
  const arrears = computeArrears();
  const totalOwed = arrears.reduce((s,a)=>s+a.total,0);
  const balance = computeFundBalance();
  const rows = [];
  rows.push(['التقارير المالية برج الاندلس', monthLabel(currentMonth)]);
  rows.push(['رصيد الصندوق', balance]);
  rows.push(['إجمالي المتأخرات', totalOwed]);
  rows.push([]);
  rows.push(['رقم الشقة','اسم الساكن','البنود المتأخرة','إجمالي المستحق']);
  arrears.forEach(a=>{
    rows.push([a.apt.id, a.apt.name||'—', a.items.map(m=>m.label+' ('+m.owed+')').join(' / '), a.total]);
  });
  const csv = '\uFEFF' + rows.map(r=> r.map(cell=>{
    const s = String(cell==null?'':cell);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'تقرير-المتاخرات-'+currentMonth+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* دبوس المرفق: بيفتح المرفق الموجود (على درايف أو محفوظ جوه الشيت من زمان)،
   أو لو مفيش مرفق بيعرض دبوس فاضي (في وضع التعديل بس) يقدر يضيف له مرفق بعدين.
   بيتستخدم مع أي حاجة عندها id + attachment: مصروف، حركة صندوق يدوية، سداد التزام، صرف أسانسير. */
function attachCellHtml(record){
  if(!record) return '';
  const att = record.attachment;
  if(att){
    return att.url
      ? `<a class="tx-attach" href="${escapeHtml(att.url)}" target="_blank" rel="noopener" title="فتح المرفق: ${escapeHtml(att.name)}">📎</a>`
      : `<a class="tx-attach" href="${att.dataUrl}" download="${escapeHtml(att.name)}" title="فتح المرفق: ${escapeHtml(att.name)}">📎</a>`;
  }
  return unlocked ? `<label class="tx-attach" title="إضافة مرفق" style="cursor:pointer; opacity:.55;">📎<input type="file" data-add-attach="${record.id}" accept="image/*,.pdf" style="display:none"></label>` : '';
}

/* بيدوّر على السجل (مصروف / حركة صندوق يدوية / سداد التزام / صرف أسانسير) بمعرّفه
   عبر المجموعات الأربعة، عشان دبوس "إضافة مرفق" يشتغل من أي تبويب. */
function findAttachableRecordById(id){
  return state.expenses.find(x=>x.id===id)
    || (state.fundLedger||[]).find(x=>x.id===id)
    || (state.commitmentPayments||[]).find(x=>x.id===id)
    || (state.elevatorSpends||[]).find(x=>x.id===id);
}

/* بيتأكد من حجم الملف، يضغطه لو صورة، ويرفعه على درايف لو فيه رابط رفع مضبوط.
   بيرجّع: attachment object لو نجح، null لو اتقرّر نكمّل من غير مرفق،
   undefined لو المستخدم عايز يلغي ويجرّب تاني (فشل الرفع ورفض "كمّل من غيره"). */
async function resolveAttachmentFile(file){
  const isImage = file.type && file.type.startsWith('image/');
  if(!isImage && file.size > 3*1024*1024){
    alert('حجم الملف كبير أوي (أكبر من 3 ميجا) — جرّب ملف أصغر.');
    return null;
  }
  let attachment;
  try{
    attachment = await fileToAttachment(file);
  }catch(err){
    console.error('attachment read failed', err);
    alert('مش قادر يقرا الملف ده.');
    return null;
  }
  const approxBytes = Math.round((attachment.dataUrl.length - attachment.dataUrl.indexOf(',') - 1) * 0.75);
  if(approxBytes > 3*1024*1024){
    alert('المرفق لسه كبير بعد الضغط (أكبر من 3 ميجا) — جرّب صورة أوضح أقل أو ملف مختلف.');
    return null;
  }
  if(ATTACH_UPLOAD_URL){
    try{
      return await uploadAttachmentToDrive(attachment);
    }catch(upErr){
      console.error('attachment upload failed', upErr);
      return confirm('المرفق ما اترفعش (' + upErr.message + ').\nتحب تكمّل من غير مرفق؟ (إلغاء = ارجع وجرّب تاني)') ? null : undefined;
    }
  }
  return attachment;
}

let fundSearchQuery = ''; // بيفضل محفوظ لما الشاشة تترسم تاني (تغيير الشهر، تحديث من الشيت...)

/* بيوحّد الكتابة عشان "احمد" يلاقي "أحمد" و"مياه" يلاقي "ميّاه" و"٥٠٠" يلاقي "500" */
function normalizeSearch(s){
  return String(s||'').toLowerCase()
    .replace(/[ً-ْـ]/g, '')          // تشكيل + تطويل
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/,/g, '');
}

function applyFundSearch(){
  const list = document.getElementById('fundLedgerList');
  if(!list) return;
  const terms = normalizeSearch(fundSearchQuery).split(/\s+/).filter(Boolean);
  let shown = 0, inSum = 0, outSum = 0;
  list.querySelectorAll('.tx-row[data-q]').forEach(row=>{
    const hit = terms.every(t => row.dataset.q.includes(t));
    row.style.display = hit ? '' : 'none';
    if(hit){
      shown++;
      const amt = Number(row.dataset.amt) || 0;
      if(amt < 0) outSum += -amt; else inSum += amt;
    }
  });
  const info = document.getElementById('fundSearchInfo');
  if(info){
    info.innerHTML = terms.length
      ? (shown
          ? `${shown} حركة — وارد <span class="num" style="color:var(--good)">+${fmt(inSum)}</span> · منصرف <span class="num" style="color:var(--bad)">-${fmt(outSum)}</span>`
          : 'مفيش حركات بالكلام ده')
      : '';
  }
}
