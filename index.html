<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير المالية برج الاندلس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#312d5e;
    --night-2:#1c1a38;
    --wall:#4b4780;
    --wall-2:#6a64ab;
    --paper:#f4f8fe;
    --paper-2:#e9f1fc;
    --ink:#221f42;
    --ink-soft:#647089;
    --lit:#eaa93f;
    --lit-2:#dc8f26;
    --lit-glow:#f6c977;
    --dim:#57538c;
    --dim-2:#4a4678;
    --vacant:#57538c;
    --good:#0fa671;
    --bad:#e24a4a;
    --line:#dde6f5;
    --radius:16px;
    --sidebar-w:64px;
  }
  ::-webkit-scrollbar{width:0;height:0;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace; font-weight:600;}
  h1,h2,h3{font-family:'El Messiri', sans-serif; margin:0;}

  /* ---------- HERO / FACADE ---------- */
  .hero{
    position:relative; overflow:hidden;
    background:linear-gradient(175deg, var(--night) 0%, var(--night-2) 100%);
    padding:16px 14px 20px;
    padding-inline-end:calc(var(--sidebar-w) + 16px);
    border-radius:0 0 26px 26px;
    box-shadow:0 14px 32px rgba(10,8,30,.35);
  }
  .hero::before{
    content:'';
    position:absolute; top:-120px; left:50%; transform:translateX(-50%);
    width:320px; height:320px; border-radius:50%;
    background:radial-gradient(circle, rgba(234,169,63,.20) 0%, rgba(234,169,63,0) 70%);
    pointer-events:none;
  }
  .hero > *{position:relative;}
  .hero-top{
    display:flex; align-items:center; justify-content:space-between;
    color:#fff; margin-bottom:12px;
  }
  .hero-title{color:#fff; font-size:23px; letter-spacing:.3px; font-weight:700;}
  .month-nav{display:flex; align-items:center; gap:10px; color:#fff;}
  .month-nav button{
    background:linear-gradient(155deg, #7a74c7 0%, #4b4780 55%, #38356a 100%);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.5), inset 0 -2px 3px rgba(0,0,0,.3), 0 3px 6px rgba(10,8,30,.4);
    color:#fff; width:32px; height:32px; border-radius:50%;
    font-size:16px; cursor:pointer;
  }
  .month-nav button:active{transform:scale(.92);}
  .month-label{font-family:'IBM Plex Mono'; font-size:15px; min-width:110px; text-align:center;}

  .hero-title{cursor:default; user-select:none;}

  #lockBtn{
    background:transparent; border:none; color:transparent;
    width:6px; height:32px; font-size:0; cursor:default; padding:0;
  }
  #lockBtn.revealed{
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
    color:#fff; width:32px; border-radius:50%; font-size:14px; cursor:pointer;
  }
  #lockBtn.change-mode{
    background:rgba(255,255,255,.35); border:1px solid #fff;
  }
  #tapHint{
    font-size:10.5px; color:#fff; margin-inline-end:2px; white-space:nowrap;
  }
  #unlockPanel{
    display:none; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
    border-radius:10px; padding:8px 10px; margin-bottom:12px; gap:8px;
  }
  #unlockPanel.show{display:flex; align-items:center;}
  #unlockPanel input{
    flex:1; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
    color:#fff; border-radius:8px; padding:7px 10px; font-family:'IBM Plex Mono'; font-size:13px;
  }
  #unlockPanel button{
    background:#fff; color:var(--night); border:none; border-radius:8px;
    padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .view-only-banner{
    background:var(--paper-2); color:var(--ink-soft); font-size:12px; text-align:center;
    padding:8px 10px; border-radius:10px; margin-bottom:12px; border:1px solid var(--line);
  }
  #content.locked input, #content.locked select,
  #content.locked button.pill, #content.locked button.del,
  #content.locked form.inline button, #content.locked .preset,
  #content.locked #settleAllElevatorShares,
  #content.locked input[type=checkbox]{
    pointer-events:none; opacity:.45;
  }
  /* الـ label اللي لافة حوالين أي checkbox (زي "مأهولة"، "أسانسير"، "تحديد الكل") لازم تتقفل هي كمان،
     لأن الضغط على نص الـ label بيفعّل الـ checkbox جواه حتى لو الـ checkbox نفسه pointer-events:none */
  #content.locked label{
    pointer-events:none;
  }
  .facade.locked .win{ pointer-events:none; }

  .balance-hero{
    position:relative;
    background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.22);
    border-radius:18px; padding:16px 16px 14px; margin-bottom:12px; text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 8px 20px rgba(10,8,30,.25);
  }
  .balance-hero .lbl{color:#c9c4ee; font-size:13px;}
  .balance-hero .val{color:#fff; font-size:40px; margin-top:4px; font-weight:700;}
  .balance-hero.balance-neg .val{color:#ffb199;}

  /* ---------- 3D ICON BADGES ---------- */
  .icon3d{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:10px; flex-shrink:0;
    font-size:16px; line-height:1;
    background:linear-gradient(155deg, #7a74c7 0%, #4b4780 55%, #38356a 100%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.55),
      inset 0 -3px 4px rgba(0,0,0,.30),
      0 3px 6px rgba(10,8,30,.45);
    border:1px solid rgba(255,255,255,.18);
  }
  .icon3d.gold{
    background:linear-gradient(155deg, #f8d488 0%, #eaa93f 55%, #c9821f 100%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.7),
      inset 0 -3px 4px rgba(0,0,0,.25),
      0 3px 8px rgba(200,130,20,.4);
  }
  .icon3d.sm{width:24px; height:24px; border-radius:8px; font-size:13px;}
  .icon3d.lg{width:42px; height:42px; border-radius:13px; font-size:21px;}
  .stat-head{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .stat-head .lbl{margin:0;}

  .overview-block{
    position:relative; overflow:hidden;
    background:linear-gradient(175deg, var(--night) 0%, var(--night-2) 100%);
    border-radius:22px; padding:16px 14px 14px; margin-bottom:6px;
    box-shadow:0 14px 32px rgba(10,8,30,.3);
  }
  .overview-block::before{
    content:''; position:absolute; top:-110px; left:50%; transform:translateX(-50%);
    width:300px; height:300px; border-radius:50%;
    background:radial-gradient(circle, rgba(234,169,63,.18) 0%, rgba(234,169,63,0) 70%);
    pointer-events:none;
  }
  .overview-block > *{position:relative;}

  .facade{
    display:flex; flex-direction:column-reverse; gap:4px;
    background:rgba(255,255,255,.12); border-radius:10px; padding:9px 9px 7px;
    border:1px solid rgba(255,255,255,.25);
  }
  .floor-row{display:flex; align-items:center; gap:6px;}
  .floor-label{
    width:40px; flex-shrink:0; color:#cfe0fb; font-size:11px; font-weight:600; text-align:left;
    font-family:'IBM Plex Mono';
  }
  .windows{display:flex; gap:5px; flex:1;}
  .win{
    position:relative;
    flex:1; min-width:0; height:58px; border-radius:8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1px; padding:0 3px;
    transition:transform .12s ease;
    border:1px solid rgba(0,0,0,.12);
  }
  .win .apt-num{
    font-size:13px; font-family:'IBM Plex Mono'; font-weight:700; line-height:1.15;
  }
  .win .apt-name{
    font-size:10px; font-family:'IBM Plex Sans Arabic'; font-weight:600; line-height:1.15;
    max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.92;
  }
  .win .apt-sub{
    font-size:9px; font-family:'IBM Plex Mono'; line-height:1.1; opacity:.85;
  }
  .win .apt-status{
    font-size:9px; font-family:'IBM Plex Sans Arabic'; font-weight:700; line-height:1.2;
    margin-top:1px;
  }
  .win.paid .apt-status{color:#eaf3ff;}
  .win.partial .apt-status,
  .win.unpaid .apt-status{color:#ffd7d2;}
  .win.vacant .apt-status{color:#5b6b93;}
  .win .occ-dot{
    position:absolute; top:4px; left:4px;
    width:9px; height:9px; border-radius:50%;
    border:1px solid rgba(0,0,0,.25);
  }
  .win .occ-dot.occ-yes{ background:#3ddc73; box-shadow:0 0 6px 2px rgba(61,220,115,.85); }
  .win .occ-dot.occ-no{ background:#ff5b4d; box-shadow:0 0 6px 2px rgba(255,91,77,.75); }
  .win:active{transform:scale(.94);}
  .win.paid{
    background:linear-gradient(160deg, #f6c977 0%, #eaa93f 55%, #d69329 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -6px 10px rgba(150,90,10,.25), 0 4px 10px rgba(200,130,20,.35);
    color:#3a2807; border-color:rgba(255,255,255,.35);
  }
  .win.paid .apt-status, .win.paid .apt-sub, .win.paid .apt-name{color:#4a3410;}
  .win.partial{
    background:linear-gradient(160deg, #6a64ab 0%, #4a4678 100%); color:#fff;
    border-inline-start:3px solid var(--lit);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 3px 8px rgba(10,8,30,.3);
  }
  .win.unpaid{
    background:linear-gradient(160deg, #6a64ab 0%, #4a4678 100%); color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 3px 8px rgba(10,8,30,.3);
  }
  .win.vacant{
    background:linear-gradient(160deg, #625d9c 0%, #47437a 100%); color:#e4e1f7;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 3px 8px rgba(10,8,30,.3);
  }
  .win.vacant .apt-name{display:none;}

  .stats{
    display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px;
  }
  .stat{
    background:linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:10px 12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  }
  .stat .lbl{color:#c9c4ee; font-size:12px;}
  .stat .val{color:#fff; font-size:25px; margin-top:2px;}
  .stat.balance-neg .val{color:#ffb199;}

  .collection-progress{
    background:linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:10px 12px 12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
    margin-bottom:12px;
  }
  .cp-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .cp-head .lbl{color:#c9c4ee; font-size:12px;}
  .cp-head .pct{color:#fff; font-size:18px; font-weight:700;}
  .cp-track{
    position:relative; width:100%; height:14px; border-radius:8px;
    background:rgba(255,255,255,.10); overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(10,8,30,.35);
  }
  .cp-fill{
    height:100%; border-radius:8px;
    background:linear-gradient(90deg, var(--lit,#ffcf5c), #ffe28a);
    box-shadow:0 0 8px rgba(255,207,92,.55);
    transition:width .4s ease;
  }
  .cp-fill.cp-low{background:linear-gradient(90deg, #ff8a7a, #ffb199);}
  .cp-sub{display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:#c7d7f5;}

  /* ---------- TABS: side dock ---------- */
  .tabbar{
    display:flex; flex-direction:column; align-items:center;
    gap:8px; padding:14px 6px 20px;
    background:linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    position:fixed; top:0; bottom:0; inset-inline-end:0; width:var(--sidebar-w);
    border-inline-start:1px solid rgba(255,255,255,.08);
    box-shadow:-6px 0 18px rgba(10,8,30,.25);
    z-index:30; overflow-y:auto;
  }
  .tabbar button{
    all:unset; box-sizing:border-box; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    width:100%; padding:6px 2px 8px; border-radius:12px;
    font-family:'IBM Plex Sans Arabic'; text-align:center;
  }
  .tabbar button .icon3d{width:36px; height:36px; border-radius:11px; font-size:18px;}
  .tabbar button .tab-label{
    font-size:8.5px; color:#b7b1e6; line-height:1.15; white-space:normal;
  }
  .tabbar button.active{background:rgba(255,255,255,.08);}
  .tabbar button.active .tab-label{color:#fff; font-weight:700;}

  .content{padding:14px 14px 60px; padding-inline-end:calc(var(--sidebar-w) + 14px); max-width:640px; margin:0 auto;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:10px;
    box-shadow:0 3px 14px rgba(30,80,190,.06);
  }
  .section-title{font-size:13px; color:var(--ink-soft); margin:16px 0 8px; font-weight:600;}
  .bulk-checkbox{
    width:16px; height:16px; flex-shrink:0; margin:2px 0 0; accent-color:var(--lit); cursor:pointer;
  }

  /* apartment row */
  .apt-row{
    display:flex; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line);
    gap:8px;
  }
  .apt-row:last-child{border-bottom:none;}
  .apt-info{display:flex; flex-direction:column; flex:1; min-width:0;}
  .apt-info .name{font-size:14.5px; font-weight:600;}
  .apt-info .meta{font-size:11.5px; color:var(--ink-soft);}
  .apt-actions{display:flex; align-items:center; gap:6px;}
  .amount-input{
    width:64px; text-align:center; border:1px solid var(--line); border-radius:8px;
    padding:6px 4px; font-family:'IBM Plex Mono'; font-size:13px;
  }
  .pill{
    font-size:11px; padding:5px 10px; border-radius:20px; border:none; cursor:pointer;
    font-family:'IBM Plex Sans Arabic'; font-weight:600;
  }
  .pill.pay{background:var(--good); color:#fff;}
  .pill.pay.done{background:#e9f5ef; color:var(--good); border:1px solid var(--good);}
  .vacant-tag{font-size:11px; color:var(--ink-soft); background:var(--paper-2); padding:4px 10px; border-radius:20px;}
  .export-btn{
    font-size:12px; padding:7px 14px; border-radius:20px; border:none; cursor:pointer;
    font-family:'IBM Plex Sans Arabic'; font-weight:600; background:var(--ink); color:#fff;
  }

  .floor-group-title{
    font-size:11px; color:#8b98b5; margin:14px 0 2px; letter-spacing:.5px;
  }

  /* expenses / fund list */
  .tx-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .tx-row:last-child{border-bottom:none;}
  .tx-main{display:flex; flex-direction:column;}
  .tx-main .note{font-weight:600;}
  .tx-main .date{font-size:11px; color:var(--ink-soft);}
  .tx-amt.out{color:var(--bad);}
  .tx-amt.in{color:var(--good);}
  .tx-attach{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:6px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    font-size:12px; text-decoration:none; cursor:pointer;
  }
  .exp-file-name{font-size:11px; color:var(--ink-soft); margin-inline-start:4px;}

  form.inline{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  form.inline input, form.inline select{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:'IBM Plex Sans Arabic'; font-size:13px; flex:1; min-width:100px;
  }
  form.inline button{
    background:var(--ink); color:#fff; border:none; border-radius:8px;
    padding:8px 16px; font-size:13px; cursor:pointer; font-weight:600;
  }
  .preset-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .preset{
    font-size:11.5px; background:var(--paper-2); border:1px solid var(--line);
    border-radius:20px; padding:5px 10px; cursor:pointer; color:var(--ink-soft);
  }

  .plan-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .plan-row:last-child{border-bottom:none;}
  .plan-row .item{flex:1; font-size:13.5px;}
  .plan-row.done .item{text-decoration:line-through; color:#a2acc4;}
  .plan-row input[type=checkbox]{width:18px; height:18px; accent-color:var(--good);}

  .empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 0;}
  .note-strip{
    background:#eaf2ff; border:1px solid #bcd6fb; border-radius:10px; padding:9px 12px;
    font-size:12px; color:#1e4fa8; margin-bottom:12px;
  }
  .del{background:none; border:none; color:#a7b2c9; cursor:pointer; font-size:15px; padding:2px 6px;}
  .arrear-amount-input{
    width:78px; text-align:center; border:1px solid var(--line); border-radius:8px;
    padding:5px 4px; font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--bad); font-weight:600;
    background:#fff5f5;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-top">
    <div class="hero-title">🏢 التقارير المالية برج الاندلس</div>
    <div class="month-nav">
      <button id="lockBtn" title="">🔒</button>
      <button id="prevMonth">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonth">›</button>
    </div>
  </div>
  <div id="unlockPanel">
    <input type="password" id="pinInput" inputmode="numeric">
    <button id="pinSubmit">فتح</button>
  </div>
  <div id="syncStatus" style="font-size:10.5px; text-align:center; color:#bfe0ff; margin:-4px 0 10px;">🔄 بيتزامن مع جوجل شيت...</div>
</div>

<div class="tabbar" id="tabbar">
  <button data-tab="overview" class="active"><span class="icon3d gold">📊</span><span class="tab-label">نظرة عامة</span></button>
  <button data-tab="collect"><span class="icon3d">💰</span><span class="tab-label">التحصيل</span></button>
  <button data-tab="balance"><span class="icon3d">👥</span><span class="tab-label">رصيد السكان</span></button>
  <button data-tab="arrears"><span class="icon3d">⏳</span><span class="tab-label">متأخرات السكان</span></button>
  <button data-tab="commitments"><span class="icon3d">📋</span><span class="tab-label">التزامات العمارة</span></button>
  <button data-tab="expenses"><span class="icon3d">🧾</span><span class="tab-label">المصروفات</span></button>
  <button data-tab="fund"><span class="icon3d">🏦</span><span class="tab-label">الصندوق</span></button>
  <button data-tab="plans"><span class="icon3d">🗺️</span><span class="tab-label">خطط مستقبلية</span></button>
  <button data-tab="apts"><span class="icon3d">🏠</span><span class="tab-label">الشقق</span></button>
</div>

<div class="content" id="content"></div>

<script>
const STORE_KEY = 'building-finances-v1';
const MONTH_NAMES = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const FLOOR_ORDER = ['الأرضي','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر'];
const START_MONTH = '2026-08';

function seedState(){
  const apts = [
    ['801','الأرضي','أبو سيد',250,false],
    ['802','الأول','زكريا شكري',450,true],
    ['803','الأول','مستأجر جديد',450,true],
    ['804','الأول','علي العرباوي',450,true],
    ['805','الثاني','',0,true],
    ['806','الثاني','ام اميرة',450,true],
    ['807','الثاني','',0,true],
    ['808','الثالث','محمد محي',450,true],
    ['809','الثالث','',0,true],
    ['810','الثالث','كريم',450,true],
    ['811','الرابع','اشرف يوسف',450,true],
    ['812','الرابع','محمد مصطفي',500,true],
    ['813','الرابع','ممدوح الكاشف',500,true],
    ['814','الخامس','أسماء',500,true],
    ['815','الخامس','امين',500,true],
    ['816','الخامس','عبادة',500,true],
    ['817','السادس','إبراهيم عواد',500,true],

function monthKey(y,m){ return y+'-'+String(m).padStart(2,'0'); }
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return MONTH_NAMES[m-1] + ' ' + y;
}
function shiftMonth(key, delta){
  let [y,m] = key.split('-').map(Number);
  m += delta;
  if(m>12){m=1;y++;} if(m<1){m=12;y--;}
  return monthKey(y,m);
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* غيّر الرابط ده لو عملت نشر (Deploy) جديد للسكريبت وطلع لك رابط مختلف */
const REMOTE_DB_URL = 'https://script.google.com/macros/s/AKfycbz1_5VB0BEdJt6w0GiajPA2Rwdyx63CWSaYhZ2EYfu9EG038vZmsgDleAYxZrW1-Ch3aA/exec';

let lastSyncedRaw = null;
let syncTimer = null;

function hasClaudeStorage(){
  return typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
}

function setSyncStatus(txt, isError){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = txt;
  el.style.color = isError ? '#ffc2c2' : '#bfe0ff';
}

async function storageGet(key){
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(key, true);
      return res ? res.value : null;
    }catch(e){ /* not found yet, or storage not usable here */ }
  }
  if(REMOTE_DB_URL){
    try{
      const res = await fetch(REMOTE_DB_URL + '?key=' + encodeURIComponent(key), {cache:'no-store'});
      const json = await res.json();
      if(json && json.value){
        try{ localStorage.setItem(key, json.value); }catch(e){}
        setSyncStatus('🟢 متصل بجوجل شيت');
        return json.value;
      }
      setSyncStatus('🟢 متصل بجوجل شيت');
      return null;
    }catch(e){
      setSyncStatus('🟠 مفيش اتصال — بيشتغل من آخر نسخة محفوظة على الجهاز', true);
    }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}

async function storageSet(key, value){
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value, true); return; }catch(e){ /* fall through to local */ }
  }
  try{ localStorage.setItem(key, value); }catch(e){ console.error('save failed', e); }
  if(REMOTE_DB_URL){
    try{
      await fetch(REMOTE_DB_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, // نص عادي عشان نتفادى preflight من جوجل أبس سكريبت
        body: JSON.stringify({key, value})
      });
      setSyncStatus('🟢 متصل بجوجل شيت');
    }catch(e){
      setSyncStatus('🟠 التعديل محفوظ على جهازك بس — هيتزامن أول ما النت يرجع', true);
    }
  }
}

async function loadState(){
  const raw = await storageGet('data');
  if(raw){
    lastSyncedRaw = raw;
    state = JSON.parse(raw);
    migrateState();
    return;
  }
  state = seedState();
  await persist();
}

/* بيجيب آخر نسخة من جوجل شيت دوري، عشان أي حد غيّر حاجة يظهر التغيير عند الكل من غير ما يحتاج يعمل ريفريش يدوي.
   بيوقف أثناء ما حد فاتح وضع التعديل (unlocked) عشان مايبوظش حاجة وهو بيكتب. */
async function pollRemote(){
  if(unlocked) return;
  try{
    const raw = await storageGet('data');
    if(raw && raw !== lastSyncedRaw){
      lastSyncedRaw = raw;
      state = JSON.parse(raw);
      migrateState();
      renderAll();
    }
  }catch(e){ /* تجاهل أي خطأ مؤقت في الشبكة */ }
}
function startSyncPolling(){
  if(!REMOTE_DB_URL) return;
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(pollRemote, 20000); // كل 20 ثانية
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden) pollRemote();
  });
}

function migrateState(){
  let changed = false;
  if(!state.settings){
    state.settings = { elevatorAmount:500, noElevatorAmount:450 };
    changed = true;
  }
  if(!state.settings.editPin){
    state.settings.editPin = '1234';
    changed = true;
  }
  if(typeof state.settings.unlockTaps !== 'number'){
    state.settings.unlockTaps = 4;
    changed = true;
  }
  if(typeof state.settings.changePinTaps !== 'number'){
    state.settings.changePinTaps = 7;
    changed = true;
  }
  if(typeof state.settings.openingBalance !== 'number'){
    const oldLedgerSum = (state.fundLedger||[]).reduce((s,f)=>s+f.amount,0);
    state.settings.openingBalance = oldLedgerSum || 4050;
    state.fundLedger = [];
    changed = true;
  }
  state.apartments.forEach(a=>{
    if(typeof a.elevator !== 'boolean'){
      a.elevator = a.floor !== 'الأرضي';
      changed = true;
    }
    if(typeof a.occupied !== 'boolean'){
      a.occupied = !!a.name;
      changed = true;
    }
    if(!Array.isArray(a.occupancyPeriods)){
      // بيانات قديمة: لو الشقة مأهولة حاليًا نعتبرها مأهولة من أول شهر متسجّل عندنا عشان مانخسرش المتأخرات القديمة
      a.occupancyPeriods = a.occupied ? [{from: START_MONTH, to: null}] : [];
      changed = true;
    }
  });
  if(!Array.isArray(state.commitments)){
    state.commitments = [];
    changed = true;
  }
  if(!Array.isArray(state.commitmentPayments)){
    state.commitmentPayments = [];
    changed = true;
  }
  if(!Array.isArray(state.elevatorSpends)){
    state.elevatorSpends = [];
    changed = true;
  }
  if(!state.paymentDates){
    state.paymentDates = {};
    changed = true;
  }
  (state.commitments||[]).forEach(c=>{
    if(typeof c.fundType !== 'string'){
      c.fundType = 'general';
      changed = true;
    }
  });
  if(changed) persist();
}

function fmt(n){

function fileToAttachment(file){
  if(file.type && file.type.startsWith('image/')){
    return compressImageToAttachment(file);
  }
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve({name: file.name, type: file.type, dataUrl: reader.result});
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressImageToAttachment(file, maxDim = 1600, quality = 0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({name: file.name.replace(/\.(png|heic|webp)$/i,'.jpg'), type:'image/jpeg', dataUrl});
      };
      img.onerror = ()=>{
        // مش قادر يفتحها كصورة (مثلا HEIC مش مدعومة) — رجّع الملف الأصلي من غير ضغط
        resolve({name: file.name, type: file.type, dataUrl: reader.result});
      };
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function apartmentsByFloor(){

function isOccupiedInMonth(apt, monthKey){
  const periods = apt.occupancyPeriods || [];
  return periods.some(p => monthKey >= p.from && (p.to===null || monthKey < p.to));
}

function statusFor(apt, monthKey){
  if(!isOccupiedInMonth(apt, monthKey)) return 'vacant';
  const paid = (state.payments[monthKey]||{})[apt.id] || 0;
  if(paid<=0) return 'unpaid';
  if(paid>=apt.subscription) return 'paid';
  return 'partial';
}

function computeMonthTotals(monthKey){
  let expected=0, collected=0, outstanding=0;
  state.apartments.forEach(a=>{
    if(!isOccupiedInMonth(a, monthKey)) return;
    expected += a.subscription;
    const paid = (state.payments[monthKey]||{})[a.id] || 0;
    collected += paid;
    if(paid < a.subscription) outstanding++;
  });
  return {expected, collected, outstanding};
}

function computeFundBalance(){
  let bal = state.settings.openingBalance || 0;
  state.fundLedger.forEach(f=> bal += f.amount);
  Object.values(state.payments).forEach(monthObj=>{
    Object.values(monthObj).forEach(v=> bal += v);
  });
  (state.commitmentPayments||[]).forEach(cp=>{
    const c = state.commitments.find(x=>x.id===cp.commitmentId);
    if(c && !c.aptId){
      bal -= cp.amount; // سداد التزام عام (دين/فاتورة على العمارة) = فلوس بتخرج من الصندوق
    } else {
      bal += cp.amount; // تحصيل التزام إضافي من ساكن معيّن = فلوس بتدخل الصندوق
    }
  });
  state.expenses.forEach(e=> bal -= e.amount);
  (state.elevatorSpends||[]).forEach(sp=> bal -= sp.amount);
  return bal;
}

/* ---------------- COMMITMENTS (التزامات) ---------------- */
const COMMITMENT_TYPES = {
  once: 'مرة واحدة',
  monthly: 'شهري ثابت',
  installment: 'قسط شهري'
};

function commitmentTotalDue(c, uptoMonthKey){
  uptoMonthKey = uptoMonthKey || currentMonth;
  if(uptoMonthKey < c.startMonth) return 0;
  if(c.type==='once') return c.amount;
  const months = monthsRange(c.startMonth, uptoMonthKey).length;
  if(c.type==='installment') return Math.min(c.totalAmount||0, c.amount * months);
  // monthly: تراكم كل شهر من شهر البداية لحد الشهر الحالي
  return c.amount * months;
}

function commitmentPaidTotal(c){
  return (state.commitmentPayments||[])
    .filter(cp=>cp.commitmentId===c.id)
    .reduce((s,cp)=>s+cp.amount,0);
}

function commitmentRemaining(c, uptoMonthKey){
  const due = commitmentTotalDue(c, uptoMonthKey);
  const paid = commitmentPaidTotal(c);
  const rem = due - paid;
  return c.type==='monthly' ? rem : Math.max(0, rem);
}

function commitmentTotalRemaining(c){
  // remaining to fully close the commitment, regardless of how many months elapsed
  const total = c.type==='installment' ? (c.totalAmount||0) : commitmentTotalDue(c, currentMonth);
  return Math.max(0, total - commitmentPaidTotal(c));
}

function commitmentSuggestedAmount(c){
  const rem = commitmentRemaining(c, currentMonth);
  if(c.type==='monthly') return c.amount;
  return Math.max(0, Math.min(c.amount, rem));
}

function aptCommitments(aptId){
  return (state.commitments||[]).filter(c=>c.aptId===aptId && c.startMonth<=currentMonth);
}

function monthsRange(fromKey, toKey){
  const months = [];
  let cur = fromKey;
  // safety cap so a bad date never loops forever
  for(let i=0;i<240;i++){
    months.push(cur);
    if(cur===toKey) break;
    cur = shiftMonth(cur, 1);
  }
  return months;
}

function computeArrears(){
  const months = monthsRange(START_MONTH, currentMonth);
  const perApt = {}; // aptId -> {apt, total, items:[{label, owed}]}
  state.apartments.forEach(apt=>{
    months.forEach(mk=>{
      if(!isOccupiedInMonth(apt, mk)) return;
      const paid = (state.payments[mk]||{})[apt.id] || 0;
      const owed = apt.subscription - paid;
      if(owed>0){
        if(!perApt[apt.id]) perApt[apt.id] = {apt, total:0, items:[]};
        perApt[apt.id].total += owed;
        perApt[apt.id].items.push({label: monthLabel(mk), owed, mk});
      }
    });
    aptCommitments(apt.id).forEach(c=>{
      const rem = commitmentRemaining(c, currentMonth);
      if(rem>0){
        if(!perApt[apt.id]) perApt[apt.id] = {apt, total:0, items:[]};
        perApt[apt.id].total += rem;
        perApt[apt.id].items.push({label: 'دين: ' + (c.note||COMMITMENT_TYPES[c.type]), owed: rem, commitId: c.id});
      }
    });
  });
  return Object.values(perApt).sort((a,b)=> b.total - a.total);
}

function settleArrearsForApt(aptId){
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt) return;
  const months = monthsRange(START_MONTH, currentMonth);
  months.forEach(mk=>{
    if(!isOccupiedInMonth(apt, mk)) return;
    if(!state.payments[mk]) state.payments[mk] = {};
    if(!state.paymentDates[mk]) state.paymentDates[mk] = {};
    const paid = state.payments[mk][apt.id] || 0;
    if(paid < apt.subscription){
      state.payments[mk][apt.id] = apt.subscription;
      state.paymentDates[mk][apt.id] = todayStr();
    }
  });
  aptCommitments(apt.id).forEach(c=>{
    const rem = commitmentRemaining(c, currentMonth);
    if(rem>0){
      if(!state.commitmentPayments) state.commitmentPayments=[];
      state.commitmentPayments.push({
        id:'cp'+Date.now()+Math.random().toString(36).slice(2,6),
        commitmentId:c.id, aptId:c.aptId, date: currentMonth+'-01', amount: rem
      });
    }
  });
}

function editArrearOwed(aptId, key, newOwedRaw){
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt) return;
  const newOwed = Number(newOwedRaw);
  if(isNaN(newOwed) || newOwed<0) { renderAll(); return; }
  if(key.startsWith('m:')){
    // بند اشتراك شهر معيّن: المتأخر = الاشتراك - المدفوع، فتعديل المتأخر معناه تعديل المدفوع المقابل
    const mk = key.slice(2);
    if(!state.payments[mk]) state.payments[mk] = {};
    if(!state.paymentDates[mk]) state.paymentDates[mk] = {};
    state.payments[mk][apt.id] = apt.subscription - newOwed;
    state.paymentDates[mk][apt.id] = todayStr();
  } else if(key.startsWith('c:')){
    // بند التزام (دين/قسط): بنسجّل الفرق كسداد أو كإضافة على الالتزام عشان يظبط المتبقي على القيمة الجديدة
    const commitId = key.slice(2);
    const c = state.commitments.find(x=>x.id===commitId);
    if(!c) return;
    const oldRem = commitmentRemaining(c, currentMonth);
    const delta = oldRem - newOwed;
    if(delta !== 0){
      if(!state.commitmentPayments) state.commitmentPayments = [];
      state.commitmentPayments.push({
        id:'cp'+Date.now()+Math.random().toString(36).slice(2,6),
        commitmentId: c.id, aptId: c.aptId, date: todayStr(), amount: delta
      });
    }
  }
  persist(); renderAll();
}

function computeElevatorFundBalance(){
  // بيجمع بس الالتزامات اللي اتعلّمت "خاصة باشتراكات الأسانسير" — سواء تحصيل من ساكن مشترك جديد (بيزوّد الرصيد)
  // أو التزام عام مرتبط بالأسانسير بدون شقة معيّنة (بيقلل منه)، بالإضافة لعمليات الصرف اليدوي
  let bal = 0;
  (state.commitmentPayments||[]).forEach(cp=>{
    const c = state.commitments.find(x=>x.id===cp.commitmentId);
    if(c && c.fundType==='elevator'){
      bal += c.aptId ? cp.amount : -cp.amount;
    }
  });
  (state.elevatorSpends||[]).forEach(sp=> bal -= sp.amount);
  return bal;
}

function apartmentElevatorCredit(aptId){
  // الرصيد ده ملك مشترك لكل المشتركين في الأسانسير مع بعض (مش خاص بمين دفع بالظبط) — بيتقسم بالتساوي بينهم
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt || !apt.elevator) return 0;
  const subscribers = state.apartments.filter(a=>a.elevator);
  if(subscribers.length===0) return 0;
  return computeElevatorFundBalance() / subscribers.length;
}

function useElevatorShareForApt(aptId, amount){
  // بيستخدم مبلغ (نصيب الشقة من رصيد الأسانسير المشترك) في سداد المستحق على الشقة دي —
  // بيبدأ بالاشتراكات المتأخرة (الأقدم فالأقدم) وبعدين أي التزامات تانية عليها غير مرتبطة بالأسانسير نفسه،
  // وبعدين بيسجّل المبلغ اللي فعلاً اتصرف كخصم من رصيد الأسانسير المشترك.
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt || amount<=0) return 0;
  let remaining = amount;
  const months = monthsRange(START_MONTH, currentMonth);
  months.forEach(mk=>{
    if(remaining<=0) return;
    if(!isOccupiedInMonth(apt, mk)) return;
    if(!state.payments[mk]) state.payments[mk] = {};
    if(!state.paymentDates[mk]) state.paymentDates[mk] = {};
    const paid = state.payments[mk][apt.id] || 0;
    const owed = apt.subscription - paid;
    if(owed>0){
      const pay = Math.min(owed, remaining);
      state.payments[mk][apt.id] = paid + pay;
      state.paymentDates[mk][apt.id] = todayStr();
      remaining -= pay;
    }
  });
  if(remaining>0){
    aptCommitments(apt.id).forEach(c=>{
      if(remaining<=0) return;
      if(c.fundType==='elevator') return; // متعملش خصم لاشتراك الأسانسير نفسه من رصيد الأسانسير
      const rem = commitmentRemaining(c, currentMonth);
      if(rem>0){
        const pay = Math.min(rem, remaining);
        if(!state.commitmentPayments) state.commitmentPayments=[];
        state.commitmentPayments.push({
          id:'cp'+Date.now()+Math.random().toString(36).slice(2,6),
          commitmentId:c.id, aptId:c.aptId, date: currentMonth+'-01', amount: pay
        });
        remaining -= pay;
      }
    });
  }
  const used = amount - remaining;
  if(used>0){
    if(!state.elevatorSpends) state.elevatorSpends=[];
    state.elevatorSpends.push({
      id:'esp'+Date.now()+Math.random().toString(36).slice(2,6),
      date: currentMonth+'-01',
      note: 'خصم نصيب '+(apt.name||apt.id)+' من رصيد الأسانسير في سداد المستحق عليه',
      amount: used
    });
  }
  return used;
}

function computeTotalObligations(){
  // بس الالتزامات العامة على العمارة (بدون شقة) — مش المبالغ الإضافية المطلوبة من ساكن معيّن
  return (state.commitments||[]).filter(c=>!c.aptId).reduce((s,c)=> s + commitmentTotalRemaining(c), 0);
}

function commitmentAptLabel(c){
  if(!c.aptId) return 'التزام عام (بدون شقة)';
  const apt = state.apartments.find(a=>a.id===c.aptId);
  return apt ? (apt.name||apt.id) : c.aptId;
}

function computeMonthExpenses(monthKey){
  return state.expenses
    .filter(e=> e.date && e.date.slice(0,7)===monthKey)
    .reduce((s,e)=>s+e.amount,0);
}

      <div class="cp-head">

function quickTogglePaid(aptId){
  if(!unlocked) return;
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt) return;
  if(!state.payments[currentMonth]) state.payments[currentMonth]={};
  if(!state.paymentDates[currentMonth]) state.paymentDates[currentMonth]={};
  const current = state.payments[currentMonth][aptId]||0;
  const goingToZero = current>=apt.subscription;
  state.payments[currentMonth][aptId] = goingToZero ? 0 : apt.subscription;
  if(goingToZero){
    delete state.paymentDates[currentMonth][aptId];
  } else {
    state.paymentDates[currentMonth][aptId] = todayStr();
  }
  persist();
  renderAll();
}

function exportReportCSV(){
  const arrears = computeArrears();
  const totalOwed = arrears.reduce((s,a)=>s+a.total,0);
  const balance = computeFundBalance();
  const rows = [];
  rows.push(['التقارير المالية برج الاندلس', monthLabel(currentMonth)]);
  rows.push(['رصيد الصندوق', balance]);
  rows.push(['إجمالي المتأخرات', totalOwed]);
  rows.push([]);
  rows.push(['رقم الشقة','اسم الساكن','البنود المتأخرة','إجمالي المستحق']);
  arrears.forEach(a=>{
    rows.push([a.apt.id, a.apt.name||'—', a.items.map(m=>m.label+' ('+m.owed+')').join(' / '), a.total]);
  });
  const csv = '\uFEFF' + rows.map(r=> r.map(cell=>{
    const s = String(cell==null?'':cell);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'تقرير-المتاخرات-'+currentMonth+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------- EVENTS ---------------- */
function bindCommitEditHandlers(){
  document.querySelectorAll('[data-edit-commit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!unlocked) return;
      editingCommitId = b.dataset.editCommit;
      renderAll();
    });
  });
  document.querySelectorAll('[data-cancel-edit-commit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!unlocked) return;
      editingCommitId = null;
      renderAll();
    });
  });
  document.querySelectorAll('[data-edit-commit-form]').forEach(f=>{
    f.addEventListener('submit', e=>{
      e.preventDefault();
      if(!unlocked) return;
      const c = state.commitments.find(x=>x.id===f.dataset.editCommitForm);
      const el = e.target;
      c.type = el.type.value;
      c.note = el.note.value;
      c.amount = Number(el.amount.value)||0;
      c.totalAmount = c.type==='installment' ? (Number(el.totalAmount.value)||0) : null;
      c.startMonth = el.startMonth.value || c.startMonth;
      c.fundType = el.isElevator && el.isElevator.checked ? 'elevator' : 'general';
      editingCommitId = null;
      persist(); renderAll();
    });
  });
}
function bindTabEvents(){
  if(currentTab==='collect'){
    bindCommitEditHandlers();
    document.querySelectorAll('.pay-amount').forEach(inp=>{
      inp.addEventListener('change', e=>{
        const aptId = e.target.dataset.apt;
        const val = Math.max(0, Number(e.target.value)||0);
        if(!state.payments[currentMonth]) state.payments[currentMonth]={};
        if(!state.paymentDates[currentMonth]) state.paymentDates[currentMonth]={};
        state.payments[currentMonth][aptId] = val;
        if(val>0){
          state.paymentDates[currentMonth][aptId] = todayStr();
        } else {
          delete state.paymentDates[currentMonth][aptId];
        }
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-toggle]').forEach(btn=>{
      btn.addEventListener('click', ()=> quickTogglePaid(btn.dataset.toggle));
    });
    document.querySelectorAll('[data-commit-pay]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const cId = btn.dataset.commitPay;
        const c = state.commitments.find(x=>x.id===cId);
        if(!c) return;
        const inp = document.querySelector(`.commit-pay-amount[data-commit="${cId}"]`);
        const val = Number(inp.value) || commitmentSuggestedAmount(c);
        if(val<=0) return;
        if(!state.commitmentPayments) state.commitmentPayments=[];
        state.commitmentPayments.push({
          id:'cp'+Date.now(), commitmentId:cId, aptId:c.aptId,
          date: currentMonth+'-01', amount: val
        });
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-del-commit]').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(!confirm('متأكد إنك عايز تحذف الالتزام ده؟')) return;
        const id = b.dataset.delCommit;
        state.commitments = state.commitments.filter(c=>c.id!==id);
        state.commitmentPayments = (state.commitmentPayments||[]).filter(cp=>cp.commitmentId!==id);
        selectedCommitIds.delete(id);
        persist(); renderAll();
      });
    });
    document.querySelectorAll('[data-commit-select]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const id = cb.dataset.commitSelect;
        if(cb.checked) selectedCommitIds.add(id); else selectedCommitIds.delete(id);
        renderAll();
      });
    });
    const selectAllCollectCommits = document.getElementById('selectAllCollectCommits');
    if(selectAllCollectCommits){
      selectAllCollectCommits.addEventListener('change', ()=>{

document.getElementById('prevMonth').addEventListener('click', ()=>{
  if(currentMonth <= START_MONTH) return; // مفيش بيانات قبل أول شهر مسجّل، فمنوقفش تحته
  currentMonth = shiftMonth(currentMonth, -1); renderAll();
});

  currentMonth = shiftMonth(currentMonth, 1); renderAll();
});

let titleTaps = [];
let pendingIntent = 'unlock'; // 'unlock' or 'changePin'
document.querySelector('.hero-title').addEventListener('click', ()=>{
  const now = Date.now();
  titleTaps.push(now);
  titleTaps = titleTaps.filter(t => now - t < 4000);
  const s = state && state.settings;
  if(!s) return;
  const needed = s.unlockTaps || 4;
  const neededChange = s.changePinTaps || 7;
  if(titleTaps.length >= neededChange){
    pendingIntent = 'changePin';
    document.getElementById('lockBtn').classList.add('revealed');
  } else if(titleTaps.length >= needed){
    pendingIntent = 'unlock';
    document.getElementById('lockBtn').classList.add('revealed');
  }
});

document.getElementById('lockBtn').addEventListener('click', ()=>{
  if(unlocked){
    lockNow();
    return;
  }
  document.getElementById('unlockPanel').classList.toggle('show');
  document.getElementById('pinInput').focus();
});
document.getElementById('pinSubmit').addEventListener('click', tryUnlock);
document.getElementById('pinInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') tryUnlock();
});
function tryUnlock(){
  const val = document.getElementById('pinInput').value;
  if(val === state.settings.editPin){
    unlocked = true;
    document.getElementById('unlockPanel').classList.remove('show');
    document.getElementById('pinInput').value='';
    if(pendingIntent==='changePin'){
      currentTab = 'apts';
      document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab==='apts'));
    }
    pendingIntent = 'unlock';
    titleTaps = [];
    renderAll();
    resetIdleTimer();
  } else {
    document.getElementById('pinInput').value='';
  }
}

function lockNow(){
  unlocked = false;
  document.getElementById('lockBtn').classList.remove('revealed');
  document.getElementById('unlockPanel').classList.remove('show');
  if(idleTimer) clearTimeout(idleTimer);
  renderAll();
}

/* قفل تلقائي بعد فترة عدم استخدام، أو لما الصفحة تتخبى/تتقفل */
let idleTimer = null;
function resetIdleTimer(){
  if(idleTimer) clearTimeout(idleTimer);
  if(!unlocked) return;
  idleTimer = setTimeout(lockNow, 3*60*1000); // 3 دقايق من غير أي تعديل
}
document.addEventListener('click', ()=>{ if(unlocked) resetIdleTimer(); });
document.addEventListener('input', ()=>{ if(unlocked) resetIdleTimer(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && unlocked) lockNow();
});
window.addEventListener('pagehide', ()=>{
  if(unlocked) lockNow();
});

(async function init(){
  await loadState();
  renderAll();
  startSyncPolling();
})();
</script>
</body>
</html>
