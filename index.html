<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store">
<title>متوقف</title>
<style>
  :root{ --bg:#f6f5fb; --ink:#2a2750; --soft:#6f6c8f; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#1b1936; --ink:#ecebff; --soft:#a9a6cc; } }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  main{ min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 16px; box-sizing:border-box; }
  h1{ font-size:22px; margin:0 0 8px; }
  p{ font-size:15px; color:var(--soft); margin:0; }
</style>
</head>
<body>
<main>
  <h1>الصفحة دي متوقفة</h1>
  <p>الخدمة مش متاحة دلوقتي.</p>
</main>
</body>
</html>
