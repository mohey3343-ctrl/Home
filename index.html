function bindStatementEvents(ov, apt){
  const done = ()=>{ persist(); renderAll(); };
  const setPay = (mk, val, date)=>{
    if(!state.payments[mk]) state.payments[mk] = {};
    if(!state.paymentDates[mk]) state.paymentDates[mk] = {};
    if(val > 0){
      state.payments[mk][apt.id] = val;
      state.paymentDates[mk][apt.id] = date || state.paymentDates[mk][apt.id] || collectDate;
    } else {
      delete state.payments[mk][apt.id];
      delete state.paymentDates[mk][apt.id];
    }
  };
  ov.querySelectorAll('[data-st-pay]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked) return;
    setPay(inp.dataset.stPay, Math.max(0, Number(inp.value)||0)); done();
  }));
  ov.querySelectorAll('[data-st-date]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked || !inp.value) return;
    const mk = inp.dataset.stDate;
    if(!((state.payments[mk]||{})[apt.id] > 0)){ alert('سجّل المبلغ الأول'); renderStatement(true); return; }
    state.paymentDates[mk][apt.id] = inp.value; done();
  }));
  ov.querySelectorAll('[data-st-full]').forEach(b=> b.addEventListener('click', ()=>{
    if(!unlocked) return;
    const mk = b.dataset.stFull;
    setPay(mk, subscriptionFor(apt, mk), collectDate); done();
  }));
  ov.querySelectorAll('[data-st-clear]').forEach(b=> b.addEventListener('click', ()=>{
    if(!unlocked) return;
    if(!confirm('تمسح دفعة ' + monthLabel(b.dataset.stClear) + '؟')) return;
    setPay(b.dataset.stClear, 0); done();
  }));
  const findCp = id=> (state.commitmentPayments||[]).find(x=> x.id===id);
  ov.querySelectorAll('[data-st-cp-amt]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked) return;
    const x = findCp(inp.dataset.stCpAmt); if(!x) return;
    const v = Number(inp.value)||0;
    if(v <= 0){ alert('لو عايز تشيل الدفعة دوس ✕'); renderStatement(true); return; }
    x.amount = v; done();
  }));
  ov.querySelectorAll('[data-st-cp-date]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked || !inp.value) return;
    const x = findCp(inp.dataset.stCpDate); if(!x) return;
    x.date = inp.value; done();
  }));
  ov.querySelectorAll('[data-st-cp-del]').forEach(b=> b.addEventListener('click', ()=>{
    if(!unlocked) return;
    if(!confirm('تمسح الدفعة دي؟')) return;
    state.commitmentPayments = (state.commitmentPayments||[]).filter(x=> x.id!==b.dataset.stCpDel); done();
  }));
  ov.querySelectorAll('[data-st-cp-add]').forEach(b=> b.addEventListener('click', ()=>{
    if(!unlocked) return;
    const c = (state.commitments||[]).find(x=> x.id===b.dataset.stCpAdd); if(!c) return;
    const inp = ov.querySelector(`[data-st-cp-new="${c.id}"]`);
    const v = Number(inp && inp.value) || Number(inp && inp.placeholder.replace(/,/g,'')) || 0;
    if(v <= 0){ alert('اكتب المبلغ'); return; }
    if(!state.commitmentPayments) state.commitmentPayments = [];
    state.commitmentPayments.push({id:'cp'+Date.now(), commitmentId:c.id, aptId:c.aptId, date:collectDate, amount:v});
    done();
  }));
  ov.querySelectorAll('[data-st-commit-del]').forEach(b=> b.addEventListener('click', ()=>{
    if(!unlocked) return;
    if(!confirm('تمسح الالتزام ده وكل دفعاته؟')) return;
    const id = b.dataset.stCommitDel;
    state.commitments = state.commitments.filter(c=> c.id!==id);
    state.commitmentPayments = (state.commitmentPayments||[]).filter(cp=> cp.commitmentId!==id);
    done();
  }));
  ov.querySelectorAll('[data-st-moveout]').forEach(b=> b.addEventListener('click', ()=> showMoveOut(b.dataset.stMoveout)));
  ov.querySelectorAll('[data-st-movein]').forEach(b=> b.addEventListener('click', ()=> showMoveIn(b.dataset.stMovein)));
}

function statusFor(apt, monthKey){
  if(!isOccupiedInMonth(apt, monthKey)) return 'vacant';
  const paid = (state.payments[monthKey]||{})[apt.id] || 0;
  if(paid<=0) return 'unpaid';
  if(paid>=subscriptionFor(apt, monthKey)) return 'paid';
  return 'partial';
}

function computeMonthTotals(monthKey){
  let expected=0, collected=0, outstanding=0;
  state.apartments.forEach(a=>{
    if(!isOccupiedInMonth(a, monthKey)) return;
    const sub = subscriptionFor(a, monthKey);
    expected += sub;
    const paid = (state.payments[monthKey]||{})[a.id] || 0;
    collected += paid;
    if(paid < sub) outstanding++;
  });
  return {expected, collected, outstanding};
}

function computeFundBalance(){
  let bal = state.settings.openingBalance || 0;
  state.fundLedger.forEach(f=> bal += f.amount);
  Object.values(state.payments).forEach(monthObj=>{
    Object.values(monthObj).forEach(v=> bal += v);
  });
  (state.commitmentPayments||[]).forEach(cp=>{
    const c = state.commitments.find(x=>x.id===cp.commitmentId);
    if(c && !c.aptId){
      bal -= cp.amount; // سداد التزام عام (دين/فاتورة على العمارة) = فلوس بتخرج من الصندوق
    } else {
      bal += cp.amount; // تحصيل التزام إضافي من ساكن معيّن = فلوس بتدخل الصندوق
    }
  });
  state.expenses.forEach(e=> bal -= e.amount);
  (state.elevatorSpends||[]).forEach(sp=> bal -= sp.amount);
  return bal;
}

/* ---------------- COMMITMENTS (التزامات) ---------------- */
const COMMITMENT_TYPES = {
  once: 'مرة واحدة',
  monthly: 'شهري ثابت',
  installment: 'قسط شهري'
};

function commitmentTotalDue(c, uptoMonthKey){
  uptoMonthKey = uptoMonthKey || currentMonth;
  if(c.endMonth && uptoMonthKey > c.endMonth) uptoMonthKey = c.endMonth; // الساكن مشي ← الالتزام الشهري وقف
  if(uptoMonthKey < c.startMonth) return 0;
  if(c.type==='once') return c.amount;
  const months = monthsRange(c.startMonth, uptoMonthKey).length;
  if(c.type==='installment') return Math.min(c.totalAmount||0, c.amount * months);
  // monthly: تراكم كل شهر من شهر البداية لحد الشهر الحالي
  return c.amount * months;
}

function commitmentPaidTotal(c){
  return (state.commitmentPayments||[])
    .filter(cp=>cp.commitmentId===c.id)
    .reduce((s,cp)=>s+cp.amount,0);
}

function commitmentRemaining(c, uptoMonthKey){
  const due = commitmentTotalDue(c, uptoMonthKey);
  const paid = commitmentPaidTotal(c);
  const rem = due - paid;
  return c.type==='monthly' ? rem : Math.max(0, rem);
}

function commitmentTotalRemaining(c){
  // remaining to fully close the commitment, regardless of how many months elapsed
  const total = c.type==='installment' ? (c.totalAmount||0) : commitmentTotalDue(c, currentMonth);
  return Math.max(0, total - commitmentPaidTotal(c));
}

function commitmentSuggestedAmount(c){
  const rem = commitmentRemaining(c, currentMonth);
  if(c.type==='monthly') return c.amount;
  return Math.max(0, Math.min(c.amount, rem));
}

function aptCommitments(aptId){
  // التزامات الساكن اللي ساكن في الشهر المعروض بس (التزامات السكان اللي مشيوا بتظهر في المتأخرات وكشف الحساب)
  const apt = state.apartments.find(a=> a.id===aptId);
  const r = apt ? residentOfPeriod(apt, periodFor(apt, currentMonth)) : null;
  return (state.commitments||[]).filter(c=> c.aptId===aptId && c.startMonth<=currentMonth
    && (!r || (commitmentResident(c)||{}).rid===r.rid));
}

function monthsRange(fromKey, toKey){
  const months = [];
  let cur = fromKey;
  // safety cap so a bad date never loops forever
  for(let i=0;i<240;i++){
    months.push(cur);
    if(cur===toKey) break;
    cur = shiftMonth(cur, 1);
  }
  return months;
}

/* المتأخرات لكل ساكن لوحده (مش لكل شقة) — عشان متأخرات ساكن مشي ماتتنسبش للي جه بعده */
function computeArrears(){
  const asOf = arrearsAsOfMonth();
  const rows = [];
  state.apartments.forEach(apt=>{
    residentsOf(apt).forEach(r=>{
      const row = {key: residentKey(r), apt, resident: r, name: r.name, past: !r.current, total:0, items:[]};
      residentMonths(r, asOf).forEach(mk=>{
        const paid = (state.payments[mk]||{})[apt.id] || 0;
        const owed = subscriptionFor(apt, mk) - paid;
        if(owed>0){
          row.total += owed;
          row.items.push({label: monthLabel(mk), owed, mk});
        }
      });
      residentCommitments(r).filter(c=> c.startMonth<=asOf).forEach(c=>{
        const rem = commitmentRemaining(c, asOf);
        if(rem>0){
          row.total += rem;
          row.items.push({label: 'دين: ' + (c.note||COMMITMENT_TYPES[c.type]), owed: rem, commitId: c.id});
        }
      });
      if(row.items.length) rows.push(row);
    });
  });
  return rows.sort((a,b)=> b.total - a.total);
}

function settleArrearsFor(key){
  const r = findResident(key);
  if(!r) return;
  const apt = r.apt;
  const asOf = arrearsAsOfMonth();
  residentMonths(r, asOf).forEach(mk=>{
    if(!state.payments[mk]) state.payments[mk] = {};
    if(!state.paymentDates[mk]) state.paymentDates[mk] = {};
    const paid = state.payments[mk][apt.id] || 0;
    const sub = subscriptionFor(apt, mk);
    if(paid < sub){
      state.payments[mk][apt.id] = sub;
      state.paymentDates[mk][apt.id] = collectDate; // تاريخ التحصيل المختار، مش النهارده بالعافية
    }
  });
  residentCommitments(r).filter(c=> c.startMonth<=asOf).forEach(c=>{
    const rem = commitmentRemaining(c, asOf);
    if(rem>0){
      if(!state.commitmentPayments) state.commitmentPayments=[];
      state.commitmentPayments.push({
        id:'cp'+Date.now()+Math.random().toString(36).slice(2,6),
        commitmentId:c.id, aptId:c.aptId, date: collectDate, amount: rem
      });
    }
  });
}

function editArrearOwed(aptId, key, newOwedRaw){
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt) return;
  const newOwed = Number(newOwedRaw);
  if(isNaN(newOwed) || newOwed<0) { renderAll(); return; }
  if(key.startsWith('m:')){
    // بند اشتراك شهر معيّن: المتأخر = الاشتراك - المدفوع، فتعديل المتأخر معناه تعديل المدفوع المقابل
    const mk = key.slice(2);
    const sub = subscriptionFor(apt, mk);
    if(newOwed > sub){
      // المتأخر مايزيدش عن الاشتراك، وإلا المدفوع هيتسجّل بالسالب وينقّص رصيد الصندوق
      alert('المتأخر ماينفعش يبقى أكبر من الاشتراك الشهري (' + fmt(sub) + ' جنيه).\nلو فيه مبلغ زيادة على الساكن سجّله كالتزام/دين عليه.');
      renderAll();
      return;
    }
    if(!state.payments[mk]) state.payments[mk] = {};
    if(!state.paymentDates[mk]) state.paymentDates[mk] = {};
    state.payments[mk][apt.id] = sub - newOwed;
    state.paymentDates[mk][apt.id] = collectDate;
  } else if(key.startsWith('c:')){
    // بند التزام (دين/قسط): بنسجّل الفرق كسداد أو كإضافة على الالتزام عشان يظبط المتبقي على القيمة الجديدة
    const commitId = key.slice(2);
    const c = state.commitments.find(x=>x.id===commitId);
    if(!c) return;
    const oldRem = commitmentRemaining(c, arrearsAsOfMonth());
    const delta = oldRem - newOwed;
    if(delta !== 0){
      if(!state.commitmentPayments) state.commitmentPayments = [];
      state.commitmentPayments.push({
        id:'cp'+Date.now()+Math.random().toString(36).slice(2,6),
        commitmentId: c.id, aptId: c.aptId, date: collectDate, amount: delta
      });
    }
  }
  persist(); renderAll();
}

function computeElevatorFundBalance(){
  // بيجمع بس الالتزامات اللي اتعلّمت "خاصة باشتراكات الأسانسير" — سواء تحصيل من ساكن مشترك جديد (بيزوّد الرصيد)
  // أو التزام عام مرتبط بالأسانسير بدون شقة معيّنة (بيقلل منه)، بالإضافة لعمليات الصرف اليدوي
  let bal = 0;
  (state.commitmentPayments||[]).forEach(cp=>{
    const c = state.commitments.find(x=>x.id===cp.commitmentId);
    if(c && c.fundType==='elevator'){
      bal += c.aptId ? cp.amount : -cp.amount;
    }
  });
  (state.elevatorSpends||[]).forEach(sp=> bal -= sp.amount);
  return bal;
}

function apartmentElevatorCredit(aptId){
  // الرصيد ده ملك مشترك لكل المشتركين في الأسانسير مع بعض (مش خاص بمين دفع بالظبط) — بيتقسم بالتساوي بينهم
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt || !apt.elevator) return 0;
  const subscribers = state.apartments.filter(a=>a.elevator);
  if(subscribers.length===0) return 0;
  return computeElevatorFundBalance() / subscribers.length;
}

function useElevatorShareForApt(aptId, amount){
  // بيستخدم مبلغ (نصيب الشقة من رصيد الأسانسير المشترك) في سداد المستحق على الشقة دي —
  // بيبدأ بالاشتراكات المتأخرة (الأقدم فالأقدم) وبعدين أي التزامات تانية عليها غير مرتبطة بالأسانسير نفسه،
  // وبعدين بيسجّل المبلغ اللي فعلاً اتصرف كخصم من رصيد الأسانسير المشترك.
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt || amount<=0) return 0;
  let remaining = amount;
  const months = monthsRange(START_MONTH, currentMonth);
  months.forEach(mk=>{
    if(remaining<=0) return;
    if(!isOccupiedInMonth(apt, mk)) return;
    if(!state.payments[mk]) state.payments[mk] = {};
    if(!state.paymentDates[mk]) state.paymentDates[mk] = {};
    const paid = state.payments[mk][apt.id] || 0;
    const owed = subscriptionFor(apt, mk) - paid;
    if(owed>0){
      const pay = Math.min(owed, remaining);
      state.payments[mk][apt.id] = paid + pay;
      state.paymentDates[mk][apt.id] = todayStr();
      remaining -= pay;
    }
  });
  if(remaining>0){
    aptCommitments(apt.id).forEach(c=>{
      if(remaining<=0) return;
      if(c.fundType==='elevator') return; // متعملش خصم لاشتراك الأسانسير نفسه من رصيد الأسانسير
      const rem = commitmentRemaining(c, currentMonth);
      if(rem>0){
        const pay = Math.min(rem, remaining);
        if(!state.commitmentPayments) state.commitmentPayments=[];
        state.commitmentPayments.push({
          id:'cp'+Date.now()+Math.random().toString(36).slice(2,6),
          commitmentId:c.id, aptId:c.aptId, date: currentMonth+'-01', amount: pay
        });
        remaining -= pay;
      }
    });
  }
  const used = amount - remaining;
  if(used>0){
    if(!state.elevatorSpends) state.elevatorSpends=[];
    state.elevatorSpends.push({
      id:'esp'+Date.now()+Math.random().toString(36).slice(2,6),
      date: currentMonth+'-01',
      note: 'خصم نصيب '+(residentNameFor(apt, currentMonth)||apt.id)+' من رصيد الأسانسير في سداد المستحق عليه',
      amount: used
    });
  }
  return used;
}

function computeTotalObligations(){
  // بس الالتزامات العامة على العمارة (بدون شقة) — مش المبالغ الإضافية المطلوبة من ساكن معيّن
  return (state.commitments||[]).filter(c=>!c.aptId).reduce((s,c)=> s + commitmentTotalRemaining(c), 0);
}

function commitmentAptLabel(c){
  if(!c.aptId) return 'التزام عام (بدون شقة)';
  const apt = state.apartments.find(a=>a.id===c.aptId);
  const r = commitmentResident(c);
  return apt ? ((r && r.name) || apt.name || apt.id) : c.aptId;
}

function computeMonthExpenses(monthKey){
  return state.expenses
    .filter(e=> e.date && e.date.slice(0,7)===monthKey)
    .reduce((s,e)=>s+e.amount,0);
}

/* ---------------- أنواع المصروفات وطريقة تقسيمها ----------------
   كل مصروف أو التزام عام على العمارة ليه "نوع" من القايمة دي، والقايمة بتتعدّل من تبويب ⚙️ الإعدادات.
   طريقة التقسيم لكل نوع (split):
     all          على كل السكان النشطين (المأهولين في الشهر)
     elevator     على المشتركين في الأسانسير بس
     nonElevator  على غير المشتركين بس
     mixed        allPct% على الكل والباقي على المشتركين في الأسانسير
   لو النوع ليه fixedMonthly: المبلغ ده بيتحسب كل شهر (من أول شهر اتسجّل فيه النوع) مهما اتدفع،
   والدفعات المتسجّلة بتظهر للمتابعة بس.
   نوعين ليهم حساب خاص (method):
     water        مصروف المياه في الشهر، وإلا التزام الإيصال (بشهر الفاتورة)، وإلا تقدير من آخر فاتورة.
     electricity  بندفع كل ما الكارت يخلص: كل شحنة بتتوزع على الأيام لحد الشحنة اللي بعدها،
                  والأيام بعد آخر شحنة بتتقدّر بمتوسط اليوم (شوف computeMonthElectricity). */
const DEFAULT_EXPENSE_KINDS = [
  {key:'water',       label:'مياه',             icon:'💧', split:'all', method:'water'},
  {key:'electricity', label:'كهرباء',           icon:'⚡', split:'mixed', allPct:70, method:'electricity'},
  {key:'stairs',      label:'نظافة سلم',        icon:'🧹', split:'all', fixedMonthly:1200},
  {key:'elevator',    label:'صيانة أسانسير',    icon:'🛗', split:'elevator'},
  {key:'pump',        label:'صيانة موتور مياه', icon:'⚙️', split:'all'},
  {key:'maintenance', label:'صيانة عامة',       icon:'🔧', split:'all'},
  {key:'other',       label:'أخرى',             icon:'🧾', split:'all'},
];
const DEFAULT_PAYMENT_OPTIONS = [
  'إنستا باي: أ/ بكر — 01098020086 — باسم أبو بكر',
  'إنستا باي: أ/ محمد — 01100890608 — باسم M -----S-----K-----T',
  'أو ترك الشهرية عند السوبر ماركت أسفل البرج وإبلاغنا على الجروب الخاص بالبرج'
].join('\n');
const LOCKED_KINDS = ['water','electricity','other']; // مينفعش تتمسح: ليها حساب خاص، و"أخرى" هي الاحتياطي
const SPLIT_LABELS = {
  all: 'على كل السكان',
  elevator: 'مشتركين الأسانسير بس',
  nonElevator: 'غير المشتركين بس',
  mixed: 'نسبة على الكل والباقي على الأسانسير'
};

function expenseKinds(){
  return (state && state.settings && Array.isArray(state.settings.expenseKinds) && state.settings.expenseKinds.length)
    ? state.settings.expenseKinds : DEFAULT_EXPENSE_KINDS;
}
function validKind(key){ return !!key && expenseKinds().some(k=> k.key===key); }
function kindInfo(key){
  return expenseKinds().find(k=> k.key===key)
    || expenseKinds().find(k=> k.key==='other')
    || DEFAULT_EXPENSE_KINDS[DEFAULT_EXPENSE_KINDS.length-1];
}
function kindName(key){ const k = kindInfo(key); return (k.icon ? k.icon + ' ' : '') + k.label; }
function splitText(k){
  if(k.split==='mixed'){
    const p = Math.max(0, Math.min(100, Number(k.allPct)||0));
    return p + '% على الكل · ' + (100-p) + '% على الأسانسير';
  }
  return SPLIT_LABELS[k.split] || SPLIT_LABELS.all;
}

function kindSelectHtml(attrs, selected, placeholder){
  return `<select class="kind-select" ${attrs}>`
    + (placeholder ? `<option value="">${escapeHtml(placeholder)}</option>` : '')
    + expenseKinds().map(k=> `<option value="${escapeHtml(k.key)}" ${k.key===selected?'selected':''}>${escapeHtml(kindName(k.key))}</option>`).join('')
    + `</select>`;
}

/* ---- تخمين نوع الحاجات القديمة اللي اتسجّلت قبل قايمة الأنواع (بيتراجع من "مراجعة التصنيف") ---- */
function textKind(text){
  const c = normalizeSearch(text);
  if(c.includes('صيان')) return 'other';            // صيانة مواسير/موتور المياه = صيانة، مش مياه
  if(c.includes('كهرب')) return 'electricity';
  if(c.includes('مياه') || c.includes('ميه')) return 'water';
  if(c.includes('السلم') || (c.includes('سلم') && /(نظاف|تنظيف|مسح|غسيل)/.test(c))) return 'stairs';
  return 'other';
}
function isElevatorText(text){
  const t = normalizeSearch(text);
  return t.includes('اسانس') || t.includes('مصعد');
}
function guessKind(mainText, extraText, elevatorFund){
  const k = textKind(mainText);
  let g;
  if(k==='electricity') g = k;
  else if(elevatorFund || isElevatorText(mainText) || isElevatorText(extraText)) g = 'elevator';
  else if(k!=='other') g = k;
  else {
    const t = normalizeSearch((mainText||'') + ' ' + (extraText||''));
    if(/(ماتور|موتور|طلمب|طرمب)/.test(t)) g = 'pump';
    else if(t.includes('صيان')) g = 'maintenance';
    else g = 'other';
  }
  return validKind(g) ? g : 'other';
}
function expenseKind(e){ return validKind(e.kind) ? e.kind : guessKind(e.category, e.note, false); }
function commitKind(c){ return validKind(c.kind) ? c.kind : guessKind(c.note, '', c.fundType==='elevator'); }

/* تغيير نوع مصروف: الفئة بتبقى اسم النوع، ولو الفئة القديمة كان فيها كلام مش موجود في البيان بنحطه في أول البيان عشان مايضيعش */
function setExpenseKind(e, key){
  const label = kindInfo(key).label;
  const old = String(e.category||'').trim();
  const oldN = normalizeSearch(old);
  if(old && !normalizeSearch(label).includes(oldN) && !normalizeSearch(e.note||'').includes(oldN)){
    e.note = old + (e.note ? ' — ' + e.note : '');
  }
  e.kind = key;
  e.category = label;
}
function setCommitKind(c, key){ c.kind = key; }

/* الحاجات اللي لسه مالهاش نوع محفوظ (مصروفات + التزامات عامة) */
function unclassifiedRecords(){
  const list = [];
  state.expenses.forEach(e=>{
    if(!validKind(e.kind)) list.push({type:'exp', id:e.id, date:e.date, text:(e.category||'') + (e.note ? ' — ' + e.note : ''), amount:e.amount, guess:expenseKind(e)});
  });
  (state.commitments||[]).forEach(c=>{
    if(!c.aptId && !validKind(c.kind)) list.push({type:'commit', id:c.id, date:c.startMonth||'', text:'التزام: ' + (c.note||COMMITMENT_TYPES[c.type]), amount:c.amount, guess:commitKind(c)});
  });
  return list.sort((a,b)=> String(a.date).localeCompare(String(b.date)));
}

      ${list.map(r=> `<div class="tx-row" style="gap:8px;">

    </div>`;

/* سطر صغير في المصروفات والالتزامات بيودّي على المراجعة في الإعدادات (بيختفي لما كله يتصنّف) */

/* ---- شهر الالتزام اللي بيتحسب عليه: من البيان لو فيه اسم شهر ("فاتورة مياه شهر يوليه" أو "شهر 7")، وإلا "شهر البداية" ----
   السنة = الأقرب لشهر التسجيل (فاتورة ديسمبر متسجّلة في يناير = ديسمبر اللي فات). */
const NOTE_MONTHS = [['يناير'],['فبراير'],['مارس'],['ابريل'],['مايو'],['يونيو','يونيه'],['يوليو','يوليه'],['اغسطس'],['سبتمبر'],['اكتوبر'],['نوفمبر'],['ديسمبر']];

function monthFromNote(note, refMonth){
  const t = normalizeSearch(note);
  let num = null;
  NOTE_MONTHS.forEach((names,i)=>{ if(num===null && names.some(n=> t.includes(n))) num = i+1; });
  if(num===null){
    const m = t.match(/شهر\s*(\d{1,2})(?!\d)/);
    if(m && Number(m[1])>=1 && Number(m[1])<=12) num = Number(m[1]);
  }
  if(num===null || !refMonth) return null;
  const [ry, rm] = refMonth.split('-').map(Number);
  let best = null, bestDiff = Infinity;
  [ry-1, ry, ry+1].forEach(y=>{
    const diff = Math.abs((y*12 + num) - (ry*12 + rm));
    if(diff < bestDiff){ bestDiff = diff; best = monthKey(y, num); }
  });
  return best;
}
function commitBillMonth(c){
  return monthFromNote(c.note, c.startMonth) || c.startMonth;
}

/* الالتزامات العامة اللي بتدخل في الحسبة. التزامات "خاص بالأسانسير" مستبعدة لأنها بتتدفع من رصيد
   الأسانسير اللي المشتركين دفعوه قبل كده، فلو دخلت هيتحسبوا عليها مرتين. */
function shareCommitments(){
  return (state.commitments||[]).filter(c=> !c.aptId && c.fundType!=='elevator');
}
function commitmentPayments(c){
  return (state.commitmentPayments||[]).filter(cp=> cp.commitmentId===c.id)
    .sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')));
}
/* كام من الالتزام ده بيتحسب على الشهر ده:
   مرة واحدة ← كله في شهره (ولو اتدفع أكتر من المبلغ، بيتحسب المدفوع) · شهري ← المبلغ كل شهر · قسط ← قسط الشهر */
function commitmentAmountForMonth(c, mk){
  if(!c.startMonth) return 0;
  if(c.type==='monthly') return c.startMonth<=mk ? (Number(c.amount)||0) : 0;
  if(c.type==='installment'){
    if(mk < c.startMonth) return 0;
    const prev = shiftMonth(mk, -1);
    return commitmentTotalDue(c, mk) - (prev >= c.startMonth ? commitmentTotalDue(c, prev) : 0);
  }
  return commitBillMonth(c)===mk ? Math.max(Number(c.amount)||0, commitmentPaidTotal(c)) : 0;
}
function commitmentStatusText(c){
  if(c.type!=='once') return COMMITMENT_TYPES[c.type];
  const pays = commitmentPayments(c);
  const paid = pays.reduce((s,cp)=> s+(Number(cp.amount)||0), 0);
  const bill = Number(c.amount)||0;
  const lastPay = pays.length ? pays[pays.length-1].date : '';
  return paid >= bill
    ? '✓ اتدفع ' + fmt(paid) + (lastPay ? ' يوم ' + lastPay : '')
    : '⏳ لسه علينا — ' + fmt(bill) + (paid ? ' (اتدفع منه ' + fmt(paid) + ')' : '');
}

function expenseItem(e){
  return {date: e.date, title: e.note || e.category || '', sub: '', amount: Number(e.amount)||0};
}
function commitmentItem(c, amount){
  return {date: c.startMonth, title: 'التزام: ' + (c.note || COMMITMENT_TYPES[c.type]), sub: commitmentStatusText(c), amount};
}

/* التواريخ اللي بتظهر تحت كل التزام: شهره، نوعه والشهر اللي بيتحسب عليه (للالتزام العام)، وكل دفعة بتاريخها */
function commitmentDatesHtml(c){
  const parts = [];
  if(c.startMonth) parts.push('📅 ' + (c.type==='once' ? 'الشهر: ' : 'بداية من: ') + monthLabel(c.startMonth));
  if(!c.aptId){
    let t = '🏷 ' + kindName(commitKind(c)) + (validKind(c.kind) ? '' : ' (متوقع)');
    if(c.type==='once' && c.startMonth) t += ' — محسوب على ' + monthLabel(commitBillMonth(c));
    parts.push(t);
  }
  const pays = commitmentPayments(c);
  const payTxt = pays.length
    ? '💳 ' + pays.map(p=> fmt(p.amount) + ' يوم ' + (p.date||'—')).join(' · ')
    : '💳 لسه مفيش دفع';
  return `<div class="date">${escapeHtml(parts.join(' · '))}</div><div class="date">${escapeHtml(payTxt)}</div>`;
}

/* ---- المياه ---- */
function waterForExactMonth(key, mk){
  const exp = state.expenses.filter(e=> e.date && e.date.slice(0,7)===mk && expenseKind(e)===key);
  if(exp.length) return {source:'expenses', items: exp.map(expenseItem)};
  const commits = shareCommitments().filter(c=> commitKind(c)===key)
    .map(c=> ({c, amt: commitmentAmountForMonth(c, mk)})).filter(x=> x.amt > 0);
  if(commits.length) return {source:'commitment', items: commits.map(x=> commitmentItem(x.c, x.amt))};
  return null;
}
function computeMonthWater(key, mk){
  const withTotal = (r, extra)=> Object.assign({}, r, extra||{}, {total: r.items.reduce((s,x)=> s+x.amount, 0)});
  const exact = waterForExactMonth(key, mk);
  if(exact) return withTotal(exact);
  // مفيش فاتورة للشهر ده لسه ← آخر شهر قبله فيه فاتورة، كتقدير
  const months = state.expenses.filter(e=> e.date && expenseKind(e)===key).map(e=> e.date.slice(0,7))
    .concat(shareCommitments().filter(c=> commitKind(c)===key).map(c=> commitBillMonth(c)))
    .filter(m=> m && m < mk).sort();
  const prev = months.pop();
  if(prev){
    const est = waterForExactMonth(key, prev);
    if(est) return withTotal(est, {source:'estimate', fromMonth: prev});
  }
  return {source:'none', items: [], total: 0};
}

/* ---- الكهرباء ---- */
function daysInMonthOf(mk){
  const [y,m] = mk.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function daysBetween(fromDate, toDate){
  const a = Date.UTC(...fromDate.split('-').map((v,i)=> i===1 ? Number(v)-1 : Number(v)));
  const b = Date.UTC(...toDate.split('-').map((v,i)=> i===1 ? Number(v)-1 : Number(v)));
  return Math.round((b - a) / 86400000);
}
function shortDate(d){ return Number(d.slice(8,10)) + '/' + Number(d.slice(5,7)); }

/* كهرباء الكارت في الشهر: كل شحنة بتتوزع بالتساوي على الأيام من تاريخها لحد الشحنة اللي بعدها،
   والشهر بياخد الأيام اللي وقعت جواه (فعلي). الأيام من آخر شحنة لآخر الشهر لسه مالهاش شحنة بعدها،
   فبتتحسب بمتوسط اليوم (كل الشحنات من أول شحنة لآخر شحنة ÷ الأيام بينهم) كتقدير لحد ما تتسجّل الشحنة الجاية.
   الأيام اللي قبل أول شحنة متسجّلة مش محسوبة. الشهر بيبقى نهائي أول ما تتسجّل شحنة بعد آخره. */
function computeMonthElectricity(key, mk){
  const dim = daysInMonthOf(mk);
  const mStart = mk + '-01';
  const mEnd = shiftMonth(mk, 1) + '-01';     // أول يوم في الشهر اللي بعده (مش داخل)
  const overlap = (from, to)=>{               // عدد أيام [from, to) اللي جوه الشهر
    const s = from > mStart ? from : mStart;
    const e = to < mEnd ? to : mEnd;
    return s < e ? daysBetween(s, e) : 0;
  };
  // الشحنات بتاريخها (شحنتين في نفس اليوم = شحنة واحدة)
  const byDate = {};
  state.expenses.filter(e=> e.date && expenseKind(e)===key).forEach(e=>{
    const d = e.date.slice(0,10);
    byDate[d] = (byDate[d]||0) + (Number(e.amount)||0);
  });
  const charges = Object.keys(byDate).sort().map(d=> ({date:d, amount:byDate[d]}));
  // فواتير/التزامات كهرباء قديمة على العمارة بتتضاف على الشهر بتاعها
  const extras = shareCommitments().filter(c=> commitKind(c)===key)
    .map(c=> ({c, amt: commitmentAmountForMonth(c, mk)})).filter(x=> x.amt > 0)
    .map(x=> commitmentItem(x.c, x.amt));
  const extraTotal = extras.reduce((s,x)=> s+x.amount, 0);
  let r;
  if(charges.length >= 2){
    const periods = [];
    for(let i=0; i<charges.length-1; i++){
      const from = charges[i].date, to = charges[i+1].date;
      const days = daysBetween(from, to);
      const inMonth = overlap(from, to);
      if(inMonth > 0) periods.push({from, to, amount:charges[i].amount, days, rate:charges[i].amount/days, inMonth, share:charges[i].amount*inMonth/days});
    }
    const first = charges[0].date, last = charges[charges.length-1].date;
    const closedTotal = charges.slice(0,-1).reduce((s,c)=> s+c.amount, 0);
    const avgRate = closedTotal / daysBetween(first, last);
    const openDays = overlap(last, '9999-12-31');
    const actual = periods.reduce((s,p)=> s+p.share, 0);
    const estimate = avgRate * openDays;
    r = {method:'periods', periods, first, last, lastAmount:charges[charges.length-1].amount, avgRate, openDays,
         actual, estimate, beforeFirst: overlap('0000-01-01', first), daysInMonth:dim, cardAmount: actual + estimate};
  } else {
    // مفيش شحنتين بتاريخين مختلفين لسه ← الشحنات اللي اتدفعت فعلًا في الشهر ده
    const inMonth = charges.filter(c=> c.date.slice(0,7)===mk);
    r = {method:'actual', charges: inMonth, daysInMonth:dim, cardAmount: inMonth.reduce((s,c)=> s+c.amount, 0)};
  }
  r.extras = extras;
  r.total = r.cardAmount + extraTotal;
  return r;
}

/* ---- أي نوع تاني: مصروفات الشهر + التزامات الشهر، أو مبلغ ثابت شهريًا لو متحدد ---- */
function computeKindMonth(kind, mk){
  if(kind.method==='water') return computeMonthWater(kind.key, mk);
  if(kind.method==='electricity') return computeMonthElectricity(kind.key, mk);
  const exps = state.expenses.filter(e=> e.date && expenseKind(e)===kind.key);
  const commits = shareCommitments().filter(c=> commitKind(c)===kind.key);
  const items = exps.filter(e=> e.date.slice(0,7)===mk).map(expenseItem)
    .concat(commits.map(c=> ({c, amt: commitmentAmountForMonth(c, mk)})).filter(x=> x.amt > 0).map(x=> commitmentItem(x.c, x.amt)));
  const recorded = items.reduce((s,x)=> s+x.amount, 0);
  const fixed = Number(kind.fixedMonthly)||0;
  if(fixed > 0){
    const firstMonth = exps.map(e=> e.date.slice(0,7)).concat(commits.map(c=> commitBillMonth(c))).filter(Boolean).sort()[0];
    const on = !!firstMonth && mk >= firstMonth;
    return {source: on ? 'fixed' : 'none', items, paid: recorded, total: on ? fixed : 0};
  }
  return {source:'recorded', items, total: recorded};
}

function computeResidentShares(mk){
  const active = state.apartments.filter(a=> isOccupiedInMonth(a, mk));
  const n = active.length;
  const m = active.filter(a=> elevatorFor(a, mk)).length;
  const k = n - m;
  const lines = expenseKinds().map(kind=>{
    const r = computeKindMonth(kind, mk);
    const total = r.total || 0;
    let allPart = 0, elevPart = 0, nonPart = 0;
    if(kind.split==='elevator') elevPart = total;
    else if(kind.split==='nonElevator') nonPart = total;
    else if(kind.split==='mixed'){
      allPart = total * Math.max(0, Math.min(100, Number(kind.allPct)||0)) / 100;
      elevPart = total - allPart;
    }
    else allPart = total;
    // لو مفيش حد في المجموعة دي الشهر ده، نصيبها بيتوزع على الكل عشان المصروف يتغطى
    let spilled = 0;
    if(elevPart && !m){ spilled += elevPart; allPart += elevPart; elevPart = 0; }
    if(nonPart && !k){ spilled += nonPart; allPart += nonPart; nonPart = 0; }
    const perAll = n ? allPart / n : 0;
    const perElev = m ? elevPart / m : 0;
    const perNon = k ? nonPart / k : 0;
    return {kind, r, total, allPart, elevPart, nonPart, spilled, perAll, perElev, perNon,
            sub: perAll + perElev, non: perAll + perNon};
  });
  const subscriber = lines.reduce((s,l)=> s+l.sub, 0);
  const nonSubscriber = lines.reduce((s,l)=> s+l.non, 0);
  return {mk, n, m, k, lines, subscriber, nonSubscriber};
}

function fmt1(n){
  return (Math.round(n*10)/10).toLocaleString('en-US', {maximumFractionDigits:1});
}
function fmt2(n){
  return (Math.round(n*100)/100).toLocaleString('en-US', {maximumFractionDigits:2});
}

function lineTag(l){
  if(l.kind.method==='water' && l.r.source==='estimate') return ' (تقدير)';
  if(l.kind.method==='electricity' && l.r.estimate > 0) return ' (فيها تقدير)';
  if(l.r.items && l.r.items.some(x=> String(x.sub).startsWith('⏳'))) return ' (لسه علينا)';
  return '';
}

function showSharesPopup(){

  const itemRows = list => list.map(x=>{
    const sub = String(x.sub||'');
    const pending = sub.startsWith('⏳');
    const subHtml = sub ? (pending ? badge(escapeHtml(sub.replace(/^⏳\s*/, '')), 'warn') : escapeHtml(sub)) : '';

  let html = `<div class="popup-head"><h3>نصيب الساكن — ${monthLabel(s.mk)}</h3><button class="popup-close" aria-label="إغلاق">✕</button></div>
    <div class="pp-chips">
      <span class="pp-chip"><b class="num">${s.n}</b> ساكن نشط</span>
      <span class="pp-chip"><b class="num">${s.m}</b> مشترك أسانسير</span>
      <span class="pp-chip"><b class="num">${s.k}</b> مش مشترك</span>
    </div>

    <div class="pp-summary">
      <div class="pp-sum-tile"><span>🛗 مشترك في الأسانسير</span><b class="num">${fmt(s.subscriber)}</b><small>جنيه للشقة</small></div>
      <div class="pp-sum-tile"><span>🚶 مش مشترك</span><b class="num">${fmt(s.nonSubscriber)}</b><small>جنيه للشقة</small></div>
    </div>

    <div class="pp-sec">
      <div class="pp-sec-head"><span class="pp-sec-title">التفصيل حسب البند</span></div>
      <div class="pp-grid">
        <div class="h">البند</div><div class="h n">مشترك</div><div class="h n">مش مشترك</div>
        ${shown.filter(l=> l.total > 0).map(l=> `<div>${escapeHtml(kindName(l.kind.key))}</div><div class="n">${l.sub ? fmt1(l.sub) : '—'}</div><div class="n">${l.non ? fmt1(l.non) : '—'}</div>`).join('')}
        <div class="tot">الإجمالي</div><div class="n tot">${fmt(s.subscriber)}</div><div class="n tot">${fmt(s.nonSubscriber)}</div>
      </div>
      <div class="pp-foot">طريقة تقسيم كل بند بتتغيّر من تبويب الإعدادات.</div>
    </div>`;

  shown.forEach(l=>{
    const kind = l.kind, r = l.r;
    html += `<div class="pp-sec">
      <div class="pp-sec-head"><span class="pp-sec-title">${escapeHtml(kindName(kind.key))}</span><span class="pp-split">${escapeHtml(splitText(kind))}</span></div>`;
    if(kind.method==='water'){
      html += waterSourceNote(r, s.mk) + itemRows(r.items);
    } else if(kind.method==='electricity'){
      if(r.method==='periods'){
        html += `<div class="pp-note">كل شحنة بتتوزع على الأيام لحد الشحنة اللي بعدها، والشهر بياخد الأيام اللي وقعت جواه بس.</div>`;
        html += `<div class="pp-table">
          <div class="h">الفترة</div><div class="h n">الشحنة</div><div class="h n">الأيام</div><div class="h n">في اليوم</div><div class="h n">على الشهر</div>`;
        html += r.periods.map(p=> `
          <div>${shortDate(p.from)} ← ${shortDate(p.to)}</div>
          <div class="n">${fmt(p.amount)}</div>
          <div class="n">${p.inMonth < p.days ? `${p.inMonth}<small> من ${p.days}</small>` : p.days}</div>
          <div class="n">${fmt1(p.rate)}</div>
          <div class="n strong">${fmt(p.share)}</div>`).join('');
        if(r.openDays > 0) html += `
          <div class="est">من ${shortDate(r.last)} ${badge('لسه شغالة','soft')}</div>
          <div class="n est">${fmt(r.lastAmount)}</div>
          <div class="n est">${r.openDays}</div>
          <div class="n est">≈ ${fmt2(r.avgRate)}</div>
          <div class="n strong est">${fmt(r.estimate)}</div>`;
        html += `</div>`;
        if(r.beforeFirst > 0) html += `<div class="pp-foot">${r.beforeFirst} يوم في الشهر قبل أول شحنة متسجّلة (${shortDate(r.first)}) مش محسوبين.</div>`;
        html += row('كهرباء الكارت في ' + monthLabel(s.mk), fmt(r.cardAmount), 'total',
          (r.estimate > 0 && r.actual > 0) ? `${fmt(r.actual)} فعلي + ${fmt(r.estimate)} تقدير` : '');
        if(r.estimate > 0) html += `<div class="pp-foot">التقدير = متوسط استهلاك اليوم من أول شحنة لآخر شحنة، وبيتظبط لوحده أول ما تسجّل الشحنة الجاية.</div>`;
      } else {
        html += `<div class="pp-note">لسه مفيش شحنتين بتاريخين مختلفين عشان نحسب متوسط اليوم، فبنستخدم الشحنات اللي اتدفعت فعلًا في الشهر ده.</div>`;
        html += r.charges.map(c=> row(escapeHtml(c.note), fmt(c.amount), '', escapeHtml(c.date))).join('');
      }
      if(r.extras.length) html += `<div class="pp-subtitle">التزامات كهرباء على الشهر ده</div>` + itemRows(r.extras);
    } else if(r.source==='fixed'){
      html += `<div class="pp-note">مبلغ ثابت <b class="num">${fmt(kind.fixedMonthly)}</b> جنيه كل شهر. اتدفع منه لحد دلوقتي <b class="num">${fmt(r.paid)}</b> — الدفعات للمتابعة بس ومش بتغيّر النصيب.</div>`
        + (r.paid > Number(kind.fixedMonthly) ? `<div class="pp-note warn">المدفوع أكتر من الثابت: لو فيه مصروف زيادة (إصلاح مثلًا) مش من الاشتراك، غيّر نوعه لنوع من غير مبلغ ثابت عشان يتحسب.</div>` : '')
        + itemRows(r.items);
    } else if(r.source==='none' && Number(kind.fixedMonthly) > 0){
      html += `<div class="pp-note">مبلغ ثابت شهريًا، بس بيبدأ من أول شهر اتسجّل فيه النوع ده (بعد الشهر ده).</div>`;
    } else {
      html += itemRows(r.items);
    }
    if(l.total <= 0){
      if(!(r.source==='none' && Number(kind.fixedMonthly) > 0) && kind.method!=='water') html += `<div class="pp-foot">مفيش حاجة متسجّلة في الشهر ده.</div>`;
    } else {
      if(!(kind.method==='electricity' && r.method==='periods' && !r.extras.length)) html += row('الإجمالي', fmt(l.total), 'total');
      const split = (label, part, cnt, per)=> row(label, `${fmt1(per)}<small> للشقة</small>`, 'split', `${fmt(part)} جنيه ÷ ${cnt} شقة`);
      if(l.allPart) html += split('على كل السكان', l.allPart, s.n, l.perAll);
      if(l.elevPart) html += split('على مشتركين الأسانسير', l.elevPart, s.m, l.perElev);
      if(l.nonPart) html += split('على غير المشتركين', l.nonPart, s.k, l.perNon);
      if(l.spilled) html += `<div class="pp-foot">مفيش حد في المجموعة المحددة الشهر ده، فـ ${fmt(l.spilled)} اتوزعت على كل السكان.</div>`;
    }
    html += `</div>`;
  });

  closeSharesPopup();
  const ov = document.createElement('div');
  ov.id = 'sharesPopup';
  ov.className = 'popup-overlay';
  ov.innerHTML = `<div class="popup-box" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener('click', ev=>{
    if(ev.target === ov || ev.target.closest('.popup-close')) closeSharesPopup();
  });
  document.body.appendChild(ov);
}

function bindSettingsEvents(){
  const kinds = ()=> state.settings.expenseKinds;
  const find = key=> kinds().find(k=> k.key===key);
  const save = ()=>{ persist(); renderAll(); };
  const obl = document.querySelector('[data-rp-obl]');
  if(obl) obl.addEventListener('change', ()=>{ if(!unlocked) return; state.settings.reportShowObligations = obl.checked; persist(); });
  const note = document.querySelector('[data-rp-note]');
  if(note) note.addEventListener('change', ()=>{ if(!unlocked) return; state.settings.reportNote = note.value; persist(); });
  const pay = document.querySelector('[data-rp-pay]');
  if(pay) pay.addEventListener('change', ()=>{ if(!unlocked) return; state.settings.paymentOptions = pay.value; persist(); });
  document.querySelectorAll('[data-k-icon]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked) return;
    const k = find(inp.dataset.kIcon); if(!k) return;
    k.icon = inp.value.trim(); save();
  }));
  document.querySelectorAll('[data-k-label]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked) return;
    const k = find(inp.dataset.kLabel); if(!k) return;
    const label = inp.value.trim();
    if(!label){ renderAll(); return; }
    k.label = label;
    state.expenses.forEach(e=>{ if(e.kind===k.key) e.category = label; }); // الفئة المعروضة في المصروفات تفضل زي اسم النوع
    save();
  }));
  document.querySelectorAll('[data-k-split]').forEach(sel=> sel.addEventListener('change', ()=>{
    if(!unlocked) return;
    const k = find(sel.dataset.kSplit); if(!k) return;
    k.split = sel.value;
    if(k.split==='mixed' && typeof k.allPct !== 'number') k.allPct = 70;
    save();
  }));
  document.querySelectorAll('[data-k-pct]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked) return;
    const k = find(inp.dataset.kPct); if(!k) return;
    k.allPct = Math.max(0, Math.min(100, Number(inp.value)||0)); save();
  }));
  document.querySelectorAll('[data-k-fixed]').forEach(inp=> inp.addEventListener('change', ()=>{
    if(!unlocked) return;
    const k = find(inp.dataset.kFixed); if(!k) return;
    const v = Math.max(0, Number(inp.value)||0);
    if(v > 0) k.fixedMonthly = v; else delete k.fixedMonthly;
    save();
  }));
  document.querySelectorAll('[data-k-del]').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!unlocked) return;
    const key = btn.dataset.kDel;
    const used = kindUsageCount(key);
    if(used > 0){ alert('النوع ده مستخدم في ' + used + ' مصروف/التزام — غيّر نوعهم الأول وبعدين امسحه.'); return; }
    if(!confirm('تمسح النوع "' + kindInfo(key).label + '"؟')) return;
    state.settings.expenseKinds = kinds().filter(k=> k.key!==key);
    save();
  }));
  const addForm = document.getElementById('addKindForm');
  if(addForm) addForm.addEventListener('submit', e=>{
    e.preventDefault();
    if(!unlocked) return;
    const f = e.target;
    const label = f.label.value.trim();
    if(!label){ alert('اكتب اسم النوع'); return; }
    if(kinds().some(k=> normalizeSearch(k.label)===normalizeSearch(label))){ alert('فيه نوع بنفس الاسم ده'); return; }
    const k = {key:'k' + Date.now(), label, icon: f.icon.value.trim() || '🏷', split: f.split.value};
    if(k.split==='mixed') k.allPct = 70;
    const fixed = Number(f.fixedMonthly.value)||0;
    if(fixed > 0) k.fixedMonthly = fixed;
    kinds().push(k);
    save();
  });
}

document.addEventListener('keydown', e=>{

  document.querySelectorAll('.popup-overlay').forEach(ov=> ov.remove());

});

function tplOverview(){

function renderOverviewData(){
  const facade = document.getElementById('facade');
  if(!facade) return; // مش واقفين في تاب "نظرة عامة" دلوقتي، مفيش عناصر نرندر فيها
  facade.classList.toggle('locked', !unlocked);

  const groups = apartmentsByFloor();
  facade.innerHTML = '';
  FLOOR_ORDER.filter(f=>groups[f]).forEach(floor=>{
    const row = document.createElement('div');
    row.className='floor-row';
    const label = document.createElement('div');
    label.className='floor-label';
    label.textContent = floor;
    row.appendChild(label);
    const wins = document.createElement('div');
    wins.className='windows';
    groups[floor].forEach(apt=>{
      const st = statusFor(apt, currentMonth);
      // مأهولة ولا لأ في الشهر المعروض (مش النهارده) — عشان الشهور القديمة تبان صح
      const occInMonth = isOccupiedInMonth(apt, currentMonth);
      const w = document.createElement('div');
      w.className = 'win ' + st;
      const resName = residentNameFor(apt, currentMonth);
      w.title = (occInMonth ? (resName||'—') : 'شاغرة') + ' — ' + apt.id + ' — اضغط لكشف الحساب';
      const dot = document.createElement('div');
      dot.className = 'occ-dot ' + (occInMonth ? 'occ-yes' : 'occ-no');
      w.appendChild(dot);
      const numEl = document.createElement('div');
      numEl.className = 'apt-num';
      numEl.textContent = apt.id;
      w.appendChild(numEl);
      if(occInMonth){
        const nameEl = document.createElement('div');
        nameEl.className = 'apt-name';
        nameEl.textContent = resName || '';
        w.appendChild(nameEl);
      }
      if(occInMonth){
        const subEl = document.createElement('div');
        subEl.className = 'apt-sub';
        subEl.textContent = fmt(subscriptionFor(apt, currentMonth)) + ' ج';
        w.appendChild(subEl);
      }
      const statusEl = document.createElement('div');
      statusEl.className = 'apt-status';
      statusEl.textContent = st==='vacant' ? 'غير مأهولة'
        : st==='paid' ? 'تم الدفع'
        : st==='partial' ? 'دفع جزء'
        : 'لسه مدفعش';
      w.appendChild(statusEl);
      // الضغط على الشباك بيفتح كشف حساب الشقة (ومنه الدفع والتعديل)
      w.addEventListener('click', ()=> showStatement(apt.id));
      wins.appendChild(w);
    });
    row.appendChild(wins);
    facade.appendChild(row);
  });

  const {expected, collected, outstanding} = computeMonthTotals(currentMonth);
  const balance = computeFundBalance();
  const monthExpenses = computeMonthExpenses(currentMonth);
  const totalArrears = computeArrears().reduce((s,a)=>s+a.total,0);
  const totalApts = state.apartments.length;
  const occupiedCount = state.apartments.filter(a=>isOccupiedInMonth(a, currentMonth)).length;
  const vacantCount = totalApts - occupiedCount;
  const elevatorSubCount = state.apartments.filter(a=>a.elevator).length;
  const totalObligations = computeTotalObligations();
  const netKPI = balance - totalObligations;
  const elevatorFund = computeElevatorFundBalance();

  const balanceHero = document.getElementById('balanceHero');
  balanceHero.classList.toggle('balance-neg', balance<0);
  balanceHero.innerHTML = `<span class="icon3d lg gold" style="margin-bottom:6px;">🏦</span><div class="lbl">رصيد الصندوق</div><div class="val num">${fmt(balance)} <span style="font-size:14px;font-weight:400">جنيه</span></div>`;

  const stats = document.getElementById('stats');
  stats.innerHTML = `
    <div class="stat"><div class="stat-head"><span class="icon3d sm">📊</span><div class="lbl">المتوقع الشهر ده</div></div><div class="val num">${fmt(expected)}</div></div>
    <div class="stat"><div class="stat-head"><span class="icon3d sm gold">✅</span><div class="lbl">المحصّل</div></div><div class="val num">${fmt(collected)} <span style="font-size:11px;color:#bdeed7">/ متبقي ${fmt(outstanding)}</span></div></div>
    <div class="stat"><div class="stat-head"><span class="icon3d sm">💸</span><div class="lbl">مصروفات الشهر</div></div><div class="val num">${fmt(monthExpenses)}</div></div>
    <div class="stat ${totalArrears>0?'balance-neg':''}"><div class="stat-head"><span class="icon3d sm">⏳</span><div class="lbl">إجمالي المتأخرات</div></div><div class="val num">${fmt(totalArrears)}</div></div>
    <div class="stat"><div class="stat-head"><span class="icon3d sm">🏠</span><div class="lbl">الشقق</div></div><div class="val num">${totalApts} <span style="font-size:11px;color:#c7d7f5">(${occupiedCount} مأهولة / ${vacantCount} غير مأهولة)</span></div></div>
    <div class="stat"><div class="stat-head"><span class="icon3d sm">🛗</span><div class="lbl">مشتركين الأسانسير</div></div><div class="val num">${elevatorSubCount} <span style="font-size:11px;color:#c7d7f5">من ${totalApts} شقة</span></div></div>
    <div class="stat ${totalObligations>0?'balance-neg':''}"><div class="stat-head"><span class="icon3d sm">📋</span><div class="lbl">إجمالي الالتزامات المتبقية</div></div><div class="val num">${fmt(totalObligations)}</div></div>
    <div class="stat ${netKPI<0?'balance-neg':''}"><div class="stat-head"><span class="icon3d sm">⚖️</span><div class="lbl">الفائض / العجز بعد الالتزامات</div></div><div class="val num">${fmt(netKPI)}</div></div>
    <div class="stat"><div class="stat-head"><span class="icon3d sm">🛗</span><div class="lbl">رصيد مشتركي الأسانسير</div></div><div class="val num">${fmt(elevatorFund)} <span style="font-size:11px;color:#c7d7f5">من ${fmt(balance)} إجمالي</span></div></div>
    <div class="stat"><div class="stat-head"><span class="icon3d sm gold">👥</span><div class="lbl">رصيد عام لكل السكان (غير الأسانسير)</div></div><div class="val num">${fmt(balance-elevatorFund)}</div></div>
  `;

  const collectionPct = expected>0 ? Math.round((collected/expected)*100) : 0;
  const cpEl = document.getElementById('collectionProgress');
  if(cpEl){
    cpEl.innerHTML = `
      <div class="cp-head">
        <div class="lbl">📥 نسبة التحصيل — ${monthLabel(currentMonth)}</div>
        <div class="pct">${collectionPct}%</div>
      </div>
      <div class="cp-track"><div class="cp-fill ${collectionPct<50?'cp-low':''}" style="width:${Math.min(collectionPct,100)}%"></div></div>
      <div class="cp-sub"><span>محصّل: ${fmt(collected)}</span><span>من المتوقع: ${fmt(expected)}</span></div>
    `;
  }
  renderShareCard();
}

function quickTogglePaid(aptId){
  if(!unlocked) return;
  const apt = state.apartments.find(a=>a.id===aptId);
  if(!apt) return;
  if(!state.payments[currentMonth]) state.payments[currentMonth]={};
  if(!state.paymentDates[currentMonth]) state.paymentDates[currentMonth]={};
  const current = state.payments[currentMonth][aptId]||0;
  const sub = subscriptionFor(apt, currentMonth);
  const goingToZero = current>=sub;
  state.payments[currentMonth][aptId] = goingToZero ? 0 : sub;
  if(goingToZero){
    delete state.paymentDates[currentMonth][aptId];
  } else {
    state.paymentDates[currentMonth][aptId] = collectDate;
  }
  persist();
  renderAll();
}

function renderAll(){
  renderHero();
  // لو التحديث التلقائي (كل 20 ثانية) رسم الشاشة وانت بتكتب في خانة البحث، نرجّع المؤشر مكانه
  const focused = document.activeElement;
  const keepSearchFocus = focused && focused.id === 'fundSearch';
  const caret = keepSearchFocus ? focused.selectionStart : null;
  const c = document.getElementById('content');
  c.classList.toggle('locked', !unlocked);
  // أزرار النسخة الاحتياطية/الاسترجاع ظاهرة بس في وضع التعديل (بعد الرمز السري)
  const backupRow = document.getElementById('backupRow');
  if(backupRow) backupRow.style.display = unlocked ? 'flex' : 'none';
  let banner = unlocked ? '' : `<div class="view-only-banner">👁 وضع العرض فقط</div>`;
  if(currentTab==='overview') c.innerHTML = banner + tplOverview();
  if(currentTab==='collect') c.innerHTML = banner + tplCollect();
  if(currentTab==='balance') c.innerHTML = banner + tplResidentsBalance();
  if(currentTab==='arrears') c.innerHTML = banner + tplArrearsReport();
  if(currentTab==='commitments') c.innerHTML = banner + tplBuildingCommitments();
  if(currentTab==='expenses') c.innerHTML = banner + tplExpenses();
  if(currentTab==='fund') c.innerHTML = banner + tplFund();
  if(currentTab==='plans') c.innerHTML = banner + tplPlans();
  if(currentTab==='apts') c.innerHTML = banner + tplApts();
  if(currentTab==='settings') c.innerHTML = banner + tplSettings();
  renderOverviewData();
  bindTabEvents();
  refreshStatement();
  if(keepSearchFocus){
    const s = document.getElementById('fundSearch');
    if(s){ s.focus(); try{ s.setSelectionRange(caret, caret); }catch(e){} }
  }
}

function collectTabCommitmentIds(){
  let ids = [];
  (state.apartments||[]).filter(a=> isOccupiedInMonth(a, currentMonth)).forEach(apt=>{
    aptCommitments(apt.id).forEach(c=>{
      const rem = commitmentRemaining(c, currentMonth);
      if(c.type!=='monthly' && rem<=0) return;
      ids.push(c.id);
    });
  });
  return ids;
}

        </div></div>`;
    });
  }
  html += `</div>`;
  if(settleableSubs.length>0){
    html += `
    <div class="section-title">✅ خصم نصيب المشتركين من المستحق عليهم</div>

    <div class="card">

function tplCommitmentsBlock(){

            ${monthKeys.map(mk=>`
            <th style="padding:10px 8px; text-align:center; color:rgba(255,255,255,.8); font-family:'IBM Plex Mono'; font-size:11.5px; white-space:nowrap; min-width:72px;">${monthLabel(mk)}</th>`).join('')}

            </td>` : ''}
            <td style="padding:10px 8px; text-align:center; font-family:'IBM Plex Mono'; font-weight:700; font-size:14px; color:var(--lit);">
              ${fmt(arrears.reduce((s,a)=>s+a.total,0))}
            </td>
            <td></td>
          </tr>
        </tfoot>
      </table>
      </div>
    </div>`;
  }
  return html;
}

/* تقرير المتأخرات: HTML واحد بيستعمله "تنزيل PDF" (طباعة المتصفح) و"مشاركة" (ملف PDF بيتعمل في البرنامج). */
function arrearsReportHtml(){
  const arrears = computeArrears();
  if(!arrears.length) return null;
  const asOf = arrearsAsOfMonth();
  const total = arrears.reduce((s,a)=> s+a.total, 0);
  // عمود لكل شهر فيه متأخرات (الأقدم الأول)، وعمود للديون/الالتزامات لو فيه
  const monthKeys = [...new Set(arrears.flatMap(a=> a.items.filter(m=> m.mk).map(m=> m.mk)))].sort();
  const debtOf = a=> a.items.filter(m=> m.commitId).reduce((x,m)=> x+m.owed, 0);
  const hasDebts = arrears.some(a=> debtOf(a) > 0);
  const debtsTotal = arrears.reduce((s,a)=> s + debtOf(a), 0);
  const monthTotals = monthKeys.map(mk=> arrears.reduce((s,a)=> s + ((a.items.find(m=> m.mk===mk)||{}).owed||0), 0));
  const monthCounts = monthKeys.map(mk=> arrears.filter(a=> a.items.some(m=> m.mk===mk)).length);
  const rows = arrears.map((a, i)=>{
    const debts = a.items.filter(m=> m.commitId);
    return `<tr>
      <td class="c">${i+1}</td>
      <td><b>${escapeHtml(a.name||'—')}</b>${a.past ? '<div class="pr-sub">ساكن سابق</div>' : ''}</td>
      <td class="c num">${escapeHtml(a.apt.id)}<div class="pr-sub">${escapeHtml(a.apt.floor||'')}</div></td>
      ${monthKeys.map(mk=>{
        const it = a.items.find(m=> m.mk===mk);
        return it ? `<td class="c num owed">${fmt(it.owed)}</td>` : `<td class="c nil">—</td>`;
      }).join('')}
      ${hasDebts ? `<td class="c">${debts.length ? `<span class="num owed">${fmt(debtOf(a))}</span><div class="pr-sub">${debts.map(m=> escapeHtml(m.label.replace(/^دين:\s*/, ''))).join('، ')}</div>` : '<span class="nil">—</span>'}</td>` : ''}
      <td class="c num"><b>${fmt(a.total)}</b></td>
    </tr>`;
  }).join('');
  const now = new Date();
  const printed = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  const html = `
    <div class="pr-head">
      <div>
        <div class="pr-title">برج الأندلس — متأخرات السكان</div>
        <div class="pr-meta">لحد شهر ${monthLabel(asOf)} · اتطلع يوم ${printed}</div>
      </div>
      <div class="pr-total"><span>إجمالي المتأخرات</span><b class="num">${fmt(total)}</b><small>جنيه · ${arrears.length} ساكن</small></div>
    </div>
    <table class="pr-table">
      <thead><tr>
        <th class="c">#</th><th>الساكن</th><th class="c">الشقة</th>
        ${monthKeys.map(mk=> `<th class="c">${monthLabel(mk)}</th>`).join('')}
        ${hasDebts ? '<th class="c">ديون / التزامات</th>' : ''}
        <th class="c">الإجمالي</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr><td colspan="3">إجمالي الشهر</td>
          ${monthTotals.map(v=> `<td class="c num">${fmt(v)}</td>`).join('')}
          ${hasDebts ? `<td class="c num">${fmt(debtsTotal)}</td>` : ''}
          <td class="c num grand">${fmt(total)}</td></tr>
        <tr class="cnt"><td colspan="3">عدد المتأخرين</td>
          ${monthCounts.map(v=> `<td class="c">${v}</td>`).join('')}
          ${hasDebts ? `<td class="c">${arrears.filter(a=> debtOf(a) > 0).length}</td>` : ''}
          <td class="c">${arrears.length}</td></tr>
      </tfoot>
    </table>
    <div class="pr-foot">المبالغ بالجنيه. المتأخر = الاشتراك الشهري ناقص المدفوع، لحد ${monthLabel(asOf)}.</div>`;
  // لو الشهور كتير الصفحة بتتقلب بالعرض عشان الأعمدة تفضل مقروءة
  return {html: html + arrearsReportExtrasHtml(total), asOf, total, count: arrears.length, landscape: monthKeys.length + (hasDebts ? 1 : 0) > 6};
}

/* تحت جدول المتأخرات: الالتزامات اللي على العمارة، رصيد الصندوق قصادها، رسالة للسكان، وطرق السداد.
   الأرقام هي نفس "إجمالي الالتزامات المتبقية" و"الفائض / العجز" اللي في نظرة عامة. */
function arrearsReportExtrasHtml(arrearsTotal){
  const s = state.settings;
  const showObl = s.reportShowObligations !== false;
  const balance = computeFundBalance();
  const obligations = (state.commitments||[]).filter(c=> !c.aptId)
    .map(c=> ({c, rem: commitmentTotalRemaining(c), paid: commitmentPaidTotal(c),
               full: c.type==='installment' ? (Number(c.totalAmount)||0) : commitmentTotalDue(c, currentMonth)}))
    .filter(x=> x.rem > 0);
  const oblTotal = obligations.reduce((sum,x)=> sum + x.rem, 0);
  const gap = balance - oblTotal;
  let html = '';
  if(showObl && obligations.length){
    html += `<div class="pr-block">
      <div class="pr-sec-title">📋 الالتزامات اللي على العمارة</div>
      <table class="pr-table">
        <thead><tr><th>البيان</th><th class="c">النوع</th><th class="c">المبلغ</th><th class="c">اتدفع</th><th class="c">المتبقي</th></tr></thead>
        <tbody>${obligations.map(x=> `<tr>
          <td>${escapeHtml(x.c.note || COMMITMENT_TYPES[x.c.type])}</td>
          <td class="c">${escapeHtml(kindName(commitKind(x.c)))}</td>
          <td class="c num">${fmt(x.full)}</td>
          <td class="c num">${x.paid ? fmt(x.paid) : '—'}</td>
          <td class="c num owed">${fmt(x.rem)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="4">إجمالي الالتزامات</td><td class="c num grand">${fmt(oblTotal)}</td></tr></tfoot>
      </table>
    </div>
    <div class="pr-block pr-summary">
      <div><span>رصيد الصندوق الحالي</span><b class="num">${fmt(balance)}</b></div>
      <div><span>إجمالي الالتزامات</span><b class="num">${fmt(oblTotal)}</b></div>
      <div class="${gap<0 ? 'neg' : 'pos'}"><span>${gap<0 ? 'العجز' : 'الفائض بعد الالتزامات'}</span><b class="num">${fmt(Math.abs(gap))}</b></div>
      <div><span>متأخرات السكان</span><b class="num">${fmt(arrearsTotal)}</b></div>
    </div>`;
  }
  const msg = (showObl && oblTotal > 0 && gap < 0)
    ? `برجاء سرعة سداد المتأخرات، حيث إن رصيد الصندوق الحالي (${fmt(balance)} جنيه) لا يغطي إجمالي الالتزامات المطلوبة على العمارة (${fmt(oblTotal)} جنيه) — والعجز ${fmt(-gap)} جنيه.`
    : 'برجاء سداد المتأخرات في أقرب وقت عشان نقدر نغطي مصاريف العمارة.';
  const note = String(s.reportNote||'').trim();
  html += `<div class="pr-block pr-msg">
    <div class="pr-msg-main">📢 ${msg}</div>
    ${note ? `<div class="pr-msg-note">${escapeHtml(note).replace(/\n/g, '<br>')}</div>` : ''}
  </div>`;
  const opts = String(s.paymentOptions||'').split('\n').map(x=> x.trim()).filter(Boolean);
  if(opts.length){
    html += `<div class="pr-block pr-pay">
      <div class="pr-sec-title">💳 طرق السداد</div>
      ${opts.map(o=> `<div class="pr-pay-item"><span class="pr-dot">●</span><span>${escapeHtml(o)}</span></div>`).join('')}
    </div>`;
  }
  return html;
}

/* تنزيل PDF: بنرسم التقرير في #printArea ونفتح شاشة الطباعة — ومنها "حفظ كـ PDF".
   الطباعة من المتصفح بتطلع العربي واتجاهه مظبوط على الموبايل والكمبيوتر من غير مكتبات. */
function exportArrearsPDF(){
  const rep = arrearsReportHtml();
  if(!rep){ alert('مفيش متأخرات — كله متسدد 🎉'); return; }
  const asOf = rep.asOf;
  document.getElementById('printArea').innerHTML = rep.html;
  let pageStyle = null;
  if(rep.landscape){
    pageStyle = document.createElement('style');
    pageStyle.textContent = '@media print{ @page{ size:A4 landscape; margin:10mm; } }';
    document.head.appendChild(pageStyle);
  }
  const oldTitle = document.title;
  document.title = 'متأخرات-السكان-' + asOf;           // ده اسم ملف الـ PDF المقترح
  document.body.classList.add('printing');
  const cleanup = ()=>{
    document.body.classList.remove('printing');
    document.title = oldTitle;
    if(pageStyle){ pageStyle.remove(); pageStyle = null; }
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(()=>{ window.print(); setTimeout(cleanup, 1500); }, 50);
}

/* المكتبات بتتحمّل أول مرة تدوس "مشاركة" بس، عشان فتح البرنامج يفضل سريع */
const PDF_LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
];
function loadScript(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[data-lib="${src}"]`)) return resolve();
    const s = document.createElement('script');
    s.src = src; s.dataset.lib = src;
    s.onload = resolve;
    s.onerror = ()=>{ s.remove(); reject(new Error('مش قادر يحمّل أداة الـ PDF — اتأكد من النت')); };
    document.head.appendChild(s);
  });
}

/* بيصوّر التقرير (نفس شكل الطباعة) ويحطه في صفحات A4 — التصوير بيحافظ على العربي واتجاهه زي ما هو على الشاشة */
async function buildArrearsPdfFile(rep){
  for(const src of PDF_LIBS) await loadScript(src);
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  const host = document.createElement('div');
  host.className = 'pdf-host' + (rep.landscape ? ' wide' : '');
  host.innerHTML = rep.html;
  document.body.appendChild(host);
  try{
    const scale = 2;
    // نهايات الصفوف (بالبكسل في الصورة) عشان الصفحة تتقطع بين صفين، مش في نص صف
    const top = host.getBoundingClientRect().top;
    const breaks = [...host.querySelectorAll('.pr-head, tr, .pr-foot, .pr-block')]
      .map(el=> Math.round((el.getBoundingClientRect().bottom - top) * scale));
    const canvas = await window.html2canvas(host, {scale, backgroundColor: '#ffffff', useCORS: true, logging: false});
    const pdf = new window.jspdf.jsPDF({unit: 'pt', format: 'a4', orientation: rep.landscape ? 'landscape' : 'portrait', compress: true});
    const pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight(), m = 24;
    const ratio = (pageW - 2*m) / canvas.width;
    const sliceH = Math.floor((pageH - 2*m) / ratio);        // ارتفاع الصفحة بالبكسل في الصورة
    for(let y = 0, page = 0; y < canvas.height; page++){
      let end = Math.min(y + sliceH, canvas.height);
      if(end < canvas.height){
        const fit = breaks.filter(b=> b > y && b <= end).pop();
        if(fit) end = fit;
      }
      const h = end - y;
      const part = document.createElement('canvas');
      part.width = canvas.width; part.height = h;
      const ctx = part.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, part.width, h);
      ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if(page) pdf.addPage();
      pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', m, m, pageW - 2*m, h * ratio);
      y = end;
    }
    return new File([pdf.output('blob')], 'متأخرات-السكان-' + rep.asOf + '.pdf', {type: 'application/pdf'});
  } finally {
    host.remove();
  }
}

function downloadFile(file){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

async function shareArrearsPDF(btn){
  const rep = arrearsReportHtml();
  if(!rep){ alert('مفيش متأخرات — كله متسدد 🎉'); return; }
  const label = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '⏳ بيجهّز الملف...'; }
  let file;
  try{
    file = await buildArrearsPdfFile(rep);
  }catch(e){
    console.error('pdf build failed', e);
    alert('الملف ما اتعملش: ' + e.message);
    return;
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = label; }
  }
  const data = {files: [file], title: 'متأخرات السكان', text: 'متأخرات السكان — برج الأندلس — لحد ' + monthLabel(rep.asOf) + ' (الإجمالي ' + fmt(rep.total) + ' جنيه)'};
  if(!(navigator.canShare && navigator.canShare({files: [file]}))){
    // الجهاز ده مابيدعمش مشاركة الملفات من المتصفح ← بننزّل الملف وتبعته انت
    downloadFile(file);
    alert('المتصفح ده مابيدعمش المشاركة المباشرة — نزّلتلك الملف، ابعته من الواتساب.');
    return;
  }
  try{
    await navigator.share(data);
  }catch(e){
    if(e && e.name === 'AbortError') return;                 // قفلت شاشة المشاركة بنفسك
    // تجهيز الملف خد وقت فالموبايل رفض يفتح المشاركة لوحده ← دوسة كمان وبس
    const ov = openPopup('sharePopup', popupHead('📤 الملف جاهز') + `
      <div class="pp-sec">
        <div class="pp-note">${escapeHtml(file.name)} — دوس الزرار عشان تختار الجروب.</div>
        <div class="pp-actions"><button type="button" class="pp-btn" id="shareNow">📤 مشاركة</button>
        <button type="button" class="pp-btn ghost" id="shareDownload">⬇ تنزيل بدل كده</button></div>
      </div>`);
    ov.querySelector('#shareNow').addEventListener('click', async ()=>{
      try{ await navigator.share(data); closePopup('sharePopup'); }
      catch(err){ if(!err || err.name !== 'AbortError'){ downloadFile(file); closePopup('sharePopup'); } }
    });
    ov.querySelector('#shareDownload').addEventListener('click', ()=>{ downloadFile(file); closePopup('sharePopup'); });
  }
}

function exportReportCSV(){
  const arrears = computeArrears();
  const totalOwed = arrears.reduce((s,a)=>s+a.total,0);
  const balance = computeFundBalance();
  const rows = [];
  rows.push(['التقارير المالية برج الاندلس', monthLabel(currentMonth)]);
  rows.push(['رصيد الصندوق', balance]);
  rows.push(['إجمالي المتأخرات', totalOwed]);
  rows.push([]);
  rows.push(['رقم الشقة','اسم الساكن','البنود المتأخرة','إجمالي المستحق']);
  arrears.forEach(a=>{
    rows.push([a.apt.id, (a.name||'—') + (a.past ? ' (ساكن سابق)' : ''), a.items.map(m=>m.label+' ('+m.owed+')').join(' / '), a.total]);
  });
  const csv = '\uFEFF' + rows.map(r=> r.map(cell=>{
    const s = String(cell==null?'':cell);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});

/* دبوس المرفق: بيفتح المرفق الموجود (على درايف أو محفوظ جوه الشيت من زمان)،
   أو لو مفيش مرفق بيعرض دبوس فاضي (في وضع التعديل بس) يقدر يضيف له مرفق بعدين.
   بيتستخدم مع أي حاجة عندها id + attachment: مصروف، حركة صندوق يدوية، سداد التزام، صرف أسانسير. */
function attachCellHtml(record){
  if(!record) return '';
  const att = record.attachment;
  if(att){
    return att.url
      ? `<a class="tx-attach" href="${escapeHtml(att.url)}" target="_blank" rel="noopener" title="فتح المرفق: ${escapeHtml(att.name)}">📎</a>`
      : `<a class="tx-attach" href="${att.dataUrl}" download="${escapeHtml(att.name)}" title="فتح المرفق: ${escapeHtml(att.name)}">📎</a>`;
  }
  return unlocked ? `<label class="tx-attach" title="إضافة مرفق" style="cursor:pointer; opacity:.55;">📎<input type="file" data-add-attach="${record.id}" accept="image/*,.pdf" style="display:none"></label>` : '';
}

/* بيدوّر على السجل (مصروف / حركة صندوق يدوية / سداد التزام / صرف أسانسير) بمعرّفه
   عبر المجموعات الأربعة، عشان دبوس "إضافة مرفق" يشتغل من أي تبويب. */
function findAttachableRecordById(id){
  return state.expenses.find(x=>x.id===id)
    || (state.fundLedger||[]).find(x=>x.id===id)
    || (state.commitmentPayments||[]).find(x=>x.id===id)
    || (state.elevatorSpends||[]).find(x=>x.id===id);
}

/* بيتأكد من حجم الملف، يضغطه لو صورة، ويرفعه على درايف لو فيه رابط رفع مضبوط.
   بيرجّع: attachment object لو نجح، null لو اتقرّر نكمّل من غير مرفق،
   undefined لو المستخدم عايز يلغي ويجرّب تاني (فشل الرفع ورفض "كمّل من غيره"). */
async function resolveAttachmentFile(file){
  const isImage = file.type && file.type.startsWith('image/');
  if(!isImage && file.size > 3*1024*1024){
    alert('حجم الملف كبير أوي (أكبر من 3 ميجا) — جرّب ملف أصغر.');
    return null;
  }
  let attachment;
  try{
    attachment = await fileToAttachment(file);
  }catch(err){
    console.error('attachment read failed', err);
    alert('مش قادر يقرا الملف ده.');
    return null;
  }
  const approxBytes = Math.round((attachment.dataUrl.length - attachment.dataUrl.indexOf(',') - 1) * 0.75);
  if(approxBytes > 3*1024*1024){
    alert('المرفق لسه كبير بعد الضغط (أكبر من 3 ميجا) — جرّب صورة أوضح أقل أو ملف مختلف.');
    return null;
  }
  if(ATTACH_UPLOAD_URL){
    try{
      return await uploadAttachmentToDrive(attachment);
    }catch(upErr){
      console.error('attachment upload failed', upErr);
      return confirm('المرفق ما اترفعش (' + upErr.message + ').\nتحب تكمّل من غير مرفق؟ (إلغاء = ارجع وجرّب تاني)') ? null : undefined;
    }
  }
  return attachment;
}

let fundSearchQuery = ''; // بيفضل محفوظ لما الشاشة تترسم تاني (تغيير الشهر، تحديث من الشيت...)

/* بيوحّد الكتابة عشان "احمد" يلاقي "أحمد" و"مياه" يلاقي "ميّاه" و"٥٠٠" يلاقي "500" */
function normalizeSearch(s){
  return String(s||'').toLowerCase()
    .replace(/[ً-ْـ]/g, '')          // تشكيل + تطويل
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/,/g, '');
}

function applyFundSearch(){
  const list = document.getElementById('fundLedgerList');
  if(!list) return;
  const terms = normalizeSearch(fundSearchQuery).split(/\s+/).filter(Boolean);
  let shown = 0, inSum = 0, outSum = 0;
  list.querySelectorAll('.tx-row[data-q]').forEach(row=>{
    const hit = terms.every(t => row.dataset.q.includes(t));
    row.style.display = hit ? '' : 'none';
    if(hit){
      shown++;
      const amt = Number(row.dataset.amt) || 0;
      if(amt < 0) outSum += -amt; else inSum += amt;
    }
  });
  const info = document.getElementById('fundSearchInfo');
  if(info){
    info.innerHTML = terms.length
      ? (shown
          ? `${shown} حركة — وارد <span class="num" style="color:var(--good)">+${fmt(inSum)}</span> · منصرف <span class="num" style="color:var(--bad)">-${fmt(outSum)}</span>`
          : 'مفيش حركات بالكلام ده')
      : '';
  }
}

/* ---------------- EVENTS ---------------- */
function bindCommitEditHandlers(){
  document.querySelectorAll('[data-edit-commit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!unlocked) return;
      editingCommitId = b.dataset.editCommit;
      renderAll();
    });
  });
  document.querySelectorAll('[data-cancel-edit-commit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!unlocked) return;
      editingCommitId = null;
      renderAll();
    });
  });
  document.querySelectorAll('[data-edit-commit-form]').forEach(f=>{
    f.addEventListener('submit', e=>{
      e.preventDefault();
      if(!unlocked) return;
      const c = state.commitments.find(x=>x.id===f.dataset.editCommitForm);
      const el = e.target;
      const newAmount = Number(el.amount.value)||0;
      const newType = el.type.value;
      const newTotalAmount = newType==='installment' ? (Number(el.totalAmount.value)||0) : null;
      if(newAmount<=0){ alert('لازم المبلغ يكون أكبر من صفر'); return; }
      if(newType==='installment' && newTotalAmount<=0){ alert('لازم تدخل الإجمالي المستهدف للقسط'); return; }
      c.type = newType;
      c.note = el.note.value;
      c.amount = newAmount;
      c.totalAmount = newTotalAmount;
      c.startMonth = el.startMonth.value || c.startMonth;
      c.fundType = el.isElevator && el.isElevator.checked ? 'elevator' : 'general';
      if(!c.aptId && el.kind && el.kind.value) c.kind = el.kind.value;
      editingCommitId = null;
      persist(); renderAll();
    });
  });
}

    bindCommitEditHandlers();

    });
    document.querySelectorAll('.pay-amount').forEach(inp=>{

      });

  if(currentTab==='commitments'){

      const group = f.targetGroup.value;

      const fundType = f.isElevator && f.isElevator.checked ? 'elevator' : 'general';
      if(!state.commitments) state.commitments=[];
      let targets = group==='allWithVacant' ? state.apartments.slice() : state.apartments.filter(a=>a.occupied);
      if(group==='elevator') targets = targets.filter(a=>a.elevator);
      else if(group==='noElevator') targets = targets.filter(a=>!a.elevator);
      if(total<=0 || targets.length===0){
        alert('لازم مبلغ أكبر من صفر، ولازم يكون فيه شقق في المجموعة اللي اخترتها.');

      }
      const count = targets.length;

          campaignId
        });
      });
      persist(); renderAll();
      alert(`تم توزيع ${fmt(total)} جنيه على ${count} شقة — نصيب كل شقة تقريبًا ${fmt(base)} جنيه.`);
